,"v":[["Mini pains de viande farcis au fromage","+200 g mozzarella râpée|produits laitiers"],["Pain de viande enrobé de bacon, glaçage érable-ketchup","+300 g bacon|viandes ; +60 ml sirop d'érable|épicerie"]],"t":"viande","sf":"patates_pilees","sv":"mais","tm":45,"tp":20},{"n":"Bavette de boeuf","e":"","m":["bavette","boeuf"],"nw":false,"i":[[1500.0,"g","bavette de boeuf","viandes"],[2.0,"un","gousses d'ail","fruits et légumes"]],"s":"Mélanger 60 ml d'huile, l'ail haché, 30 ml de sauce soya et du poivre. Badigeonner la bavette et laisser mariner au moins 30 min, ou toute la journée au réfrigérateur. Sortir la viande 20 min avant la cuisson. Chauffer le BBQ à feu vif. Griller la bavette 4 min par côté pour une cuisson mi-saignante (130 °F au centre). Laisser reposer 8 min sous un papier d'aluminium. Trancher finement à contre-fil, en biais.","v":[["Bavette marinée chimichurri","+1 un bouquet de persil|fruits et légumes ; +60 ml vinaigre de vin rouge|épicerie"],["Bavette en salade de steak avec fromage bleu ou parmesan","+1 un sac de roquette|fruits et légumes ; +100 g parmesan|produits laitiers ; +2 un tomates|fruits et légumes ; @f=aucun ; @v=aucun"]],"t":"viande","sf":"frites_maison","sv":"salade_verte","tm":25},{"n":"Steak au poivre","e":"","m":["steak","boeuf"],"nw":false,"i":[[6.0,"un","steaks (faux-filet ou contre-filet 200 g)","viandes"],[30.0,"ml","poivre concassé","garde-manger"],[250.0,"ml","crème 35%","produits laitiers"],[60.0,"ml","cognac ou bouillon de boeuf","épicerie"]],"s":"Sortir les steaks 20 min avant la cuisson et les éponger. Saler et presser le poivre concassé sur les deux faces. Dans une grande poêle, chauffer un filet d'huile à feu vif et cuire les steaks 3 à 4 min par côté pour une cuisson mi-saignante, en deux fois au besoin. Les réserver sous un papier d'aluminium. Baisser à feu moyen, verser le cognac ou le bouillon et gratter le fond de la poêle. Ajouter la crème et laisser réduire 3 à 4 min, jusqu'à ce que la sauce nappe la cuillère. Remettre le jus des steaks dans la sauce et napper au moment de servir.","v":[["Sauce aux champignons et à l'ail, même cuisson","-poivre concassé ; -cognac ; +400 g champignons|fruits et légumes ; +4 un gousses d'ail|fruits et légumes"],["Steak sauce BBQ chipotle, patates farcies","+125 ml sauce BBQ chipotle|épicerie ; +250 ml crème sure|produits laitiers"]],"t":"viande","sf":"patates_four","sv":"haricots_verts","tm":65,"tp":25},{"n":"Côtelettes de porc","e":"","m":["côtelettes de porc","pommes de terre"],"nw":false,"i":[[6.0,"un","côtelettes de porc","viandes"]],"s":"Sortir les côtelettes 15 min avant la cuisson et les éponger. Saler, poivrer et saupoudrer de paprika ou d'herbes. Dans une grande poêle, chauffer un filet d'huile à feu moyen-vif. Cuire les côtelettes 4 à 5 min par côté, jusqu'à 145 °F au centre, en deux fois au besoin. Laisser reposer 5 min avant de servir.","v":[["Côtelettes panées à la poêle","+120 g chapelure panko|épicerie ; +2 un oeufs|produits laitiers"],["Côtelettes sauce moutarde et miel, patates en quartiers","+60 ml moutarde|épicerie ; +60 ml miel|épicerie"]],"t":"viande","sf":"pelures","sv":"brocoli","tm":75,"tp":30},{"n":"Poulet au beurre","e":"","m":["poulet","riz"],"nw":false,"i":[[1000.0,"g","hauts de cuisses de poulet désossés","viandes"],[400.0,"ml","crème 35%","produits laitiers"],[400.0,"ml","purée de tomates","épicerie"],[60.0,"g","beurre","produits laitiers"],[45.0,"ml","pâte de cari ou garam masala","épicerie"],[6.0,"un","pains naan","boulangerie"]],"s":"Couper le poulet en bouchées, saler. Dans une grande poêle, fondre la moitié du beurre et dorer le poulet à feu moyen-vif 5 à 6 min, puis le réserver. Fondre le reste du beurre, ajouter la pâte de cari et cuire 1 min en remuant. Ajouter la purée de tomates, mijoter 5 min, puis ajouter la crème. Remettre le poulet et mijoter à feu doux 15 min, jusqu'à ce que la sauce soit onctueuse et le poulet tendre. Réchauffer les naans 2 min au four ou à la poêle et servir avec la sauce.","v":[["Poulet tikka masala : ajouter yogourt et plus d'épices","+250 ml yogourt nature|produits laitiers"],["Poulet au beurre en cocotte avec pois chiches et épinards","+1 un boîte de pois chiches|épicerie ; +300 g épinards|fruits et légumes"]],"t":"riz","sf":"riz_frit","sv":"","tm":35,"tp":30},{"n":"Chili con carne, poivrons farcis","e":"","m":["boeuf haché","poivrons"],"nw":false,"i":[[900.0,"g","boeuf haché","viandes"],[2.0,"un","boîtes de tomates en dés","épicerie"],[2.0,"un","boîtes de haricots rouges","épicerie"],[1.0,"un","oignon","fruits et légumes"],[45.0,"ml","poudre de chili","garde-manger"],[6.0,"un","gros poivrons","fruits et légumes"],[250.0,"g","fromage râpé","produits laitiers"],[1.0,"un","pain croûté","boulangerie"]],"s":"Hacher l'oignon. Dans une grande casserole, dorer le boeuf avec l'oignon dans un filet d'huile, en le défaisant à la cuillère. Ajouter la poudre de chili et cuire 1 min. Ajouter les tomates et les haricots rincés, saler et mijoter 45 min à feu doux, à découvert, en remuant de temps en temps. Préchauffer le four à 375 °F. Couper le dessus des poivrons, retirer les graines et les placer debout dans un plat. Les remplir de chili, couvrir de fromage râpé et cuire 30 min, jusqu'à ce que les poivrons soient tendres. Servir le reste du chili à côté, avec le pain croûté.","v":[["Chili au poulet et haricots blancs","-boeuf haché ; -haricots rouges ; +900 g poulet haché|viandes ; +2 un boîtes de haricots blancs|épicerie"],["Chili sur patate douce au four ou sur nachos","-poivrons ; +6 un patates douces|fruits et légumes"]],"t":"complet","sf":"","sv":"","tm":60,"tp":25},{"n":"Jambon mijoté à l'érable","e":"","m":["jambon","pommes de terre"],"nw":false,"i":[[2000.0,"g","jambon fumé désossé","viandes"],[125.0,"ml","sirop d'érable","épicerie"]],"s":"Le matin, déposer le jambon dans la mijoteuse. Mélanger le sirop d'érable avec 30 ml de moutarde de Dijon et en badigeonner le jambon. Ajouter 125 ml d'eau au fond. Cuire 6 h à faible intensité, en arrosant une fois si possible. Retirer le jambon et le laisser reposer 10 min avant de trancher. Napper du jus de cuisson. Garder les restes pour les dîners ou la soupe aux pois.","v":[["Jambon à l'ananas et à la cassonade","-sirop d'érable ; +1 un boîte d'ananas|épicerie ; +125 g cassonade|garde-manger"],["Restes de jambon en pâté de jambon ou en sandwichs gratinés","+4 un abaisses de pâte à tarte|surgelés ; +300 g fromage râpé|produits laitiers"]],"t":"viande","sf":"gratin","sv":"carottes","tm":390,"rs":{"lbl":"jambon cuit","w":["jambon"],"x":[[800.0,"g","jambon fumé désossé","viandes"]]},"tp":25,"mj":1},{"n":"Coq au porc (poulet et porc braisés)","e":"","m":["poulet","porc"],"nw":false,"i":[[700.0,"g","cubes de porc","viandes"],[700.0,"g","cuisses de poulet","viandes"],[200.0,"g","lardons","viandes"],[250.0,"g","champignons","fruits et légumes"],[2.0,"un","oignons","fruits et légumes"],[500.0,"ml","vin blanc ou bouillon","épicerie"]],"s":"Éponger les viandes, saler et poivrer. Dans une grande cocotte, dorer les lardons à feu moyen, puis les retirer. Dans le gras, dorer les cubes de porc et les cuisses de poulet en plusieurs fois, sans tasser, puis les réserver. Faire revenir les oignons émincés et les champignons 5 min. Saupoudrer de 30 ml de farine et cuire 1 min. Verser le vin ou le bouillon en grattant le fond, ajouter une feuille de laurier et du thym. Remettre les viandes et les lardons, couvrir et mijoter à feu doux 1 h 30, jusqu'à ce que la viande soit tendre. Rectifier l'assaisonnement.","v":[["Version tout poulet : cuisses de poulet, bacon et champignons","-cubes de porc ; +700 g cuisses de poulet|viandes"],["Version mijoteuse : 6 h à basse température",""]],"t":"viande","sf":"patates_pilees","sv":"","tm":120,"tp":30,"mj":2},{"n":"Poulet général Tao","e":"","m":["poulet","riz"],"nw":false,"i":[[1000.0,"g","poitrines de poulet","viandes"],[150.0,"g","fécule de maïs","garde-manger"],[125.0,"ml","sauce général Tao (du commerce ou maison)","épicerie"],[2.0,"un","oeufs","produits laitiers"]],"s":"Couper le poulet en cubes de 2 cm. Battre les oeufs dans un bol et mettre la fécule de maïs dans un autre, avec une pincée de sel. Tremper les cubes dans l'oeuf, puis les rouler dans la fécule. Au four : étaler sur une plaque tapissée de papier parchemin huilé, vaporiser d'huile et cuire 25 min à 425 °F en retournant à mi-cuisson. À la friture : frire en petites quantités 4 à 5 min dans l'huile à 350 °F. Chauffer la sauce général Tao dans un wok, ajouter le poulet et mélanger jusqu'à ce qu'il soit bien enrobé. Garnir d'oignons verts et de graines de sésame, si désiré.","v":[["Poulet à l'orange et au sésame","-sauce général Tao ; +250 ml jus d'orange|épicerie ; +60 ml sauce soya|épicerie ; +30 ml graines de sésame|garde-manger ; +60 ml miel|épicerie"],["Poulet aigre-doux au four avec ananas et poivrons","-sauce général Tao ; +250 ml sauce aigre-douce|épicerie ; +1 un boîte d'ananas|épicerie ; +2 un poivrons|fruits et légumes"]],"t":"riz","sf":"riz_blanc","sv":"brocoli","tm":35,"tp":30},{"n":"Hot-dogs et Pogo","e":"","m":["hot-dog","saucisses"],"nw":false,"i":[[12.0,"un","saucisses à hot-dog","viandes"],[12.0,"un","pains à hot-dog","boulangerie"],[6.0,"un","Pogo (corn dogs surgelés)","surgelés"],[1.0,"un","moutarde, relish, ketchup","épicerie"]],"s":"Préchauffer le four à 375 °F. Déposer les Pogo sur une plaque et cuire 18 à 20 min en les retournant à mi-cuisson. Pendant ce temps, griller les saucisses au BBQ 6 à 8 min en les tournant, ou les cuire 5 min dans l'eau frémissante. Réchauffer les pains 2 min au four ou à la vapeur. Servir avec la moutarde, la relish et le ketchup.","v":[["Hot-dogs enroulés dans du bacon","+300 g bacon|viandes"],["Hot-dogs chili cheese avec un chili rapide","+400 g boeuf haché|viandes ; +250 ml sauce tomate|épicerie ; +250 g cheddar râpé|produits laitiers ; +15 ml poudre de chili|garde-manger"]],"t":"sandwich","sf":"chips","sv":"crudites","tm":15},{"n":"Escalopes de poulet, fromage et olives","e":"","m":["poulet","fromage"],"nw":false,"i":[[1000.0,"g","poitrines de poulet (en escalopes)","viandes"],[300.0,"g","mozzarella","produits laitiers"],[150.0,"g","olives vertes ou noires","épicerie"],[250.0,"ml","sauce tomate","épicerie"]],"s":"Préchauffer le four à 400 °F. Si les poitrines sont épaisses, les trancher en deux sur l'épaisseur et les aplatir à 1 cm. Saler, poivrer et fariner légèrement. Dans une poêle allant au four, dorer les escalopes dans un filet d'huile 3 min par côté. Napper de sauce tomate, parsemer d'olives tranchées et couvrir de mozzarella. Gratiner au four 8 à 10 min, jusqu'à ce que le fromage soit doré et le poulet cuit (165 °F).","v":[["Escalopes parmigiana (sauce tomate, mozzarella) sur spaghetti","-olives vertes ; +500 ml sauce tomate|épicerie ; +600 g spaghetti|épicerie ; @f=aucun"],["Escalopes à la crème et aux champignons","-olives vertes ; -sauce tomate ; +400 g champignons|fruits et légumes ; +250 ml crème 35%|produits laitiers"]],"t":"viande","sf":"riz_blanc","sv":"salade_verte","tm":35,"tp":30},{"n":"Hot chicken","e":"","m":["poulet","pain","sauce brune"],"nw":false,"i":[[900.0,"g","poulet cuit","viandes"],[6.0,"un","tranches de pain","boulangerie"],[750.0,"ml","sauce brune","épicerie"]],"s":"Effilocher ou trancher le poulet cuit et le réchauffer 2 min au micro-ondes ou dans un peu de sauce. Chauffer la sauce brune jusqu'à ébullition. Déposer une tranche de pain dans chaque assiette, couvrir de poulet, puis d'une deuxième tranche si désiré. Napper généreusement de sauce bien chaude et servir avec les frites et les pois.","v":[["Hot chicken au porc effiloché","-poulet cuit ; +900 g porc effiloché|viandes"],["Hot chicken en sandwich ouvert sur toast avec fromage","+200 g fromage râpé|produits laitiers"]],"t":"sandwich","sf":"frites_four","sv":"pois","tm":25,"ur":["poulet cuit"]},{"n":"Club sandwich","e":"","m":["poulet","bacon","pain"],"nw":false,"i":[[18.0,"un","tranches de pain","boulangerie"],[600.0,"g","poulet cuit","viandes"],[400.0,"g","bacon","viandes"],[3.0,"un","tomates","fruits et légumes"],[1.0,"un","laitue","fruits et légumes"],[150.0,"ml","mayonnaise","épicerie"]],"s":"Cuire le bacon au four 15 min à 400 °F ou à la poêle, jusqu'à ce qu'il soit croustillant. Trancher le poulet et les tomates, et détacher les feuilles de laitue. Griller le pain. Pour chaque sandwich : une tranche tartinée de mayonnaise, poulet et laitue, une deuxième tranche, bacon et tomate, puis la troisième tranche. Maintenir avec des cure-dents et couper en quatre triangles.","v":[["Club à la dinde et au bacon avec avocat","-poulet cuit ; +600 g dinde tranchée|viandes ; +2 un avocats|fruits et légumes"],["Club en wrap grillé, sauce ranch","-tranches de pain ; +6 un grandes tortillas|boulangerie ; +125 ml sauce ranch|produits laitiers"]],"t":"sandwich","sf":"chips","sv":"salade_fruits","tm":20,"ur":["poulet cuit"]},{"n":"Empanadas","e":"","m":["boeuf haché","fromage"],"nw":false,"i":[[12.0,"un","rondelles à empanadas ou abaisses","surgelés"],[600.0,"g","boeuf haché","viandes"],[200.0,"g","fromage","produits laitiers"],[1.0,"un","oignon","fruits et légumes"],[250.0,"ml","salsa","épicerie"]],"s":"Préchauffer le four à 400 °F et tapisser une plaque de papier parchemin. Hacher l'oignon et le faire revenir dans un filet d'huile 3 min. Ajouter le boeuf, 5 ml de cumin, 5 ml de paprika, du sel et du poivre, et cuire en défaisant la viande jusqu'à ce qu'elle soit cuite. Ajouter la moitié de la salsa, laisser réduire 2 min et refroidir 10 min. Déposer une cuillerée de farce et un peu de fromage au centre de chaque rondelle. Plier en demi-lune, sceller avec les dents d'une fourchette et badigeonner d'un oeuf battu ou de lait. Cuire 22 à 25 min, jusqu'à ce qu'elles soient dorées. Servir avec le reste de la salsa.","v":[["Empanadas au poulet et fromage","-boeuf haché ; +600 g poulet haché|viandes"],["Empanadas sucrées-salées à la dinde et aux canneberges","-boeuf haché ; +600 g dinde hachée|viandes ; +125 ml sauce aux canneberges|épicerie"]],"t":"viande","sf":"chips_maison","sv":"","tm":50,"tp":35},{"n":"Gnocchi, mini burgers, porc effiloché","e":"","m":["porc","gnocchi"],"nw":false,"i":[[1800.0,"g","épaule de porc","viandes"],[455.0,"ml","sauce BBQ","épicerie"],[12.0,"un","petits pains","boulangerie"]],"s":"Le matin, frotter l'épaule de sel, de poivre et de paprika, la déposer dans la mijoteuse avec 125 ml d'eau et le tiers de la sauce BBQ. Cuire 8 h à faible intensité, jusqu'à ce que la viande se défasse à la fourchette. Retirer l'os et le gras, effilocher la viande et la mélanger avec le reste de la sauce BBQ et un peu de jus de cuisson. Ouvrir les petits pains et les garnir de porc effiloché.","v":[["Gnocchi sauce rosée au porc effiloché","+500 ml sauce tomate|épicerie ; +125 ml crème 15%|produits laitiers"],["Gnocchi gratinés au four avec bacon","+300 g bacon|viandes ; +250 g mozzarella râpée|produits laitiers"]],"t":"pates","sf":"gnocchi_poeles","sv":"salade_chou","tm":500,"tp":20,"mj":1},{"n":"Tortellinis, sauce rosée","e":"","m":["pâtes","fromage"],"nw":false,"i":[[1000.0,"g","tortellinis au fromage","épicerie"],[750.0,"ml","sauce tomate","épicerie"],[250.0,"ml","crème 15%","produits laitiers"],[100.0,"g","parmesan","produits laitiers"]],"s":"Porter une grande casserole d'eau salée à ébullition. Dans une autre casserole, chauffer la sauce tomate et mijoter 5 min. Ajouter la crème et réchauffer sans faire bouillir. Cuire les tortellinis selon l'emballage, environ 4 min, puis les égoutter. Les mélanger avec la sauce rosée et servir avec le parmesan.","v":[["Tortellinis sauce Alfredo ou pesto","-sauce tomate ; -crème 15% ; +500 ml sauce Alfredo|épicerie"],["Gratin de tortellinis : sauce, mozzarella, four 15 min","+300 g mozzarella râpée|produits laitiers"]],"t":"pates","sf":"pain_ail","sv":"salade_verte","tm":20},{"n":"Filets de poulet, salade César","e":"","m":["poulet","filets de poulet"],"nw":false,"i":[[900.0,"g","filets de poulet panés surgelés","surgelés"],[2.0,"un","coeurs de romaine","fruits et légumes"],[150.0,"g","croûtons","boulangerie"],[125.0,"ml","sauce César","épicerie"],[100.0,"g","parmesan","produits laitiers"],[80.0,"g","bacon cuit","viandes"]],"s":"Cuire les filets de poulet au four selon l'emballage, environ 20 min à 425 °F, en les retournant à mi-cuisson. Pendant ce temps, laver la romaine et la couper en morceaux. Émietter le bacon. Dans un grand bol, mélanger la romaine avec la sauce César, ajouter les croûtons, le bacon et le parmesan. Trancher les filets et les déposer sur la salade.","v":[["Salade César au poulet croustillant en wrap","+6 un grandes tortillas|boulangerie"],["Filets avec trempette miel-moutarde et salade de pâtes","-coeurs de romaine ; -croûtons ; -sauce César ; +400 g pâtes rotini|épicerie ; +250 ml vinaigrette italienne|épicerie ; +1 un concombre|fruits et légumes"]],"t":"complet","sf":"","sv":"","tm":30},{"n":"Wraps au poulet","e":"","m":["poulet","tortillas"],"nw":false,"i":[[6.0,"un","grandes tortillas","boulangerie"],[800.0,"g","poulet cuit","viandes"],[250.0,"g","fromage râpé","produits laitiers"],[1.0,"un","laitue","fruits et légumes"],[3.0,"un","tomates","fruits et légumes"],[125.0,"ml","sauce ranch","produits laitiers"]],"s":"Effilocher ou trancher le poulet. Émincer la laitue et couper les tomates en dés. Étendre un peu de sauce ranch au centre de chaque tortilla, puis garnir de poulet, de fromage, de laitue et de tomates. Replier les côtés et rouler serré. Griller dans une poêle sèche à feu moyen, ou dans un presse-panini, 2 min par côté, jusqu'à ce que la tortilla soit dorée. Couper en deux en biais.","v":[["Wraps César au poulet et au bacon","-sauce ranch ; +125 ml sauce César|épicerie ; +200 g bacon|viandes ; +100 g parmesan|produits laitiers"],["Wraps BBQ au poulet croustillant et au cheddar","-sauce ranch ; +125 ml sauce BBQ|épicerie"]],"t":"sandwich","sf":"","sv":"crudites","tm":20,"ur":["poulet cuit"]},{"n":"Pizza maison pepperoni","e":"","m":["pepperoni","fromage","pizza"],"nw":true,"i":[[3.0,"un","pâtes à pizza","boulangerie"],[750.0,"ml","sauce à pizza","épicerie"],[600.0,"g","mozzarella râpée","produits laitiers"],[300.0,"g","pepperoni","viandes"],[2.0,"un","poivrons","fruits et légumes"]],"s":"Placer la grille au bas du four et préchauffer à 475 °F, avec une plaque ou une pierre à l'intérieur si possible. Laisser les pâtes reposer 15 min à la température ambiante pour qu'elles s'étirent mieux. Fariner le comptoir et étirer chaque pâte en cercle mince. Déposer sur un papier parchemin, étendre la sauce en laissant une bordure, puis la mozzarella, le pepperoni et les poivrons émincés. Glisser la pizza sur la plaque chaude et cuire 10 à 12 min, jusqu'à ce que la croûte soit dorée et le fromage bouillonnant. Laisser reposer 2 min avant de couper.","v":[["Pizza blanche au poulet, bacon et sauce ranch","-sauce à pizza ; -pepperoni ; +500 ml sauce ranch|produits laitiers ; +600 g poulet cuit|viandes ; +300 g bacon|viandes"],["Pizza hawaïenne ou pizza déjeuner (oeufs et bacon)","-pepperoni ; +300 g jambon|viandes ; +1 un boîte d'ananas|épicerie"]],"t":"complet","sf":"","sv":"salade_cesar","tm":45,"tp":20},{"n":"Pâté chinois","e":"","m":["boeuf haché","pommes de terre"],"nw":true,"i":[[900.0,"g","boeuf haché","viandes"],[1.0,"un","oignon","fruits et légumes"],[2.0,"un","boîtes de maïs en grains","épicerie"],[1500.0,"g","pommes de terre","fruits et légumes"],[60.0,"g","beurre","produits laitiers"]],"s":"Peler les pommes de terre, les couper en cubes et les cuire 15 min dans l'eau salée, jusqu'à ce qu'elles soient tendres. Les égoutter et les piler avec le beurre, un peu de lait, du sel et du poivre. Préchauffer le four à 375 °F. Hacher l'oignon et le faire revenir dans un filet d'huile, ajouter le boeuf et cuire en le défaisant jusqu'à ce qu'il ne soit plus rosé. Saler et poivrer. Étendre le boeuf dans un plat de 9 x 13 po, couvrir du maïs égoutté, puis de la purée. Strier le dessus à la fourchette, parsemer de paprika et cuire 30 min, jusqu'à ce que le dessus soit doré.","v":[["Pâté chinois au poulet haché","-boeuf haché ; +900 g poulet haché|viandes"],["Pâté chinois à la patate douce ou au chou-fleur","-pommes de terre ; +1500 g patates douces|fruits et légumes"]],"t":"complet","sf":"","sv":"salade_chou","tm":75,"tp":35},{"n":"Croquettes de poulet maison","e":"","m":["poulet","croquettes"],"nw":true,"i":[[1000.0,"g","poitrines de poulet","viandes"],[150.0,"g","chapelure panko","épicerie"],[2.0,"un","oeufs","produits laitiers"],[100.0,"g","farine","garde-manger"],[1.0,"un","trempette miel-moutarde","épicerie"]],"s":"Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin huilé. Couper le poulet en bouchées de 3 cm. Préparer trois bols : la farine salée et poivrée, les oeufs battus, le panko mélangé avec 5 ml de paprika. Passer chaque morceau dans la farine, l'oeuf, puis le panko, en pressant. Déposer sur la plaque et vaporiser ou arroser légèrement d'huile. Cuire 18 à 20 min en retournant à mi-cuisson, jusqu'à ce qu'elles soient dorées et à 165 °F au centre. Servir avec la trempette miel-moutarde.","v":[["Croquettes au parmesan, trempette marinara","-trempette miel-moutarde ; +100 g parmesan râpé|produits laitiers ; +250 ml sauce marinara|épicerie"],["Croquettes en sandwich avec salade de chou","+6 un pains à hamburger|boulangerie ; +1 un sac de salade de chou|fruits et légumes"]],"t":"sandwich","sf":"frites_four","sv":"","tm":35,"tp":20},{"n":"Fajitas de boeuf","e":"","m":["boeuf","bavette"],"nw":true,"i":[[1000.0,"g","bavette de boeuf","viandes"],[3.0,"un","poivrons tricolores","fruits et légumes"],[2.0,"un","oignons","fruits et légumes"],[12.0,"un","tortillas","boulangerie"],[300.0,"g","fromage râpé","produits laitiers"],[250.0,"ml","crème sure","produits laitiers"]],"s":"Trancher la bavette finement à contre-fil. La mélanger avec le jus d'une lime, 15 ml d'huile, 10 ml de poudre de chili, 5 ml de cumin, du sel et du poivre, et laisser mariner 20 min (ou toute la journée). Émincer les poivrons et les oignons. Dans une grande poêle très chaude, saisir le boeuf en deux fois 2 à 3 min, puis le réserver. Sauter les poivrons et les oignons 5 à 6 min, jusqu'à ce qu'ils soient tendres-croquants. Remettre le boeuf et mélanger 1 min. Réchauffer les tortillas et servir avec le fromage et la crème sure.","v":[["Fajitas au poulet et poivrons","-bavette de boeuf ; +1000 g poitrines de poulet|viandes"],["Bol fajita : riz, haricots noirs, boeuf et salsa, sans tortilla","-tortillas ; +1 un boîte de haricots noirs|épicerie ; +250 ml salsa|épicerie"]],"t":"mex","sf":"riz_blanc","sv":"guacamole","tm":30},{"n":"Soupe-repas poulet et nouilles, sandwich fromage fondu","e":"","m":["poulet","nouilles"],"nw":true,"i":[[800.0,"g","poitrines de poulet","viandes"],[2500.0,"ml","bouillon de poulet","épicerie"],[4.0,"un","carottes","fruits et légumes"],[3.0,"un","branches de céleri","fruits et légumes"],[250.0,"g","nouilles aux oeufs","épicerie"],[12.0,"un","tranches de pain","boulangerie"],[300.0,"g","cheddar","produits laitiers"]],"s":"Couper les carottes et le céleri en dés. Dans une grande casserole, faire revenir les légumes 5 min dans un filet d'huile. Ajouter le bouillon et les poitrines entières, porter à ébullition et mijoter 20 min. Retirer le poulet, l'effilocher et le remettre dans la soupe. Ajouter les nouilles et cuire 6 à 8 min, puis saler et poivrer. Pendant ce temps, beurrer l'extérieur des tranches de pain, garnir de cheddar et dorer les sandwichs à la poêle à feu moyen, 3 min par côté.","v":[["Soupe poulet et riz sauvage","-nouilles aux oeufs ; +250 g riz sauvage|épicerie"],["Soupe poulet et tortellinis, sandwich au jambon","-nouilles aux oeufs ; +500 g tortellinis|épicerie ; +200 g jambon tranché|viandes"]],"t":"complet","sf":"","sv":"","tm":40,"tp":15},{"n":"Poutine au poulet","e":"","m":["poulet","fromage en grains"],"nw":true,"i":[[900.0,"g","poulet cuit","viandes"],[1200.0,"g","frites surgelées","surgelés"],[500.0,"g","fromage en grains","produits laitiers"],[750.0,"ml","sauce brune","épicerie"]],"s":"Cuire les frites au four selon l'emballage, en les gardant bien croustillantes. Effilocher le poulet et le réchauffer dans un peu de sauce brune. Porter le reste de la sauce brune à ébullition : elle doit être très chaude pour faire fondre le fromage. Laisser le fromage en grains à la température ambiante. Monter les poutines : frites, fromage, poulet, puis napper de sauce bouillante.","v":[["Poutine italienne : saucisses italiennes et sauce tomate","-poulet cuit ; -sauce brune ; +6 un saucisses italiennes|viandes ; +500 ml sauce tomate|épicerie"],["Poutine au porc effiloché","-poulet cuit ; +900 g porc effiloché|viandes"]],"t":"complet","sf":"","sv":"salade_chou","tm":40,"ur":["poulet cuit"],"tp":15},{"n":"Pâtes carbonara au bacon","e":"","m":["bacon","pâtes"],"nw":true,"i":[[700.0,"g","spaghetti","épicerie"],[400.0,"g","bacon","viandes"],[5.0,"un","oeufs","produits laitiers"],[150.0,"g","parmesan","produits laitiers"]],"s":"Porter une grande casserole d'eau salée à ébullition. Couper le bacon en lardons et le dorer à feu moyen jusqu'à ce qu'il soit croustillant. Retirer la poêle du feu. Dans un bol, fouetter les oeufs avec le parmesan et beaucoup de poivre. Cuire les spaghetti selon l'emballage et garder 250 ml d'eau de cuisson. Mettre les pâtes égouttées dans la poêle du bacon, hors du feu. Verser le mélange d'oeufs en remuant vivement et ajouter de l'eau de cuisson peu à peu jusqu'à obtenir une sauce crémeuse. Ne pas remettre sur le feu : les oeufs brouilleraient.","v":[["Carbonara aux petits pois et au jambon","+300 g pois verts surgelés|surgelés ; +200 g jambon tranché|viandes"],["Pâtes au bacon et à la crème, version rapide","+250 ml crème 35%|produits laitiers"]],"t":"pates","sf":"pain_croute","sv":"salade_verte","tm":25},{"n":"Poitrines de poulet farcies jambon et fromage","e":"","m":["poulet","jambon"],"nw":true,"i":[[1200.0,"g","poitrines de poulet","viandes"],[200.0,"g","jambon tranché","viandes"],[200.0,"g","fromage suisse","produits laitiers"],[120.0,"g","chapelure","épicerie"]],"s":"Préchauffer le four à 400 °F. Ouvrir chaque poitrine en portefeuille sur l'épaisseur sans la couper complètement. Saler et poivrer l'intérieur, garnir de jambon et de fromage suisse, puis refermer avec des cure-dents. Badigeonner de moutarde de Dijon ou d'un oeuf battu et enrober de chapelure. Déposer dans un plat huilé. Cuire 28 à 30 min, jusqu'à 165 °F au centre. Laisser reposer 5 min et retirer les cure-dents.","v":[["Poulet cordon-bleu (jambon, suisse, panure)",""],["Poulet farci aux épinards, feta et tomates séchées","-jambon tranché ; -fromage suisse ; +300 g épinards|fruits et légumes ; +200 g feta|produits laitiers ; +100 g tomates séchées|épicerie"]],"t":"viande","sf":"riz_blanc","sv":"brocoli","tm":45,"tp":20},{"n":"Boeuf Stroganov","e":"","m":["boeuf","steak"],"nw":true,"i":[[1000.0,"g","boeuf en lanières (surlonge)","viandes"],[400.0,"g","champignons","fruits et légumes"],[250.0,"ml","crème sure","produits laitiers"],[500.0,"ml","bouillon de boeuf","épicerie"]],"s":"Éponger le boeuf, saler et poivrer. Dans une grande poêle très chaude, saisir les lanières en deux ou trois fois 1 à 2 min, sans tasser, puis les réserver. Baisser à feu moyen, ajouter une noix de beurre et les champignons tranchés, et cuire 5 min jusqu'à ce qu'ils soient dorés. Saupoudrer de 15 ml de farine et cuire 1 min. Verser le bouillon en grattant le fond et mijoter 5 min, jusqu'à ce que la sauce épaississe. Hors du feu, incorporer la crème sure, puis remettre le boeuf et son jus. Réchauffer sans faire bouillir.","v":[["Version au poulet","-boeuf en lanières ; +1000 g poitrines de poulet|viandes"],["Version mijoteuse : 4 h à basse température, nouilles ou riz",""]],"t":"viande","sf":"nouilles_oeufs","sv":"haricots_verts","tm":35,"tp":30},{"n":"Poisson pané (fish & chips)","e":"","m":["poisson","filets de poisson"],"nw":true,"i":[[1000.0,"g","filets de poisson (aiglefin ou morue)","poissonnerie"],[200.0,"g","chapelure panko","épicerie"],[2.0,"un","oeufs","produits laitiers"],[1.0,"un","sauce tartare","épicerie"]],"s":"Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin huilé. Éponger le poisson et le couper en portions, saler et poivrer. Préparer deux bols : les oeufs battus, puis le panko mélangé avec 5 ml de paprika et une pincée de sel. Tremper chaque morceau dans l'oeuf, puis l'enrober de panko en pressant. Déposer sur la plaque et arroser d'un filet d'huile. Cuire 15 à 18 min, jusqu'à ce que la chapelure soit dorée et que le poisson se défasse à la fourchette. Servir avec la sauce tartare et des quartiers de citron.","v":[["Fish tacos au chou et à la sauce chipotle","-sauce tartare ; +12 un tortillas|boulangerie ; +125 ml sauce chipotle|épicerie ; @f=aucun"],["Sandwich au poisson pané avec sauce tartare","+6 un pains à hamburger|boulangerie"]],"t":"sandwich","sf":"frites_four","sv":"salade_chou","tm":25},{"n":"Souvlaki de poulet, pitas","e":"","m":["poulet","pain pita"],"nw":true,"i":[[1000.0,"g","poitrines de poulet","viandes"],[12.0,"un","pitas","boulangerie"],[500.0,"ml","tzatziki","produits laitiers"]],"s":"Couper le poulet en cubes de 3 cm. Mélanger avec le jus d'un citron, 45 ml d'huile d'olive, 2 gousses d'ail hachées, 10 ml d'origan, du sel et du poivre. Mariner au moins 30 min, ou toute la journée au réfrigérateur. Enfiler sur des brochettes (trempées 30 min si elles sont en bois). Griller au BBQ à feu moyen-vif 10 à 12 min en tournant, jusqu'à 165 °F au centre. Réchauffer les pitas 1 min sur le grill. Servir avec le tzatziki.","v":[["Souvlaki de porc","-poitrines de poulet ; +1000 g filet de porc|viandes"],["Assiette grecque : riz, salade, tzatziki, pita grillé","@f=riz_blanc"]],"t":"viande","sf":"grelots","sv":"salade_grecque","tm":35,"tp":20},{"n":"Sloppy joes","e":"","m":["boeuf haché","pain à hamburger"],"nw":true,"i":[[1000.0,"g","boeuf haché","viandes"],[6.0,"un","pains à hamburger","boulangerie"],[500.0,"ml","sauce sloppy joe","épicerie"],[1.0,"un","oignon","fruits et légumes"]],"s":"Hacher finement l'oignon. Dans une grande poêle, faire revenir l'oignon 3 min dans un filet d'huile. Ajouter le boeuf et le cuire en le défaisant à la cuillère, jusqu'à ce qu'il ne soit plus rosé. Égoutter le surplus de gras. Ajouter la sauce sloppy joe et mijoter 15 min à feu doux, jusqu'à ce que ce soit bien épais. Griller les pains et les garnir généreusement.","v":[["Sloppy joes au poulet haché","-boeuf haché ; +1000 g poulet haché|viandes"],["Sloppy joes servis sur patates au four","-pains à hamburger ; @f=patates_four"]],"t":"sandwich","sf":"patates_douces","sv":"crudites","tm":30},{"n":"Steak haché sauce brune","e":"","m":["boeuf haché","pommes de terre"],"nw":true,"i":[[1000.0,"g","boeuf haché","viandes"],[500.0,"ml","sauce brune","épicerie"],[1.0,"un","oignon","fruits et légumes"]],"s":"Hacher l'oignon. Saler et poivrer le boeuf et former 6 galettes ovales de 2 cm d'épaisseur. Dans une grande poêle, cuire les galettes dans un filet d'huile à feu moyen-vif 4 à 5 min par côté, jusqu'à 160 °F au centre, puis les réserver. Dans la même poêle, faire revenir l'oignon 5 min jusqu'à ce qu'il soit doré. Ajouter la sauce brune, gratter le fond et porter à ébullition. Remettre les galettes dans la sauce et mijoter 5 min en les nappant.","v":[["Steak haché aux oignons caramélisés et fromage","+3 un oignons|fruits et légumes ; +200 g fromage suisse|produits laitiers"],["Boulettes de boeuf à la sauce brune sur nouilles aux oeufs","@f=nouilles_oeufs"]],"t":"viande","sf":"patates_pilees","sv":"pois","tm":35,"tp":30},{"n":"Pâtes à la saucisse italienne","e":"","m":["saucisse","pâtes","sauce tomate"],"nw":true,"t":"pates","sf":"pain_ail","sv":"salade_verte","tm":25,"i":[[700,"g","saucisses italiennes","viandes"],[600,"g","penne","épicerie"],[750,"ml","sauce tomate","épicerie"],[1,"un","oignon","fruits et légumes"],[100,"g","parmesan râpé","produits laitiers"]],"s":"Porter une grande casserole d'eau salée à ébullition. Retirer la peau des saucisses ou les couper en rondelles. Hacher l'oignon. Dans une grande poêle, dorer les saucisses et l'oignon dans un filet d'huile 8 min, en défaisant la chair. Ajouter la sauce tomate et mijoter 10 min. Cuire les penne selon l'emballage et les égoutter. Mélanger les pâtes avec la sauce et servir avec le parmesan.","v":[["Rosée : ajouter de la crème à la sauce","+250 ml crème 15%|produits laitiers"],["Piquante : saucisses fortes et flocons de piment","+5 ml flocons de piment|garde-manger"]]},{"n":"Riz sauté au poulet et aux oeufs","e":"","m":["poulet","oeufs"],"nw":true,"t":"riz","sf":"","sv":"","tm":25,"i":[[900,"g","poitrines de poulet","viandes"],[500,"g","riz","épicerie"],[4,"un","oeufs","produits laitiers"],[600,"g","légumes mélangés surgelés","surgelés"],[60,"ml","sauce soya","épicerie"],[3,"un","oignons verts","fruits et légumes"]],"s":"Cuire le riz, idéalement la veille, et le réfrigérer : le riz froid ne colle pas. Couper le poulet en dés, battre les oeufs et émincer les oignons verts. Dans un wok très chaud avec un filet d'huile, sauter le poulet 5 à 6 min, jusqu'à ce qu'il soit cuit. Ajouter les légumes surgelés et sauter 3 min. Pousser le tout sur le côté, ajouter un peu d'huile et brouiller les oeufs. Ajouter le riz, l'écraser pour défaire les mottes et sauter 5 min. Arroser de sauce soya et garnir d'oignons verts.","v":[["Épicé : sriracha","+30 ml sauce sriracha|épicerie"],["À l'ananas : ananas en dés","+1 un ananas en conserve|épicerie"]]},{"n":"Filets de porc moutarde et miel","e":"","m":["porc","filet de porc"],"nw":true,"t":"viande","sf":"patates_pilees","sv":"haricots_verts","tm":30,"i":[[1000,"g","filets de porc","viandes"],[60,"ml","moutarde de Dijon","épicerie"],[60,"ml","miel","épicerie"],[30,"ml","huile végétale","garde-manger"]],"s":"Préchauffer le four à 400 °F. Retirer la membrane argentée des filets, saler et poivrer. Mélanger la moutarde et le miel. Dans une poêle allant au four, chauffer l'huile à feu moyen-vif et saisir les filets 5 à 6 min en les tournant sur toutes les faces. Napper du mélange moutarde-miel. Finir au four 12 à 15 min, jusqu'à 145 °F au centre. Laisser reposer 5 min, puis trancher et arroser du jus de la poêle.","v":[["À l'érable : sirop d'érable au lieu du miel","-miel ; +60 ml sirop d'érable|épicerie"]]},{"n":"Déjeuner pour souper","e":"","m":["oeufs","bacon"],"nw":true,"t":"complet","sf":"","sv":"salade_fruits","tm":20,"i":[[12,"un","oeufs","produits laitiers"],[400,"g","bacon","viandes"],[800,"g","pommes de terre rissolées surgelées","surgelés"],[6,"un","muffins anglais","boulangerie"]],"s":"Préchauffer le four à 425 °F. Étaler les patates rissolées sur une plaque et les cuire 20 à 25 min en remuant à mi-cuisson. Étaler le bacon sur une autre plaque tapissée de papier parchemin et le cuire 15 à 18 min, jusqu'à ce qu'il soit croustillant. Griller les muffins anglais. Cuire les oeufs à la poêle dans un peu de beurre, brouillés ou au miroir. Servir les oeufs sur les muffins, avec le bacon et les patates.","v":[["Saucisses : saucisses déjeuner au lieu du bacon","-bacon ; +600 g saucisses déjeuner|viandes"]]},{"n":"Pizzas naan","e":"","m":["pepperoni","mozzarella","naan"],"nw":true,"t":"sandwich","sf":"","sv":"crudites","tm":20,"i":[[6,"un","naan","boulangerie"],[500,"ml","sauce à pizza","épicerie"],[400,"g","mozzarella râpée","produits laitiers"],[200,"g","pepperoni","viandes"]],"s":"Préchauffer le four à 425 °F. Déposer les naans sur deux plaques. Étendre la sauce à pizza en laissant une petite bordure. Parsemer de mozzarella et garnir de pepperoni. Cuire 8 à 10 min, jusqu'à ce que le fromage soit fondu et les bords dorés.","v":[["Hawaïenne : jambon et ananas","-pepperoni ; +250 g jambon en dés|viandes ; +1 un ananas en conserve|épicerie"]]},{"n":"Sandwichs grillés jambon-fromage et soupe tomate","e":"","m":["jambon","cheddar","soupe"],"nw":true,"t":"complet","sf":"","sv":"crudites","tm":15,"i":[[12,"un","tranches de pain","boulangerie"],[400,"g","jambon tranché","viandes"],[400,"g","cheddar tranché","produits laitiers"],[3,"un","boîtes de soupe aux tomates (540 ml)","épicerie"],[60,"g","beurre","produits laitiers"]],"s":"Verser la soupe dans une casserole avec une boîte de lait ou d'eau, et la réchauffer à feu moyen en remuant. Beurrer une face de chaque tranche de pain. Monter les sandwichs, côté beurré à l'extérieur : jambon et cheddar entre deux tranches. Dorer à la poêle à feu moyen-doux 3 à 4 min par côté, en pressant légèrement, jusqu'à ce que le fromage soit fondu. Couper en deux et servir avec la soupe.","v":[["Pizza grilled cheese : sauce à pizza et pepperoni","+250 ml sauce à pizza|épicerie ; +150 g pepperoni|viandes ; -jambon tranché"]]},{"n":"Biscuits aux pépites de chocolat","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":30,"sf":"","sv":"","m":["chocolat","biscuits"],"nw":true,"i":[[250.0,"g","beurre","produits laitiers"],[250.0,"g","cassonade","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[5.0,"ml","vanille","garde-manger"],[450.0,"g","farine","garde-manger"],[300.0,"g","pépites de chocolat","garde-manger"]],"s":"Préchauffer le four à 350 °F et tapisser deux plaques de papier parchemin. Battre le beurre ramolli et la cassonade jusqu'à ce que ce soit crémeux. Ajouter les oeufs un à la fois, puis la vanille. Incorporer la farine mélangée avec 5 ml de bicarbonate de soude et 2 ml de sel, puis les pépites. Déposer des boules de 30 ml en les espaçant de 5 cm. Cuire 10 à 12 min, jusqu'à ce que le tour soit doré mais le centre encore mou. Laisser refroidir 5 min sur la plaque avant de déplacer. Environ 36 biscuits.","v":[["Aux guimauves : mini-guimauves","+150 g mini-guimauves|épicerie","Ajouter avec les pépites."],["Beurre d'arachide : pépites et arachides","+125 ml beurre d'arachide|épicerie","Crémer avec le beurre."],["Double chocolat : cacao","+60 g cacao|garde-manger","Ajouter à la farine."]]},{"n":"Biscuits à l'avoine et raisins","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":30,"sf":"","sv":"","m":["avoine","raisins"],"nw":true,"i":[[250.0,"g","beurre","produits laitiers"],[200.0,"g","cassonade","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[300.0,"g","flocons d'avoine","épicerie"],[250.0,"g","farine","garde-manger"],[150.0,"g","raisins secs","épicerie"]],"s":"Préchauffer le four à 350 °F et tapisser deux plaques de papier parchemin. Battre le beurre ramolli et la cassonade jusqu'à ce que ce soit crémeux, puis ajouter les oeufs. Mélanger la farine avec 5 ml de bicarbonate de soude, 5 ml de cannelle et 2 ml de sel, et l'incorporer. Ajouter les flocons d'avoine et les raisins. Déposer des boules de 30 ml en les espaçant. Cuire 12 min, jusqu'à ce qu'ils soient dorés sur le tour. Laisser refroidir sur la plaque 5 min.","v":[["Canneberges et chocolat blanc","-raisins secs ; +100 g canneberges séchées|épicerie ; +100 g chocolat blanc|garde-manger","Remplacer les raisins."],["Pépites : chocolat noir","-raisins secs ; +200 g pépites de chocolat|garde-manger","Remplacer."],["Noix : noix hachées","+80 g noix hachées|épicerie","Ajouter."]]},{"n":"Brownies","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":40,"sf":"","sv":"","m":["chocolat","brownies"],"nw":true,"i":[[200.0,"g","chocolat noir","épicerie"],[150.0,"g","beurre","produits laitiers"],[250.0,"g","sucre","garde-manger"],[3.0,"un","oeufs","produits laitiers"],[120.0,"g","farine","garde-manger"],[60.0,"g","cacao","garde-manger"]],"s":"Préchauffer le four à 350 °F et tapisser un moule carré de 8 po de papier parchemin. Fondre le chocolat et le beurre ensemble au bain-marie ou au micro-ondes, par périodes de 30 s. Ajouter le sucre, puis les oeufs un à un en fouettant. Incorporer la farine, le cacao et une pincée de sel sans trop mélanger. Verser dans le moule. Cuire 25 min : un cure-dent doit ressortir avec quelques miettes humides. Laisser refroidir complètement avant de couper.","v":[["Aux noix : noix de Grenoble","+100 g noix de Grenoble|épicerie","Ajouter."],["Au beurre d'arachide : tourbillons","+125 ml beurre d'arachide|épicerie","Marbrer."],["Cheesecake : tourbillons de fromage à la crème","+250 g fromage à la crème|produits laitiers","Marbrer."]]},{"n":"Carrés aux Rice Krispies et guimauves","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":15,"sf":"","sv":"","m":["guimauves","céréales"],"nw":true,"i":[[60.0,"g","beurre","produits laitiers"],[300.0,"g","mini-guimauves","épicerie"],[180.0,"g","céréales de riz soufflé","épicerie"]],"s":"Beurrer un moule de 9 x 13 po. Dans une grande casserole, fondre le beurre à feu doux, ajouter les guimauves et remuer jusqu'à ce qu'elles soient complètement fondues. Retirer du feu, ajouter les céréales et mélanger jusqu'à ce qu'elles soient bien enrobées. Presser dans le moule avec une spatule beurrée, sans trop tasser. Laisser refroidir 30 min avant de couper.","v":[["Chocolat : nappage au chocolat","+150 g chocolat noir|épicerie","Fondre et napper."],["Beurre d'arachide","+125 ml beurre d'arachide|épicerie","Ajouter aux guimauves."],["Pépites : pépites colorées","+60 g bonbons colorés|épicerie","Mélanger."]]},{"n":"Carrés aux dattes","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":45,"sf":"","sv":"","m":["dattes","carrés"],"nw":true,"i":[[400.0,"g","dattes","épicerie"],[250.0,"g","flocons d'avoine","épicerie"],[200.0,"g","cassonade","garde-manger"],[125.0,"g","beurre","produits laitiers"],[150.0,"g","farine","garde-manger"]],"s":"Préchauffer le four à 350 °F et beurrer un moule carré de 9 po. Dans une casserole, cuire les dattes hachées avec 250 ml d'eau à feu moyen 8 à 10 min, en remuant, jusqu'à obtenir une compote lisse. Laisser tiédir. Dans un bol, mélanger les flocons d'avoine, la cassonade, la farine et une pincée de sel. Ajouter le beurre fondu et mélanger jusqu'à ce que ce soit grumeleux. Presser la moitié du mélange au fond du moule, étendre les dattes, puis couvrir du reste en pressant légèrement. Cuire 25 à 30 min, jusqu'à ce que le dessus soit doré. Laisser refroidir avant de couper.","v":[["Aux pommes : compote de pommes","+1 un pots de compote de pommes|épicerie","Mélanger aux dattes."],["Aux bleuets : bleuets","+300 g bleuets|surgelés","Remplacer les dattes."],["Aux noix","+80 g noix hachées|épicerie","Ajouter à la croûte."]]},{"n":"Gâteau au chocolat","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":55,"sf":"","sv":"","m":["chocolat","gâteau"],"nw":true,"i":[[300.0,"g","farine","garde-manger"],[300.0,"g","sucre","garde-manger"],[90.0,"g","cacao","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[250.0,"ml","lait","produits laitiers"],[125.0,"ml","huile végétale","garde-manger"],[250.0,"ml","café chaud","épicerie"]],"s":"Préchauffer le four à 350 °F et graisser un moule de 9 x 13 po. Dans un grand bol, mélanger la farine, le sucre, le cacao, 10 ml de bicarbonate de soude, 5 ml de poudre à pâte et 5 ml de sel. Ajouter les oeufs, le lait et l'huile, et fouetter 2 min. Incorporer le café chaud : la pâte sera liquide, c'est normal. Verser dans le moule. Cuire 35 min, jusqu'à ce qu'un cure-dent inséré au centre ressorte propre. Laisser refroidir complètement avant de glacer.","v":[["Glaçage au chocolat : ganache","+200 g chocolat noir|épicerie ; +200 ml crème 35%|produits laitiers","Faire une ganache."],["Cupcakes : en moules à muffins","","Cuire 20 min."],["Aux framboises : coulis de framboises","+300 g framboises|surgelés","Servir avec un coulis."]]},{"n":"Gâteau aux carottes","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":60,"sf":"","sv":"","m":["carottes","gâteau"],"nw":true,"i":[[4.0,"un","carottes","fruits et légumes"],[300.0,"g","farine","garde-manger"],[250.0,"g","sucre","garde-manger"],[3.0,"un","oeufs","produits laitiers"],[250.0,"ml","huile végétale","garde-manger"],[250.0,"g","fromage à la crème","produits laitiers"],[125.0,"g","sucre à glacer","garde-manger"]],"s":"Préchauffer le four à 350 °F et graisser un moule de 9 x 13 po. Peler et râper finement les carottes. Fouetter les oeufs, le sucre et l'huile. Ajouter la farine mélangée avec 10 ml de poudre à pâte, 5 ml de bicarbonate de soude, 10 ml de cannelle et 2 ml de sel, puis les carottes. Verser dans le moule et cuire 40 min, jusqu'à ce qu'un cure-dent ressorte propre. Laisser refroidir complètement. Glaçage : battre le fromage à la crème ramolli avec le sucre à glacer jusqu'à ce que ce soit lisse, puis étendre sur le gâteau.","v":[["Aux noix : noix hachées","+100 g noix hachées|épicerie","Ajouter."],["À l'ananas : ananas écrasé","+1 un ananas en conserve|épicerie","Ajouter."],["En muffins : muffins","","Cuire 22 min."]]},{"n":"Muffins aux bleuets","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":35,"sf":"","sv":"","m":["bleuets","muffins"],"nw":true,"i":[[300.0,"g","farine","garde-manger"],[150.0,"g","sucre","garde-manger"],[250.0,"ml","lait","produits laitiers"],[1.0,"un","oeuf","produits laitiers"],[80.0,"ml","huile végétale","garde-manger"],[250.0,"g","bleuets","surgelés"]],"s":"Préchauffer le four à 375 °F et chemiser un moule à 12 muffins. Dans un grand bol, mélanger la farine, le sucre, 15 ml de poudre à pâte et 2 ml de sel. Dans un autre bol, fouetter le lait, l'oeuf et l'huile. Verser les liquides sur les ingrédients secs et mélanger juste assez pour humecter : il doit rester des grumeaux. Incorporer délicatement les bleuets. Remplir les moules aux trois quarts. Cuire 20 à 22 min, jusqu'à ce qu'un cure-dent ressorte propre.","v":[["Streusel : garniture croustillante","+60 g beurre|produits laitiers ; +60 g cassonade|garde-manger","Émietter dessus."],["Citron : zeste de citron","+1 un citrons|fruits et légumes","Ajouter."],["Pépites de chocolat","-bleuets ; +200 g pépites de chocolat|garde-manger","Remplacer."]],"sp":1},{"n":"Pain aux bananes","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":70,"sf":"","sv":"","m":["bananes","pain"],"nw":true,"i":[[4.0,"un","bananes","fruits et légumes"],[200.0,"g","farine","garde-manger"],[150.0,"g","sucre","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[80.0,"g","beurre","produits laitiers"]],"s":"Préchauffer le four à 350 °F et beurrer un moule à pain de 9 x 5 po. Écraser les bananes à la fourchette. Ajouter les oeufs, le beurre fondu et le sucre, et bien mélanger. Incorporer la farine mélangée avec 5 ml de bicarbonate de soude et une pincée de sel, sans trop brasser. Verser dans le moule. Cuire 55 à 60 min, jusqu'à ce qu'un cure-dent ressorte propre. Laisser tiédir 10 min avant de démouler.","v":[["Pépites de chocolat","+150 g pépites de chocolat|garde-manger","Ajouter."],["Noix","+80 g noix de Grenoble|épicerie","Ajouter."],["Muffins : en 12 muffins","","Cuire 22 min."]],"sp":1},{"n":"Croustade aux pommes","e":"","k":"dessert","pr":"","st":["fruit"],"t":"","tm":55,"sf":"","sv":"","m":["pommes","croustade"],"nw":true,"i":[[8.0,"un","pommes","fruits et légumes"],[150.0,"g","flocons d'avoine","épicerie"],[150.0,"g","cassonade","garde-manger"],[100.0,"g","beurre","produits laitiers"],[100.0,"g","farine","garde-manger"]],"s":"Préchauffer le four à 350 °F. Peler les pommes, retirer le coeur et les trancher. Les étaler dans un plat de 9 x 13 po et saupoudrer de 5 ml de cannelle. Dans un bol, mélanger les flocons d'avoine, la cassonade et la farine, puis ajouter le beurre fondu et mélanger jusqu'à ce que ce soit grumeleux. Répartir sur les pommes. Cuire 40 min, jusqu'à ce que le dessus soit doré et que les pommes bouillonnent. Servir tiède.","v":[["Aux fraises et rhubarbe","-pommes ; +500 g fraises|fruits et légumes ; +400 g rhubarbe|fruits et légumes","Remplacer."],["Aux poires","-pommes ; +8 un poires|fruits et légumes","Remplacer."],["Aux bleuets","-pommes ; +600 g bleuets|surgelés","Remplacer."]]},{"n":"Pommes au four","e":"","k":"dessert","pr":"","st":["fruit"],"t":"","tm":40,"sf":"","sv":"","m":["pommes"],"nw":true,"i":[[6.0,"un","pommes","fruits et légumes"],[60.0,"g","cassonade","garde-manger"],[30.0,"g","beurre","produits laitiers"],[5.0,"ml","cannelle","garde-manger"]],"s":"Préchauffer le four à 375 °F. Évider les pommes sans percer le fond et les déposer dans un plat. Mélanger la cassonade et la cannelle, en remplir les pommes et coiffer d'un morceau de beurre. Verser 125 ml d'eau au fond du plat. Cuire 30 à 35 min, jusqu'à ce que les pommes soient tendres. Arroser du sirop du plat au moment de servir.","v":[["Raisins et noix","+60 g raisins secs|épicerie ; +40 g noix hachées|épicerie","Farcir."],["À l'érable","-cassonade ; +60 ml sirop d'érable|épicerie","Remplacer."],["Avec crème glacée","+1 un crème glacée à la vanille|surgelés","Servir avec."]],"sp":1},{"n":"Pouding chômeur","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":50,"sf":"","sv":"","m":["pouding","érable"],"nw":true,"i":[[250.0,"g","farine","garde-manger"],[150.0,"g","sucre","garde-manger"],[250.0,"ml","lait","produits laitiers"],[60.0,"g","beurre","produits laitiers"],[375.0,"ml","sirop d'érable","épicerie"],[250.0,"ml","crème 35%","produits laitiers"]],"s":"Préchauffer le four à 350 °F et beurrer un plat de 9 x 13 po. Battre le beurre ramolli et le sucre, puis ajouter le lait. Incorporer la farine mélangée avec 10 ml de poudre à pâte et une pincée de sel. Dans une casserole, porter le sirop d'érable et la crème à ébullition, puis verser dans le plat. Déposer la pâte par cuillerées sur le sirop chaud, sans l'étendre. Cuire 35 min, jusqu'à ce que le gâteau soit doré. Servir tiède.","v":[["Au sirop de caramel","-sirop d'érable ; +375 ml cassonade et eau|épicerie","Faire le sirop avec de la cassonade."],["Aux framboises","+200 g framboises|surgelés","Ajouter au fond."],["Individuel : en ramequins","","Cuire 25 min."]]},{"n":"Pouding au riz","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":45,"sf":"","sv":"","m":["pouding","riz"],"nw":true,"i":[[200.0,"g","riz à grains ronds","épicerie"],[1000.0,"ml","lait","produits laitiers"],[100.0,"g","sucre","garde-manger"],[5.0,"ml","vanille","garde-manger"],[5.0,"ml","cannelle","garde-manger"]],"s":"Dans une casserole à fond épais, porter le lait à frémissement. Ajouter le riz et la cannelle, baisser à feu doux et cuire 30 à 35 min, à découvert, en remuant souvent pour que ça ne colle pas. Quand le riz est tendre et crémeux, ajouter le sucre et la vanille et cuire encore 2 min. Servir tiède ou réfrigérer : il épaissit en refroidissant.","v":[["Raisins","+60 g raisins secs|épicerie","Ajouter."],["Coco : lait de coco","-250 ml lait ; +250 ml lait de coco|épicerie","Remplacer."],["Sirop d'érable","+60 ml sirop d'érable|épicerie","Remplacer le sucre."]]},{"n":"Mousse au chocolat","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":30,"sf":"","sv":"","m":["chocolat","mousse"],"nw":true,"i":[[200.0,"g","chocolat noir","épicerie"],[500.0,"ml","crème 35%","produits laitiers"],[3.0,"un","oeufs","produits laitiers"],[30.0,"g","sucre","garde-manger"]],"s":"Hacher le chocolat et le fondre au bain-marie, puis le laisser tiédir 5 min. Séparer les oeufs. Incorporer les jaunes un à un au chocolat. Fouetter la crème en pics mous et réfrigérer. Monter les blancs en neige avec le sucre jusqu'à ce qu'ils soient fermes et brillants. Incorporer délicatement le tiers des blancs au chocolat, puis le reste, puis la crème fouettée, à la spatule en soulevant. Répartir dans des verrines et réfrigérer au moins 4 h.","v":[["Au café : espresso","+30 ml café fort|épicerie","Ajouter."],["Orange : zeste","+1 un oranges|fruits et légumes","Ajouter."],["Express : sans oeufs","-oeufs ; +250 ml crème 35%|produits laitiers","Chocolat fondu et crème fouettée."]]},{"n":"Tarte au sucre","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":60,"sf":"","sv":"","m":["tarte","sucre"],"nw":true,"i":[[2.0,"un","abaisses de pâte à tarte","surgelés"],[250.0,"g","cassonade","garde-manger"],[250.0,"ml","crème 35%","produits laitiers"],[60.0,"g","farine","garde-manger"],[60.0,"g","beurre","produits laitiers"]],"s":"Préchauffer le four à 375 °F et foncer une assiette à tarte avec une abaisse (garder la deuxième pour une autre tarte ou des croisillons). Fondre le beurre. Dans un bol, mélanger la cassonade et la farine, puis ajouter la crème et le beurre fondu et fouetter jusqu'à ce que ce soit lisse. Verser dans la croûte. Cuire 35 min sur la grille du bas : la garniture doit être bouillonnante et encore un peu tremblotante au centre. Laisser refroidir au moins 2 h pour qu'elle fige.","v":[["À l'érable : sirop d'érable","+125 ml sirop d'érable|épicerie","Ajouter."],["Aux noix : noix de pécan","+100 g noix de pécan|épicerie","Ajouter."],["Individuelles : en tartelettes","","Cuire 20 min."]]},{"n":"Crêpes à la québécoise","e":"","k":"dessert","pr":"","st":["crepe"],"t":"","tm":30,"sf":"","sv":"","m":["crêpes"],"nw":true,"i":[[250.0,"g","farine","garde-manger"],[3.0,"un","oeufs","produits laitiers"],[500.0,"ml","lait","produits laitiers"],[30.0,"g","beurre","produits laitiers"],[250.0,"ml","sirop d'érable","épicerie"]],"s":"Fondre le beurre. Dans un bol, fouetter la farine avec une pincée de sel, ajouter les oeufs, puis le lait peu à peu, en fouettant pour éviter les grumeaux. Ajouter le beurre fondu. Laisser reposer 15 min si possible. Chauffer une poêle antiadhésive à feu moyen et la beurrer légèrement. Verser une petite louche de pâte et incliner la poêle pour couvrir le fond. Cuire 1 min, jusqu'à ce que le bord se détache, retourner et cuire 30 s. Servir avec le sirop d'érable.","v":[["Aux fraises et crème fouettée","+400 g fraises|fruits et légumes ; +250 ml crème 35%|produits laitiers","Garnir."],["Jambon-fromage : version salée","+250 g jambon cuit|viandes ; +200 g fromage râpé|produits laitiers","Garnir et plier."],["Banane et Nutella","+3 un bananes|fruits et légumes ; +125 ml tartinade chocolat-noisette|épicerie","Garnir."]]},{"n":"Verrines yogourt et granola","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":10,"sf":"","sv":"","m":["yogourt","granola"],"nw":true,"i":[[750.0,"ml","yogourt grec","produits laitiers"],[300.0,"g","granola","épicerie"],[400.0,"g","petits fruits","surgelés"],[60.0,"ml","miel","épicerie"]],"s":"Dans des verres ou des petits pots, alterner une couche de yogourt, une couche de petits fruits et une couche de granola. Répéter et terminer par quelques fruits. Arroser d'un filet de miel. Ajouter le granola au dernier moment pour qu'il reste croquant.","v":[["Au chocolat : pépites","+100 g pépites de chocolat|garde-manger","Ajouter."],["Tropical : mangue et noix de coco","-petits fruits ; +1 un mangues|fruits et légumes","Remplacer."],["Au beurre d'arachide","+60 ml beurre d'arachide|épicerie","Ajouter."]],"sp":1},{"n":"Salade de fruits","e":"","k":"dessert","pr":"","st":["fruit"],"t":"","tm":15,"sf":"","sv":"","m":["fruits"],"nw":true,"i":[[2.0,"un","pommes","fruits et légumes"],[3.0,"un","oranges","fruits et légumes"],[3.0,"un","bananes","fruits et légumes"],[400.0,"g","raisins","fruits et légumes"],[250.0,"g","fraises","fruits et légumes"]],"s":"Peler les oranges à vif et couper les quartiers en morceaux, au-dessus d'un bol pour garder le jus. Couper les pommes en dés et les mélanger tout de suite au jus d'orange pour qu'elles ne brunissent pas. Ajouter les raisins coupés en deux, les fraises en quartiers et les bananes tranchées juste avant de servir. Réfrigérer 15 min.","v":[["À la menthe","+15 ml menthe fraîche|fruits et légumes","Ajouter."],["Au yogourt","+250 ml yogourt à la vanille|produits laitiers","Servir avec."],["Au sirop d'érable","+30 ml sirop d'érable|épicerie","Arroser."]],"sp":1},{"n":"Gâteau renversé à l'ananas","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":55,"sf":"","sv":"","m":["ananas","gâteau"],"nw":true,"i":[[1.0,"un","boîtes d'ananas en rondelles","épicerie"],[100.0,"g","cassonade","garde-manger"],[60.0,"g","beurre","produits laitiers"],[250.0,"g","farine","garde-manger"],[150.0,"g","sucre","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[125.0,"ml","lait","produits laitiers"]],"s":"Préchauffer le four à 350 °F. Fondre la moitié du beurre dans un moule rond de 9 po, saupoudrer de cassonade et disposer les rondelles d'ananas égouttées par-dessus. Battre le reste du beurre ramolli avec le sucre, puis ajouter les oeufs. Incorporer la farine mélangée avec 10 ml de poudre à pâte et une pincée de sel, en alternant avec le lait. Étendre la pâte sur les ananas. Cuire 35 à 40 min, jusqu'à ce qu'un cure-dent ressorte propre. Laisser reposer 5 min, puis renverser sur une assiette.","v":[["Aux cerises : cerises au marasquin","+1 un pots de cerises au marasquin|épicerie","Ajouter au centre."],["Aux poires","-boîtes d'ananas ; +4 un poires|fruits et légumes","Remplacer."],["Individuel : en ramequins","","Cuire 20 min."]]},{"n":"Tapioca","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":35,"sf":"","sv":"","m":["tapioca","pouding"],"nw":true,"i":[[100.0,"g","perles de tapioca","épicerie"],[1000.0,"ml","lait","produits laitiers"],[100.0,"g","sucre","garde-manger"],[2.0,"un","oeufs","produits laitiers"],[5.0,"ml","vanille","garde-manger"]],"s":"Dans une casserole, laisser tremper le tapioca dans le lait 10 min. Porter à frémissement à feu moyen et cuire 15 min en remuant souvent, jusqu'à ce que les perles soient translucides. Battre les oeufs avec le sucre. Verser un peu de lait chaud sur les oeufs en fouettant, puis remettre le tout dans la casserole. Cuire 2 à 3 min à feu doux en remuant, sans faire bouillir, jusqu'à ce que ça épaississe. Ajouter la vanille. Servir tiède ou froid.","v":[["À l'érable","-sucre ; +90 ml sirop d'érable|épicerie","Remplacer le sucre."],["Coco","+125 ml lait de coco|épicerie","Ajouter."],["Aux fruits","+300 g petits fruits|surgelés","Garnir."]]},{"n":"Biscuits sablés au beurre","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":40,"sf":"","sv":"","m":["biscuits","beurre"],"nw":true,"i":[[250.0,"g","beurre","produits laitiers"],[120.0,"g","sucre","garde-manger"],[350.0,"g","farine","garde-manger"],[5.0,"ml","vanille","garde-manger"]],"s":"Préchauffer le four à 325 °F et tapisser deux plaques de papier parchemin. Battre le beurre ramolli et le sucre jusqu'à ce que ce soit léger, puis ajouter la vanille. Incorporer la farine et une pincée de sel jusqu'à ce que la pâte se tienne. Abaisser entre deux papiers parchemin à 5 mm d'épaisseur et réfrigérer 20 min. Découper à l'emporte-pièce et déposer sur les plaques. Cuire 12 à 14 min, jusqu'à ce que le bord commence à peine à dorer.","v":[["Trempés au chocolat","+150 g chocolat noir|épicerie","Tremper la moitié."],["Confiture : coeur de confiture","+125 ml confiture de fraises|épicerie","Garnir."],["Citron","+1 un citrons|fruits et légumes","Ajouter le zeste."]]},{"n":"Sundae bar","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":10,"sf":"","sv":"","m":["crème glacée"],"nw":true,"i":[[1.0,"un","crème glacée à la vanille","surgelés"],[250.0,"ml","sauce au chocolat","épicerie"],[250.0,"ml","sauce au caramel","épicerie"],[100.0,"g","bonbons colorés","épicerie"],[100.0,"g","arachides","épicerie"]],"s":"Sortir la crème glacée 10 min avant de servir pour qu'elle soit plus facile à servir. Réchauffer légèrement la sauce au chocolat et la sauce au caramel. Hacher grossièrement les arachides. Disposer les sauces et les garnitures dans des petits bols, et laisser chacun monter son sundae.","v":[["Aux fruits : bananes et fraises","+3 un bananes|fruits et légumes ; +250 g fraises|fruits et légumes","Garnir."],["Brownie","+1 un brownies|boulangerie","Servir sur un brownie."],["Sorbet","-crème glacée à la vanille ; +1 un sorbet|surgelés","Remplacer."]],"sp":1},{"n":"Soupe aux légumes maison","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":35,"sf":"","sv":"","m":["légumes","soupe"],"nw":true,"i":[[3.0,"un","carottes","fruits et légumes"],[2.0,"un","branches de céleri","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[2.0,"un","pommes de terre","fruits et légumes"],[1500.0,"ml","bouillon de légumes","épicerie"],[500.0,"ml","tomates en dés","épicerie"]],"s":"Hacher l'oignon et couper les carottes, le céleri et les pommes de terre en petits dés. Dans une grande casserole, faire revenir l'oignon dans un filet d'huile 3 min. Ajouter les légumes et cuire 5 min en remuant. Ajouter le bouillon et les tomates, saler, poivrer et ajouter une feuille de laurier. Porter à ébullition et mijoter 25 min à couvert, jusqu'à ce que les légumes soient tendres.","v":[["Crémeuse : mixée avec un peu de crème","+125 ml crème 15%|produits laitiers","Mixer et ajouter la crème."],["Aux pâtes : petites pâtes","+150 g petites pâtes|épicerie","Ajouter dans les 8 dernières minutes."],["Au bacon : bacon croustillant","+150 g bacon|viandes","Parsemer au service."]]},{"n":"Crème de brocoli et cheddar","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":30,"sf":"","sv":"","m":["brocoli","cheddar"],"nw":true,"i":[[700.0,"g","brocoli","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[1000.0,"ml","bouillon de légumes","épicerie"],[250.0,"ml","crème 15%","produits laitiers"],[200.0,"g","cheddar râpé","produits laitiers"]],"s":"Hacher l'oignon et couper le brocoli en bouquets (peler et trancher la tige). Dans une casserole, faire revenir l'oignon dans un peu de beurre 3 min. Ajouter le brocoli et le bouillon, porter à ébullition et mijoter 15 min. Réduire en purée au mélangeur à main. Ajouter la crème et réchauffer à feu doux. Incorporer le cheddar une poignée à la fois, hors du feu, jusqu'à ce qu'il soit fondu. Saler et poivrer.","v":[["Aux pommes de terre : texture plus onctueuse","+2 un pommes de terre|fruits et légumes","Cuire avec le brocoli."],["Sans fromage : légère","-cheddar","Omettre le fromage."],["Croûtons : croûtons à l'ail","+100 g croûtons|boulangerie","Parsemer au service."]]},{"n":"Soupe tomate et basilic","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":25,"sf":"","sv":"","m":["tomate","basilic"],"nw":true,"i":[[1.0,"un","oignon","fruits et légumes"],[900.0,"ml","tomates en dés","épicerie"],[750.0,"ml","bouillon de légumes","épicerie"],[125.0,"ml","crème 15%","produits laitiers"],[30.0,"ml","basilic frais","fruits et légumes"]],"s":"Hacher l'oignon et le faire revenir dans un filet d'huile d'olive 5 min, avec une gousse d'ail si désiré. Ajouter les tomates et le bouillon, saler, poivrer et ajouter une pincée de sucre. Mijoter 15 min. Réduire en purée lisse au mélangeur à main. Ajouter la crème et le basilic ciselé, et réchauffer sans faire bouillir.","v":[["Rôtie : tomates rôties au four","+500 g tomates fraîches|fruits et légumes","Rôtir 25 min à 425°F avant de mixer."],["Grilled cheese : sandwichs à tremper","+8 un tranches de pain|boulangerie ; +200 g fromage tranché|produits laitiers","Préparer des petits sandwichs grillés."],["Aux poivrons : poivrons rôtis","+2 un poivrons rouges|fruits et légumes","Rôtir et mixer avec la soupe."]]},{"n":"Velouté de courge butternut","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":40,"sf":"","sv":"","m":["courge","velouté"],"nw":true,"i":[[1000.0,"g","courge butternut","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[1000.0,"ml","bouillon de légumes","épicerie"],[125.0,"ml","crème 15%","produits laitiers"],[15.0,"ml","sirop d'érable","épicerie"]],"s":"Peler la courge, retirer les graines et la couper en cubes. Hacher l'oignon et le faire revenir dans un peu de beurre 5 min. Ajouter la courge et le bouillon, porter à ébullition et mijoter 25 min, jusqu'à ce que la courge soit très tendre. Réduire en purée lisse. Ajouter la crème et le sirop d'érable, saler, poivrer et ajouter une pincée de muscade.","v":[["Au cari : pâte de cari","+15 ml pâte de cari|épicerie","Ajouter avec l'oignon."],["Aux pommes : pommes en dés","+2 un pommes|fruits et légumes","Cuire avec la courge."],["Lait de coco : version sans produits laitiers","-crème 15% ; +250 ml lait de coco|épicerie","Remplacer la crème."]]},{"n":"Soupe carottes et gingembre","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":35,"sf":"","sv":"","m":["carottes","gingembre"],"nw":true,"i":[[700.0,"g","carottes","fruits et légumes"],[1.0,"un", s Kalamata","épicerie"],[60.0,"ml","huile d'olive","garde-manger"]],"s":"Couper les concombres et les tomates en gros morceaux et émincer l'oignon rouge. Mettre dans un bol avec les olives. Arroser d'huile d'olive et d'un trait de jus de citron ou de vinaigre de vin rouge. Saupoudrer de 5 ml d'origan, saler légèrement et poivrer. Déposer la feta en morceaux ou en tranche sur le dessus.","v":[["Au poulet : poulet grillé","+400 g poitrines de poulet|viandes","Griller et trancher."],["Aux pois chiches : pois chiches","+1 un boîtes de pois chiches|épicerie","Ajouter égouttés."],["Pâtes : salade de pâtes","+300 g rotini|épicerie","Cuire et refroidir les pâtes."]]},{"n":"Salade de pommes et noix","e":"","k":"entree","pr":"vege","st":["salade"],"t":"","tm":15,"sf":"","sv":"","m":["pommes","noix"],"nw":true,"i":[[2.0,"un","pommes","fruits et légumes"],[200.0,"g","mélange de jeunes pousses","fruits et légumes"],[60.0,"g","noix de Grenoble","épicerie"],[100.0,"g","fromage bleu ou chèvre","produits laitiers"],[60.0,"ml","vinaigrette balsamique","épicerie"]],"s":"Griller les noix 5 min à sec dans une poêle, puis les hacher grossièrement. Trancher finement les pommes juste avant de servir. Dans un grand bol, mélanger les jeunes pousses et les pommes avec la vinaigrette. Garnir de noix et de fromage émietté.","v":[["Canneberges : canneberges séchées","+60 g canneberges séchées|épicerie","Ajouter."],["Au bacon : bacon croustillant","+150 g bacon|viandes","Émietter."],["Poires : poires à la place","-pommes ; +2 un poires|fruits et légumes","Remplacer."]]},{"n":"Salade caprese","e":"","k":"entree","pr":"vege","st":["salade"],"t":"","tm":10,"sf":"","sv":"","m":["tomate","mozzarella"],"nw":true,"i":[[4.0,"un","tomates","fruits et légumes"],[300.0,"g","mozzarella fraîche","produits laitiers"],[30.0,"ml","basilic frais","fruits et légumes"],[45.0,"ml","huile d'olive","garde-manger"]],"s":"Trancher les tomates et la mozzarella en rondelles de 1 cm. Les disposer en alternance dans une assiette de service. Parsemer de basilic, arroser d'huile d'olive, saler au sel de mer et poivrer. Ajouter un filet de vinaigre balsamique si désiré.","v":[["Balsamique : réduction balsamique","+45 ml vinaigre balsamique|épicerie","Arroser au service."],["Pêches : pêches grillées","+2 un pêches|fruits et légumes","Ajouter en été."],["Prosciutto : jambon sec","+100 g prosciutto|viandes","Ajouter."]]},{"n":"Trempette épinards et artichauts","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":30,"sf":"","sv":"","m":["épinards","artichauts"],"nw":true,"i":[[1.0,"un","boîtes de coeurs d'artichauts","épicerie"],[300.0,"g","épinards surgelés","surgelés"],[250.0,"g","fromage à la crème","produits laitiers"],[125.0,"ml","mayonnaise","épicerie"],[150.0,"g","parmesan","produits laitiers"],[1.0,"un","baguettes","boulangerie"]],"s":"Préchauffer le four à 375 °F. Décongeler les épinards et les presser fort pour retirer l'eau. Égoutter et hacher les coeurs d'artichauts. Mélanger le fromage à la crème ramolli, la mayonnaise, les deux tiers du parmesan, les épinards, les artichauts et une gousse d'ail hachée. Verser dans un petit plat et couvrir du reste du parmesan. Cuire 20 min, jusqu'à ce que ce soit bouillonnant. Servir avec la baguette tranchée et grillée.","v":[["Épicée : jalapeños","+2 un piments jalapeños|fruits et légumes","Ajouter hachés."],["Au bacon : bacon","+150 g bacon|viandes","Ajouter émietté."],["Froide : sans cuisson","","Servir froide avec crudités."]]},{"n":"Hummus et crudités","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":15,"sf":"","sv":"","m":["hummus","crudités"],"nw":true,"i":[[2.0,"un","boîtes de pois chiches","épicerie"],[60.0,"ml","tahini","épicerie"],[2.0,"un","citrons","fruits et légumes"],[2.0,"un","gousses d'ail","fruits et légumes"],[4.0,"un","carottes","fruits et légumes"],[1.0,"un","concombres","fruits et légumes"]],"s":"Égoutter et rincer les pois chiches. Au robot, mixer les pois chiches, le tahini, le jus des citrons, l'ail et 5 ml de sel. Ajouter de l'eau froide une cuillerée à la fois jusqu'à ce que ce soit très lisse et crémeux. Verser dans un bol, arroser d'huile d'olive et saupoudrer de paprika. Couper les carottes et le concombre en bâtonnets pour tremper.","v":[["Poivrons rôtis : poivrons rouges rôtis","+1 un poivrons rouges|fruits et légumes","Mixer avec le hummus."],["Pita : pitas grillés","+6 un pitas|boulangerie","Griller et couper en triangles."],["Piquant : sauce piquante","+15 ml sauce piquante|épicerie","Ajouter."]]},{"n":"Guacamole et croustilles de tortilla","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":15,"sf":"","sv":"","m":["avocat","guacamole"],"nw":true,"i":[[4.0,"un","avocats","fruits et légumes"],[2.0,"un","limes","fruits et légumes"],[1.0,"un","oignon rouge","fruits et légumes"],[2.0,"un","tomates","fruits et légumes"],[1.0,"un","sac de croustilles de tortilla","épicerie"]],"s":"Couper les avocats en deux, retirer le noyau et vider la chair dans un bol. L'écraser à la fourchette avec le jus des limes et 2 ml de sel. Hacher finement l'oignon rouge et couper les tomates en petits dés. Incorporer au guacamole et rectifier le sel. Servir aussitôt avec les croustilles.","v":[["Piquant : jalapeño","+1 un piments jalapeños|fruits et légumes","Ajouter haché."],["Mangue : mangue en dés","+1 un mangues|fruits et légumes","Ajouter."],["Salsa maison : salsa fraîche","+250 ml salsa|épicerie","Servir en plus."]]},{"n":"Bruschettas tomate-basilic","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":15,"sf":"","sv":"","m":["tomate","bruschetta"],"nw":true,"i":[[1.0,"un","baguettes","boulangerie"],[500.0,"g","tomates","fruits et légumes"],[3.0,"un","gousses d'ail","fruits et légumes"],[30.0,"ml","basilic frais","fruits et légumes"],[45.0,"ml","huile d'olive","garde-manger"]],"s":"Couper les tomates en petits dés et les laisser égoutter 10 min dans une passoire. Les mélanger avec l'huile d'olive, le basilic ciselé, une gousse d'ail hachée, du sel et du poivre. Trancher la baguette en biais et griller les tranches au four à 425 °F 5 min. Frotter chaque tranche chaude avec une gousse d'ail coupée en deux. Garnir de tomates juste avant de servir.","v":[["Au fromage de chèvre : chèvre","+150 g fromage de chèvre|produits laitiers","Étaler avant les tomates."],["Au balsamique : glaçage","+30 ml vinaigre balsamique|épicerie","Arroser."],["Prosciutto : jambon sec","+100 g prosciutto|viandes","Ajouter."]]},{"n":"Rouleaux de printemps","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":25,"sf":"","sv":"","m":["rouleaux","printemps"],"nw":true,"i":[[12.0,"un","feuilles de riz","épicerie"],[100.0,"g","vermicelles de riz","épicerie"],[2.0,"un","carottes","fruits et légumes"],[1.0,"un","concombres","fruits et légumes"],[250.0,"g","crevettes cuites","poissonnerie"],[125.0,"ml","sauce hoisin","épicerie"]],"s":"Cuire les vermicelles selon l'emballage, les rincer à l'eau froide et bien les égoutter. Couper les carottes et le concombre en fine julienne, et couper les crevettes en deux sur l'épaisseur. Tremper une feuille de riz 10 à 15 s dans l'eau tiède, puis la déposer sur un linge humide. Déposer quelques crevettes, des vermicelles et des légumes dans le tiers du bas. Replier le bas, puis les côtés, et rouler serré. Couvrir d'un linge humide en attendant de servir. Servir avec la sauce hoisin allongée d'un peu de beurre d'arachide et d'eau.","v":[["Végé : tofu","-crevettes cuites ; +250 g tofu ferme|produits laitiers","Dorer le tofu en bâtonnets."],["Au poulet : poulet cuit","-crevettes cuites ; +250 g poulet cuit|viandes","Ajouter en lanières."],["Sauce arachide : trempette","+60 ml beurre d'arachide|épicerie","Diluer avec la hoisin."]]},{"n":"Oeufs farcis","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":25,"sf":"","sv":"","m":["oeufs","farcis"],"nw":true,"i":[[8.0,"un","oeufs","produits laitiers"],[60.0,"ml","mayonnaise","épicerie"],[15.0,"ml","moutarde","épicerie"],[5.0,"ml","paprika","garde-manger"]],"s":"Déposer les oeufs dans une casserole d'eau froide, porter à ébullition, couvrir, retirer du feu et laisser reposer 10 min. Les refroidir dans l'eau glacée et les écaler. Couper les oeufs en deux sur la longueur et retirer les jaunes. Écraser les jaunes avec la mayonnaise et la moutarde, saler et poivrer. Remplir les blancs à la cuillère ou à la poche. Saupoudrer de paprika et réfrigérer jusqu'au service.","v":[["Au bacon : bacon","+100 g bacon|viandes","Émietter dessus."],["Au curry : pâte de cari","+5 ml pâte de cari|épicerie","Ajouter aux jaunes."],["À l'avocat : avocat","+1 un avocats|fruits et légumes","Mélanger aux jaunes."]]},{"n":"Crevettes cocktail","e":"","k":"entree","pr":"poisson","st":["bouchee"],"t":"","tm":10,"sf":"","sv":"","m":["crevettes","cocktail"],"nw":true,"i":[[600.0,"g","crevettes cuites","poissonnerie"],[250.0,"ml","sauce cocktail","épicerie"],[2.0,"un","citrons","fruits et légumes"]],"s":"Si les crevettes sont congelées, les décongeler au réfrigérateur toute la nuit ou 10 min sous l'eau froide, puis bien les éponger. Les garder au froid jusqu'au service. Verser la sauce cocktail dans un petit bol au centre d'un plat. Disposer les crevettes autour, avec les citrons en quartiers.","v":[["Ail : sautées à l'ail","+30 g beurre|produits laitiers ; +2 un gousses d'ail|fruits et légumes","Saisir 2 min."],["Avocat : coupe à l'avocat","+2 un avocats|fruits et légumes","Servir en verrines."],["Piquant : sauce piquante","+15 ml sauce piquante|épicerie","Ajouter à la sauce."]]},{"n":"Bâtonnets de mozzarella","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":20,"sf":"","sv":"","m":["mozzarella","bâtonnets"],"nw":true,"i":[[12.0,"un","bâtonnets de fromage mozzarella","produits laitiers"],[2.0,"un","oeufs","produits laitiers"],[250.0,"ml","chapelure","épicerie"],[250.0,"ml","sauce marinara","épicerie"]],"s":"Mettre les bâtonnets au congélateur 30 min : ils fondront moins vite. Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin huilé. Battre les oeufs dans un bol et mettre la chapelure assaisonnée d'origan dans un autre. Tremper chaque bâtonnet dans l'oeuf, puis la chapelure, puis encore l'oeuf et la chapelure. Déposer sur la plaque et vaporiser d'huile. Cuire 8 à 10 min, jusqu'à ce qu'ils soient dorés, avant que le fromage ne s'échappe. Servir avec la sauce marinara chaude.","v":[["Friteuse à air : cuisson croustillante","","Cuire 8 min à 400°F."],["Parmesan : panure au parmesan","+60 g parmesan|produits laitiers","Ajouter à la chapelure."],["Oignons : rondelles d'oignon","+2 un oignons|fruits et légumes","Paner aussi des rondelles."]]},{"n":"Mini quiches","e":"","k":"entree","pr":"porc","st":["bouchee"],"t":"","tm":30,"sf":"","sv":"","m":["quiche","bacon"],"nw":true,"i":[[12.0,"un","fonds de tartelettes","surgelés"],[4.0,"un","oeufs","produits laitiers"],[125.0,"ml","crème 15%","produits laitiers"],[150.0,"g","bacon","viandes"],[100.0,"g","fromage râpé","produits laitiers"]],"s":"Préchauffer le four à 375 °F. Cuire le bacon jusqu'à ce qu'il soit croustillant, puis l'émietter. Déposer les fonds de tartelettes sur une plaque. Répartir le bacon et le fromage dans les fonds. Fouetter les oeufs et la crème avec du sel, du poivre et une pincée de muscade, puis remplir les fonds aux trois quarts. Cuire 18 à 20 min, jusqu'à ce que la garniture soit prise et dorée. Servir tiède.","v":[["Végé : épinards et feta","-bacon ; +100 g épinards|fruits et légumes ; +100 g feta|produits laitiers","Faire tomber les épinards."],["Jambon : jambon","-bacon ; +150 g jambon cuit|viandes","Remplacer le bacon."],["Oignons caramélisés : oignons","+2 un oignons|fruits et légumes","Faire caraméliser."]]},{"n":"Crostinis chèvre et miel","e":"","k":"entree","pr":"vege","st":["bouchee"],"t":"","tm":15,"sf":"","sv":"","m":["chèvre","miel"],"nw":true,"i":[[1.0,"un","baguettes","boulangerie"],[200.0,"g","fromage de chèvre","produits laitiers"],[45.0,"ml","miel","épicerie"],[60.0,"g","noix de Grenoble","épicerie"]],"s":"Préchauffer le four à 400 °F. Trancher la baguette en biais, badigeonner d'huile d'olive et griller 6 à 8 min, jusqu'à ce que ce soit doré. Griller les noix 5 min à sec dans une poêle et les hacher. Tartiner le chèvre sur les crostinis tièdes. Arroser de miel, garnir de noix et poivrer.","v":[["Figues : confiture de figues","+125 ml confiture de figues|épicerie","Ajouter une cuillère."],["Bacon : bacon croustillant","+100 g bacon|viandes","Émietter."],["Poires : tranches de poire","+2 un poires|fruits et légumes","Ajouter."]]},{"n":"Poulet au parmesan","e":"","k":"souper","pr":"poulet","st":["four"],"t":"viande","tm":35,"sf":"pain_ail","sv":"salade_verte","m":["poulet","parmesan"],"nw":true,"i":[[1000.0,"g","poitrines de poulet","viandes"],[250.0,"ml","chapelure panko","épicerie"],[100.0,"g","parmesan râpé","produits laitiers"],[2.0,"un","oeufs","produits laitiers"],[500.0,"ml","sauce tomate","épicerie"],[200.0,"g","mozzarella râpée","produits laitiers"]],"s":"Préchauffer le four à 400 °F. Trancher les poitrines en deux sur l'épaisseur pour faire des escalopes minces, saler et poivrer. Battre les oeufs dans un bol, et mélanger le panko et le parmesan dans un autre. Tremper chaque escalope dans l'oeuf, puis l'enrober du mélange en pressant. Dans une grande poêle, dorer les escalopes dans un bon filet d'huile 3 min par côté, en plusieurs fois. Les déposer dans un plat, napper de sauce tomate et couvrir de mozzarella. Gratiner au four 8 à 10 min, jusqu'à ce que le fromage soit doré et le poulet à 165 °F.","v":[["Au four, sans friture : escalopes panées cuites au four","","Cuire les escalopes panées sur une plaque huilée à 425°F 18 min en les retournant à mi-cuisson, puis napper de sauce et gratiner."],["Sur spaghetti : servi sur des pâtes avec la sauce supplémentaire","+500 g spaghetti|épicerie ; +250 ml sauce tomate|épicerie ; @f=aucun","Cuire les spaghetti pendant que les escalopes dorent, napper de sauce et servir par-dessus."],["Sandwich parmigiana : escalopes dans un pain sous-marin grillé","+6 un pains sous-marin|boulangerie ; @f=aucun","Garnir les pains ouverts d'une escalope, de sauce et de mozzarella, puis gratiner 3 min."]],"tp":30},{"n":"Poulet teriyaki et riz","e":"","k":"souper","pr":"poulet","st":["asia"],"t":"riz","tm":30,"sf":"riz_blanc","sv":"brocoli","m":["poulet","teriyaki"],"nw":true,"i":[[900.0,"g","poitrines de poulet","viandes"],[125.0,"ml","sauce teriyaki","épicerie"],[30.0,"ml","miel","épicerie"],[15.0,"ml","huile végétale","garde-manger"],[15.0,"ml","fécule de maïs","garde-manger"],[4.0,"un","oignons verts","fruits et légumes"],[15.0,"ml","graines de sésame","garde-manger"]],"s":"Cuire le riz si ce n'est pas fait. Couper le poulet en dés de 2 cm. Mélanger la sauce teriyaki, le miel et la fécule de maïs. Dans une grande poêle, chauffer l'huile à feu vif et saisir le poulet 6 à 7 min, en deux fois au besoin, jusqu'à ce qu'il soit doré et cuit. Verser la sauce et cuire 2 à 3 min en remuant, jusqu'à ce qu'elle épaississe et enrobe le poulet. Garnir d'oignons verts émincés et de graines de sésame.","v":[["Teriyaki ananas : ananas en dés pour le côté sucré","+1 un ananas en conserve|épicerie","Ajouter l'ananas égoutté avec la sauce."],["Teriyaki épicé : une touche de sriracha","+30 ml sauce sriracha|épicerie","Ajouter la sriracha à la sauce avant de napper."],["Bol teriyaki aux légumes : poivrons et carottes sautés avec le poulet","+2 un poivrons|fruits et légumes ; +3 un carottes|fruits et légumes ; @v=aucun","Faire sauter les légumes en bâtonnets 4 min avant d'ajouter le poulet."]]},{"n":"Poulet tikka masala express","e":"","k":"souper","pr":"poulet","st":["asia"],"t":"riz","tm":35,"sf":"riz_blanc","sv":"","m":["poulet","tikka"],"nw":true,"i":[[900.0,"g","poitrines de poulet","viandes"],[90.0,"ml","pâte de tikka masala","épicerie"],[500.0,"ml","sauce tomate","épicerie"],[250.0,"ml","crème 35%","produits laitiers"],[1.0,"un","oignon","fruits et légumes"],[1.0,"un","naan","boulangerie"]],"s":"Hacher l'oignon
