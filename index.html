rizo en dés avant d'ajouter les haricots."]]},{"n":"Granola maison et yogourt","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":40,"sf":"","sv":"","m":["flocons d'avoine","yogourt"],"nw":true,"i":[[400,"g","flocons d'avoine","épicerie"],[125,"ml","sirop d'érable","épicerie"],[150,"g","amandes","épicerie"],[100,"g","raisins secs","épicerie"],[1500,"ml","yogourt nature","produits laitiers"]],"s":"Mélanger l'avoine, les amandes hachées, le sirop et 60 ml d'huile. Étaler sur une plaque et cuire 25 min à 325 °F en brassant à mi-cuisson. Ajouter les raisins une fois refroidi. Se garde 2 semaines dans un pot : servir avec le yogourt.","v":[["Sans noix (pour l'école)","-amandes ; +150 g graines de citrouille|épicerie",""]],"sp":1},{"n":"Muffins aux oeufs","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":30,"sf":"","sv":"","m":["oeufs","jambon"],"nw":true,"i":[[12,"un","oeufs","produits laitiers"],[125,"ml","lait","produits laitiers"],[200,"g","jambon en dés","viandes"],[1,"un","poivron","fruits et légumes"],[150,"g","cheddar râpé","produits laitiers"]],"s":"Battre les oeufs et le lait. Répartir le jambon, le poivron en dés et le fromage dans un moule à muffins graissé, puis verser les oeufs. Cuire 20 min à 350 °F. Se réchauffent 30 secondes au micro-ondes : déjeuners pressés de la semaine.","v":[["Végé épinards et feta","-jambon en dés ; -cheddar râpé ; +100 g jeunes épinards|fruits et légumes ; +150 g feta|produits laitiers",""]]},{"n":"Brisket fumé (pointe de poitrine)","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":720,"sf":"wedges","sv":"salade_chou","m":["brisket","pointe de poitrine","boeuf"],"nw":true,"i":[[2500,"g","pointe de poitrine de boeuf (brisket)","viandes"],[30,"ml","paprika fumé","garde-manger"],[30,"g","cassonade","garde-manger"],[250,"ml","sauce BBQ","épicerie"]],"s":"La veille, parer le gras à 6 mm et frotter de gros sel, de poivre concassé, de paprika fumé et de cassonade. Fumer à 225 °F jusqu'à 165 °F à cœur (6 à 8 h). Emballer dans du papier boucher et poursuivre jusqu'à 200-203 °F, tendre comme du beurre (2 à 4 h). Reposer 1 h emballé dans une glacière. Trancher contre le grain. Garder les restes pour d'autres repas.","v":[["Style Texas (sel et poivre seulement)","-paprika fumé ; -cassonade","Seulement gros sel et poivre concassé, moitié-moitié."],["Avec burnt ends","+125 ml sirop d'érable|épicerie","Couper la pointe en cubes, enrober de sauce BBQ et de sirop d'érable, remettre 1 h au fumoir dans un plat d'alu."]],"rs":{"lbl":"boeuf fumé","w":["boeuf fume"],"x":[[1000,"g","pointe de poitrine de boeuf (brisket)","viandes"]]},"tp":45},{"n":"Porc effiloché au fumoir","e":"","k":"souper","pr":"","st":["fumoir","sandwich"],"t":"sandwich","tm":600,"sf":"","sv":"salade_chou","m":["porc","epaule de porc"],"nw":true,"i":[[2500,"g","épaule de porc","viandes"],[60,"g","cassonade","garde-manger"],[30,"ml","paprika fumé","garde-manger"],[15,"ml","poudre d'ail","garde-manger"],[30,"ml","moutarde jaune","épicerie"],[375,"ml","sauce BBQ","épicerie"],[250,"ml","jus de pomme","épicerie"],[8,"un","pains kaiser","boulangerie"]],"s":"La veille, enduire l'épaule de moutarde puis du mélange cassonade, paprika fumé, ail, sel et poivre. Fumer à 250 °F jusqu'à 195-203 °F à cœur (8 à 10 h), en vaporisant de jus de pomme toutes les heures après 3 h. Reposer 30 min, effilocher, mélanger avec la sauce BBQ. Servir dans les pains avec la salade de chou.","v":[["Sauce de la Caroline (vinaigre)","-sauce BBQ ; +250 ml vinaigre de cidre|épicerie ; +15 ml flocons de piment|garde-manger","Remplacer la sauce BBQ par vinaigre de cidre, flocons de piment et un peu de cassonade."]],"rs":{"lbl":"porc effiloché","w":["porc effiloche"],"x":[[1000,"g","épaule de porc","viandes"]]},"tp":20},{"n":"Côtes levées fumées 3-2-1","e":"","k":"souper","pr":"","st":["fumoir","bbq"],"t":"viande","tm":360,"sf":"wedges","sv":"salade_chou","m":["cotes levees","porc"],"nw":true,"i":[[2400,"g","côtes levées de flanc (St-Louis)","viandes"],[60,"g","cassonad ],"t":"viande","tm":180,"sf":"riz_blanc","sv":"salade_concombre","m":["saumon"],"nw":true,"i":[[1200,"g","filet de saumon (côté entier)","poissonnerie"],[125,"ml","sirop d'érable","épicerie"],[100,"g","cassonade","garde-manger"]],"s":"Saumurer 4 h au frigo dans 1 L d'eau, la cassonade et 60 ml de gros sel. Rincer, sécher 1 h au frigo pour former une pellicule. Fumer à 175 °F, 2 h à 2 h 30, jusqu'à 140 °F à cœur, en badigeonnant de sirop d'érable aux 30 min. Bois d'érable ou de pommier.","v":[["Poivre et aneth","+30 ml aneth frais|fruits et légumes","Couvrir de poivre concassé et d'aneth avant de fumer."]],"tp":20},{"n":"Ailes de poulet fumées","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":150,"sf":"","sv":"crudites","m":["ailes de poulet"],"nw":true,"i":[[2000,"g","ailes de poulet","viandes"],[60,"g","cassonade","garde-manger"],[30,"ml","paprika fumé","garde-manger"],[15,"ml","poudre d'ail","garde-manger"],[250,"ml","sauce piquante","épicerie"],[60,"g","beurre","produits laitiers"]],"s":"Éponger les ailes et les laisser sécher 1 h à découvert au réfrigérateur si possible. Mélanger la cassonade, le paprika fumé, la poudre d'ail et 10 ml de sel, et en frotter les ailes. Préchauffer le fumoir à 225 °F. Fumer 1 h. Monter à 400 °F (ou finir sur le BBQ à feu moyen-vif) et cuire 20 à 30 min, jusqu'à ce que la peau soit croustillante et la viande à 175 °F. Fondre le beurre avec la sauce piquante et y enrober les ailes chaudes.","v":[["Miel et ail","-sauce piquante ; +125 ml miel|épicerie ; +4 un gousses d'ail|fruits et légumes",""],["Sel et poivre (sans sauce)","-sauce piquante ; -beurre",""]],"tp":15},{"n":"Saucisses et fèves au lard au fumoir","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":240,"sf":"pain_croute","sv":"salade_chou","m":["saucisse","feves au lard"],"nw":true,"i":[[1000,"g","saucisses (bratwurst ou porc)","viandes"],[2,"un","boîtes de fèves au lard","épicerie"],[1,"un","oignon","fruits et légumes"],[125,"ml","mélasse","épicerie"],[250,"g","bacon","viandes"],[125,"ml","sauce BBQ","épicerie"]],"s":"Dans un plat d'alu, mélanger les fèves, l'oignon haché, la mélasse, la sauce BBQ et le bacon en morceaux. Fumer à 250 °F, 3 h, en brassant à l'occasion. Ajouter les saucisses sur la grille au-dessus des fèves pour la dernière heure : leur jus tombe dans les fèves.","v":[],"tp":20},{"n":"Pain de viande fumé","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":180,"sf":"patates_pilees","sv":"haricots_verts","m":["boeuf hache"],"nw":true,"i":[[1000,"g","boeuf haché","viandes"],[2,"un","oeufs","produits laitiers"],[100,"g","chapelure","épicerie"],[1,"un","oignon","fruits et légumes"],[250,"ml","sauce BBQ","épicerie"],[250,"g","bacon","viandes"]],"s":"Préchauffer le fumoir à 250 °F. Râper finement l'oignon. Mélanger le boeuf, les oeufs, la chapelure, l'oignon, la moitié de la sauce BBQ, 7 ml de sel et du poivre, sans trop pétrir. Façonner un pain ovale sur une grille ou une plaque perforée. Couvrir de tranches de bacon en les tressant ou en les chevauchant. Fumer environ 2 h 30, jusqu'à 160 °F au centre. Badigeonner du reste de sauce pendant la dernière demi-heure. Laisser reposer 10 min avant de trancher.","v":[["Farci au fromage","+200 g cheddar|produits laitiers","Mettre des bâtonnets de cheddar au centre du pain avant de le refermer."]],"tp":25},{"n":"Jambon double fumé à l'érable","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":240,"sf":"patates_pilees","sv":"carottes","m":["jambon"],"nw":true,"i":[[2000,"g","épaule de jambon fumée","viandes"],[250,"ml","sirop d'érable","épicerie"],[60,"ml","moutarde de Dijon","épicerie"],[60,"g","cassonade","garde-manger"]],"s":"Préchauffer le fumoir à 250 °F. Retirer le filet de l'épaule et quadriller le gras au couteau, sans entailler la viande. Fumer 2 h 30 à 3 h, jusqu'à 140 °F au centre. Mélanger le sirop d'érable, la moutarde et la cassonade. Pendant la dernière heure, badigeonner le jambon aux 30 min. Laisser reposer 15 min avant de trancher. Garder des restes pour les dîners et la soupe aux pois.","v":[],"rs":{"lbl":"jambon cuit","w":["jambon"],"x":[[1000,"g","épaule de jambon fumée","viandes"]]},"tp":15},{"n":"Poitrine de dinde fumée","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":240,"sf":"grelots","sv":"salade_verte","m":["dinde"],"nw":true,"i":[[2000,"g","poitrine de dinde avec os","viandes"],[60,"g","beurre","produits laitiers"],[30,"ml","paprika fumé","garde-manger"],[15,"ml","poudre d'ail","garde-manger"]],"s":"Facultatif : saumurer la poitrine 6 h au réfrigérateur dans 4 L d'eau avec 250 ml de gros sel et 125 ml de cassonade, puis rincer et éponger. Mélanger le beurre ramolli, le paprika fumé, la poudre d'ail et du poivre, et frotter toute la poitrine, aussi sous la peau. Préchauffer le fumoir à 275 °F avec du bois de pommier ou d'érable. Fumer environ 3 h, jusqu'à 160 °F dans la partie la plus épaisse. Laisser reposer 20 min sous un papier d'aluminium avant de trancher.","v":[],"tp":20},{"n":"Picanha fumée et saisie","e":"","k":"souper","pr":"","st":["fumoir","bbq"],"t":"viande","tm":150,"sf":"grelots","sv":"salade_grecque","m":["picanha","surlonge","boeuf"],"nw":true,"i":[[1500,"g","picanha (haut de surlonge avec gras)","viandes"],[1,"un","bouquet de persil","fruits et légumes"],[4,"un","gousses d'ail","fruits et légumes"],[60,"ml","vinaigre de vin rouge","épicerie"]],"s":"Quadriller le gras sans toucher la viande, saler généreusement. Fumer à 225 °F jusqu'à 120 °F à cœur (1 h 30), puis saisir 2 min par côté sur un grill très chaud (reverse sear). Trancher contre le grain. Servir avec un chimichurri (persil, ail, vinaigre, huile d'olive, flocons de piment).","v":[],"tp":15},{"n":"Cuisses de poulet fumées, sauce Alabama blanche","e":"","k":"souper","pr":"","st":["fumoir"],"t":"viande","tm":150,"sf":"frites_four","sv":"salade_chou","m":["cuisses de poulet","poulet"],"nw":true,"i":[[12,"un","hauts de cuisses de poulet avec os","viandes"],[60,"g","cassonade","garde-manger"],[30,"ml","paprika fumé","garde-manger"],[15,"ml","poudre d'ail","garde-manger"],[250,"ml","mayonnaise","épicerie"],[30,"ml","vinaigre de cidre","épicerie"],[15,"ml","raifort","épicerie"]],"s":"Éponger les cuisses. Mélanger la cassonade, le paprika fumé, la poudre d'ail, 10 ml de sel et du poivre, et frotter le poulet. Préchauffer le fumoir à 275 °F. Fumer 1 h 30 à 2 h, jusqu'à 175 °F près de l'os. Pour une peau croustillante, finir 5 min de chaque côté sur un BBQ très chaud. Sauce Alabama : mélanger la mayonnaise, le vinaigre, le raifort, 5 ml de poivre, une pincée de sel et un trait de jus de citron. Tremper les cuisses dans la sauce ou la servir à côté.","v":[],"tp":15},{"n":"Tacos au brisket","e":"","k":"souper","pr":"","st":["mex"],"t":"mex","tm":20,"sf":"","sv":"guacamole","m":["tortilla"],"nw":true,"i":[[700,"g","boeuf fumé (restes du brisket)","viandes"],[12,"un","tortillas","boulangerie"],[1,"un","oignon rouge","fruits et légumes"],[1,"un","bouquet de coriandre","fruits et légumes"],[2,"un","limes","fruits et légumes"],[250,"ml","salsa","épicerie"]],"s":"Réchauffer le brisket effiloché ou en dés dans une poêle avec un peu de sauce BBQ ou de bouillon. Garnir les tortillas chaudes de viande, d'oignon rouge, de coriandre, de salsa et d'un filet de lime.","v":[],"ur":["boeuf fume"]},{"n":"Mac and cheese au brisket","e":"","k":"souper","pr":"","st":["pates","four"],"t":"pates","tm":40,"sf":"","sv":"salade_verte","m":["macaroni","cheddar"],"nw":true,"i":[[450,"g","macaroni","épicerie"],[400,"g","boeuf fumé (restes du brisket)","viandes"],[300,"g","cheddar râpé","produits laitiers"],[750,"ml","lait","produits laitiers"],[45,"g","beurre","produits laitiers"],[45,"g","farine","garde-manger"],[60,"g","chapelure panko","épicerie"]],"s":"Préchauffer le four à 400 °F. Cuire les macaroni 2 min de moins que l'emballage et les égoutter. Couper le boeuf fumé en dés. Dans une grande casserole, fondre le beurre, ajouter la farine et cuire 1 min. Verser le lait peu à peu en fouettant et cuire 6 min, jusqu'à ce que la sauce épaississe. Hors du feu, ajouter le cheddar, saler et poivrer. Mélanger avec les pâtes et le boeuf, et verser dans un plat. Couvrir de panko et gratiner 15 min (ou 30 min au fumoir à 275 °F).","v":[],"ur":["boeuf fume"],"tp":25},{"n":"Poutine au porc effiloché","e":"","k":"souper","pr":"","st":["four"],"t":"complet","tm":30,"sf":"","sv":"","m":["frite","fromage en grains"],"nw":true,"i":[[700,"g","porc effiloché","viandes"],[1500,"g","frites surgelées","surgelés"],[450,"g","fromage en grains","produits laitiers"],[500,"ml","sauce brune","épicerie"]],"s":"Cuire les frites au four selon l'emballage, en les gardant bien croustillantes. Réchauffer le porc effiloché avec un peu de sauce BBQ. Porter la sauce brune à ébullition : elle doit être très chaude pour faire fondre le fromage. Monter les poutines : frites, fromage en grains, porc, puis napper de sauce bouillante.","v":[],"ur":["porc effiloche"]},{"n":"Sandwichs cubains","e":"","k":"souper","pr":"","st":["plancha","sandwich"],"t":"sandwich","tm":25,"sf":"chips","sv":"","m":["jambon","fromage suisse"],"nw":true,"i":[[600,"g","porc effiloché","viandes"],[300,"g","jambon tranché","viandes"],[12,"un","tranches de fromage suisse","produits laitiers"],[6,"un","cornichons à l'aneth","épicerie"],[60,"ml","moutarde jaune","épicerie"],[2,"un","baguettes","boulangerie"]],"s":"Couper les baguettes en 6 et les ouvrir. Garnir de moutarde, porc, jambon, fromage et cornichons tranchés. Presser à la plancha ou dans une poêle avec un poids, 3 min par côté, jusqu'à ce que le fromage fonde.","v":[],"ur":["porc effiloche"]},{"n":"Smash burgers classiques","e":"","k":"souper","pr":"","st":["plancha","sandwich"],"t":"sandwich","tm":25,"sf":"frites_maison","sv":"salade_chou","m":["boeuf hache","pain hamburger"],"nw":true,"i":[[1000,"g","boeuf haché","viandes"],[6,"un","pains à hamburger","boulangerie"],[12,"un","tranches de cheddar","produits laitiers"],[1,"un","oignon","fruits et légumes"],[6,"un","cornichons à l'aneth","épicerie"],[125,"ml","mayonnaise","épicerie"],[30,"ml","relish","épicerie"],[6,"un","feuilles de laitue","fruits et légumes"]],"s":"Former 12 boules de 80 g, garder au froid. Plancha très chaude (450-500 °F). Déposer une boule, l'écraser à plat avec une spatule et un carré de papier parchemin, saler et poivrer. 2 min sans y toucher, gratter et retourner, déposer le fromage, 30 s. Deux galettes par pain grillé, sauce (mayonnaise, relish, un peu de moutarde et de ketchup), oignon émincé, cornichons, laitue.","v":[["Oklahoma (oignons écrasés)","+2 un oignon|fruits et légumes","Déposer une poignée d'oignon tranché très mince sur chaque boule avant de l'écraser : il caramélise dans la viande."],["Bacon et cheddar fort","+300 g bacon|viandes","Cuire le bacon sur la plancha avant les galettes."],["Champignons et suisse","-12 un tranches de cheddar ; +12 un tranches de fromage suisse|produits laitiers ; +227 g champignons|fruits et légumes","Sauter les champignons sur la plancha."]]},{"n":"Philly cheesesteak","e":"","k":"souper","pr":"","st":["plancha","sandwich"],"t":"sandwich","tm":25,"sf":"chips","sv":"salade_chou","m":["boeuf","provolone"],"nw":true,"i":[[900,"g","boeuf en tranches minces (faux-filet)","viandes"],[2,"un","poivrons","fruits et légumes"],[2,"un","oignon","fruits et légumes"],[227,"g","champignons","fruits et légumes"],[12,"un","tranches de provolone","produits laitiers"],[6,"un","pains sous-marin","boulangerie"]],"s":"Congeler le boeuf 30 min pour le trancher très mince. Sur la plancha, sauter oignons, poivrons et champignons. Saisir le boeuf 2 min en le hachant à la spatule, mélanger aux légumes, couvrir de fromage et laisser fondre. Glisser dans les pains grillés.","v":[["Au poulet","-900 g boeuf en tranches minces (faux-filet) ; +900 g poitrines de poulet|viandes","Trancher le poulet en fines lanières."]]},{"n":"Fajitas au poulet à la plancha","e":"","k":"souper","pr":"","st":["plancha","mex"],"t":"mex","tm":30,"sf":"","sv":"guacamole","m":["poulet","poivron","tortilla"],"nw":true,"i":[[1000,"g","poitrines de poulet","viandes"],[3,"un","poivrons","fruits et légumes"],[2,"un","oignon","fruits et légumes"],[12,"un","tortillas","boulangerie"],[1,"un","sachet d'assaisonnement à fajitas","épicerie"],[250,"ml","crème sure","produits laitiers"],[250,"ml","salsa","épicerie"],[200,"g","fromage râpé","produits laitiers"]],"s":"Mariner le poulet en lanières 30 min avec l'assaisonnement et un filet d'huile. Plancha très chaude : saisir poivrons et oignons en lanières, puis le poulet 6 à 8 min. Servir sur la plancha avec tortillas chaudes, crème sure, salsa et fromage.","v":[["Au boeuf (bavette)","-1000 g poitrines de poulet ; +1000 g bavette de boeuf|viandes","Saisir la bavette entière 4 min par côté, trancher mince contre le grain."],["Aux crevettes","-1000 g poitrines de poulet ; +900 g crevettes crues décortiquées|poissonnerie","Les crevettes cuisent 2 min par côté."]]},{"n":"Crevettes à l'ail et lime à la plancha","e":"","k":"souper","pr":"","st":["plancha"],"t":"viande","tm":20,"sf":"riz_blanc","sv":"salade_verte","m":["crevette"],"nw":true,"i":[[900,"g","crevettes crues décortiquées","poissonnerie"],[4,"un","gousses d'ail","fruits et légumes"],[2,"un","limes","fruits et légumes"],[60,"g","beurre","produits laitiers"],[1,"un","bouquet de persil","fruits et légumes"]],"s":"Hacher l'ail, râper le zeste des limes et hacher le persil. Éponger les crevettes et les mélanger avec l'ail, le zeste, un filet d'huile et une pincée de sel. Chauffer la plancha à feu vif. Étaler les crevettes en une seule couche et cuire 2 min par côté, jusqu'à ce qu'elles soient roses. Ajouter le beurre en morceaux, arroser du jus des limes et parsemer de persil. Servir aussitôt.","v":[["Cajun","+15 ml assaisonnement cajun|garde-manger",""]]},{"n":"Tacos al pastor à la plancha","e":"","k":"souper","pr":"","st":["plancha","mex"],"t":"mex","tm":40,"sf":"","sv":"salade_mexicaine","m":["porc","tortilla","ananas"],"nw":true,"i":[[1000,"g","côtelettes de porc désossées","viandes"],[1,"un","boîte d'ananas en rondelles","épicerie"],[30,"ml","poudre de chili","garde-manger"],[18,"un","petites tortillas","boulangerie"],[1,"un","oignon","fruits et légumes"],[1,"un","bouquet de coriandre","fruits et légumes"],[3,"un","limes","fruits et légumes"]],"s":"Trancher le porc très mince et le mariner 2 h (ou la veille) avec la poudre de chili, l'ail, le jus de l'ananas et un peu de vinaigre. Plancha très chaude : saisir le porc par petites quantités jusqu'à ce qu'il caramélise, griller les rondelles d'ananas. Hacher ensemble et servir dans les tortillas avec oignon, coriandre et lime.","v":[],"tp":30},{"n":"Poulet teriyaki à la plancha","e":"","k":"souper","pr":"","st":["plancha","asia"],"t":"riz","tm":30,"sf":"riz_blanc","sv":"legumes_sautes","m":["poulet","teriyaki"],"nw":true,"i":[[1000,"g","hauts de cuisses de poulet désossés","viandes"],[250,"ml","sauce teriyaki","épicerie"],[4,"un","oignons verts","fruits et légumes"],[15,"ml","graines de sésame","garde-manger"]],"s":"Mariner le poulet 30 min dans la moitié de la sauce. Plancha moyenne-vive : 5 à 6 min par côté. Badigeonner du reste de sauce la dernière minute. Trancher, garnir d'oignons verts et de sésame.","v":[]},{"n":"Pétoncles poêlés à la plancha","e":"","k":"souper","pr":"","st":["plancha"],"t":"viande","tm":20,"sf":"riz_blanc","sv":"salade_verte","m":["petoncle"],"nw":true,"i":[[700,"g","pétoncles","poissonnerie"],[60,"g","beurre","produits laitiers"],[1,"un","citrons","fruits et légumes"],[2,"un","gousses d'ail","fruits et légumes"]],"s":"Retirer le petit muscle sur le côté des pétoncles et les éponger soigneusement avec du papier absorbant : c'est ce qui donne la belle croûte. Hacher l'ail et le faire fondre dans le beurre au micro-ondes. Chauffer la plancha à feu très vif et l'huiler. Saler les pétoncles et les déposer sans qu'ils se touchent. Cuire 1 min 30 sans les bouger, retourner et cuire 1 min. Arroser de beurre à l'ail et de jus de citron, et servir aussitôt.","v":[]},{"n":"Michigans maison","e":"","k":"souper","pr":"","st":["plancha","sandwich"],"t":"sandwich","tm":40,"sf":"frites_four","sv":"salade_chou","m":["saucisse","hot-dog","boeuf hache"],"nw":true,"i":[[12,"un","saucisses à hot-dog","viandes"],[12,"un","pains à hot-dog","boulangerie"],[500,"g","boeuf haché","viandes"],[398,"ml","sauce tomate","épicerie"],[1,"un","oignon","fruits et légumes"],[15,"ml","poudre de chili","garde-manger"]],"s":"Hacher finement l'oignon et en garder le tiers cru pour la garniture. Dans une casserole, dorer le boeuf avec le reste de l'oignon en le défaisant finement à la cuillère. Ajouter la poudre de chili et cuire 1 min. Ajouter la sauce tomate, une pincée de cassonade, du sel et du poivre, et mijoter 20 min à feu doux, jusqu'à ce que la sauce soit épaisse. Chauffer la plancha à feu moyen et griller les saucisses 6 à 8 min en les roulant. Griller les pains ouverts 1 min. Garnir les hot-dogs de sauce et d'oignon cru haché.","v":[],"tp":25},{"n":"Quesadillas au steak à la plancha","e":"","k":"souper","pr":"","st":["plancha","mex"],"t":"mex","tm":25,"sf":"","sv":"salade_mexicaine","m":["bavette","tortilla"],"nw":true,"i":[[700,"g","bavette de boeuf","viandes"],[12,"un","tortillas","boulangerie"],[320,"g","fromage râpé","produits laitiers"],[2,"un","poivrons","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[250,"ml","crème sure","produits laitiers"]],"s":"Saler et poivrer la bavette. Chauffer la plancha à feu vif et saisir la viande 4 min par côté, puis la laisser reposer 5 min et la trancher mince à contre-fil. Émincer les poivrons et l'oignon, et les sauter sur la plancha avec un filet d'huile 5 min. Baisser à feu moyen. Garnir la moitié de chaque tortilla de fromage, de steak et de légumes, puis plier. Dorer 2 min par côté sur la plancha, jusqu'à ce que le fromage fonde. Couper en pointes et servir avec la crème sure.","v":[]},{"n":"Contre-filet grillé, beurre à l'ail","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":30,"sf":"patates_four","sv":"salade_cesar","m":["contre-filet","steak","boeuf"],"nw":true,"i":[[1800,"g","contre-filet (steaks de 1 po)","viandes"],[60,"g","beurre","produits laitiers"],[3,"un","gousses d'ail","fruits et légumes"],[1,"un","bouquet de persil","fruits et légumes"]],"s":"Sortir les steaks 30 min avant, saler et poivrer. Grill très chaud : 4 à 5 min par côté pour mi-saignant (130 °F à cœur), en tournant d'un quart pour le quadrillé. Reposer 5 min et garnir de beurre à l'ail et persil.","v":[["Épices à steak de Montréal","+30 ml épices à steak|garde-manger","Frotter les steaks d'épices au lieu du sel et poivre."],["Reverse sear (au fumoir ou côté indirect)","","Cuire à 225 °F côté indirect jusqu'à 115 °F, puis saisir 1 min par côté à feu d'enfer."],["Sauce au poivre","+250 ml crème 35 %|produits laitiers ; +30 ml poivre concassé|garde-manger","Réduire la crème avec le poivre et un trait de cognac dans une poêle sur le BBQ."]]},{"n":"Côte de boeuf sur le BBQ","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":75,"sf":"grelots","sv":"salade_verte","m":["cote de boeuf","boeuf"],"nw":true,"i":[[2000,"g","côte de boeuf avec os","viandes"],[60,"g","beurre","produits laitiers"],[3,"un","gousses d'ail","fruits et légumes"]],"s":"Saler la veille et laisser à découvert au frigo. Cuisson indirecte à 250 °F jusqu'à 120 °F à cœur (45 à 60 min), puis saisir 2 min par côté à feu très vif. Reposer 10 min, trancher le long de l'os.","v":[["Tomahawk","","Même méthode : comptez 10 min de plus pour une pièce de 1,2 kg."]],"tp":15},{"n":"Picanha en brochettes à la brésilienne","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":40,"sf":"riz_blanc","sv":"salade_grecque","m":["picanha","boeuf"],"nw":true,"i":[[1500,"g","picanha (haut de surlonge avec gras)","viandes"],[1,"un","bouquet de persil","fruits et légumes"],[4,"un","gousses d'ail","fruits et légumes"],[60,"ml","vinaigre de vin rouge","épicerie"]],"s":"Couper la picanha en tranches de 4 cm, les plier en C avec le gras à l'extérieur et les embrocher. Gros sel seulement. Grill vif, 3 à 4 min par côté. Servir avec un chimichurri (persil, ail, vinaigre, huile d'olive, origan, flocons de piment).","v":[],"tp":20},{"n":"Bavette au chimichurri","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":30,"sf":"frites_four","sv":"salade_verte","m":["bavette","boeuf"],"nw":true,"i":[[1200,"g","bavette de boeuf","viandes"],[1,"un","bouquet de persil","fruits et légumes"],[4,"un","gousses d'ail","fruits et légumes"],[60,"ml","vinaigre de vin rouge","épicerie"],[5,"ml","flocons de piment","garde-manger"]],"s":"Chimichurri : persil haché fin, ail, vinaigre, 125 ml d'huile d'olive, origan, flocons de piment, sel. Mariner la bavette 1 h dans le tiers du chimichurri. Grill très chaud, 4 min par côté. Reposer 5 min, trancher mince contre le grain, napper du reste.","v":[]},{"n":"Filet de porc grillé à l'érable et Dijon","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":35,"sf":"grelots","sv":"haricots_verts","m":["filet de porc","porc"],"nw":true,"i":[[1000,"g","filets de porc","viandes"],[60,"ml","sirop d'érable","épicerie"],[30,"ml","moutarde de Dijon","épicerie"],[2,"un","gousses d'ail","fruits et légumes"]],"s":"Retirer la membrane argentée des filets, saler et poivrer. Hacher l'ail et le mélanger avec le sirop d'érable et la moutarde. Préparer le BBQ pour une cuisson directe d'un côté et indirecte de l'autre, à feu moyen-vif. Saisir les filets sur toutes les faces 6 min au-dessus du feu. Les déplacer du côté éteint, badigeonner de sauce et fermer le couvercle. Cuire 15 à 20 min en badigeonnant deux fois, jusqu'à 145 °F au centre. Laisser reposer 5 min avant de trancher.","v":[],"tp":15},{"n":"Poulet en crapaudine sur le BBQ","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":70,"sf":"grelots","sv":"salade_cesar","m":["poulet entier","poulet"],"nw":true,"i":[[2,"un","poulets entiers","viandes"],[2,"un","citrons","fruits et légumes"],[4,"un","gousses d'ail","fruits et légumes"],[15,"ml","paprika fumé","garde-manger"]],"s":"Retirer la colonne au ciseau et aplatir les poulets. Frotter d'huile, d'ail, de zeste de citron, de paprika, sel et poivre. Cuisson indirecte à 375 °F, peau vers le haut, 45 à 55 min jusqu'à 165 °F dans la poitrine; finir 3 min peau en bas à feu direct.","v":[["Piri-piri","+15 ml flocons de piment|garde-manger",""]],"rs":{"lbl":"poulet cuit","w":["poulet cuit"],"x":[[1,"un","poulets entiers","viandes"]]},"tp":15},{"n":"Brochettes de boeuf et légumes","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":40,"sf":"riz_blanc","sv":"salade_grecque","m":["surlonge","boeuf"],"nw":true,"i":[[1200,"g","haut de surlonge en cubes","viandes"],[2,"un","poivrons","fruits et légumes"],[1,"un","oignon rouge","fruits et légumes"],[227,"g","champignons","fruits et légumes"],[250,"ml","vinaigrette italienne","épicerie"]],"s":"Mariner les cubes de boeuf dans la vinaigrette italienne au moins 2 h, ou toute la journée, au réfrigérateur. Si les brochettes sont en bois, les tremper 30 min dans l'eau. Couper les poivrons et l'oignon rouge en carrés de 3 cm. Enfiler en alternant boeuf, poivrons, oignon et champignons. Chauffer le BBQ à feu moyen-vif et griller 10 à 12 min en tournant aux 3 min, pour une cuisson mi-saignante à point. Laisser reposer 3 min.","v":[],"tp":25},{"n":"Saumon sur planche de cèdre","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":40,"sf":"riz_blanc","sv":"salade_concombre","m":["saumon"],"nw":true,"i":[[1000,"g","filet de saumon (côté entier)","poissonnerie"],[60,"ml","sirop d'érable","épicerie"],[30,"ml","moutarde de Dijon","épicerie"],[2,"un","planches de cèdre","épicerie"]],"s":"Faire tremper les planches dans l'eau au moins 1 h, avec un poids pour qu'elles restent immergées. Préchauffer le BBQ à 375 °F, avec un côté éteint pour la chaleur indirecte. Mélanger le sirop d'érable et la moutarde. Déposer le saumon sur les planches, peau vers le bas, saler, poivrer et badigeonner du mélange. Déposer les planches du côté éteint et fermer le couvercle. Cuire 20 à 25 min, jusqu'à ce que la chair se défasse à la fourchette (135 à 140 °F). Servir directement sur la planche.","v":[],"tp":15},{"n":"Côtelettes d'agneau à la grecque","e":"","k":"souper","pr":"","st":["bbq"],"t":"viande","tm":30,"sf":"grelots","sv":"salade_grecque","m":["agneau"],"nw":true,"i":[[1200,"g","côtelettes d'agneau","viandes"],[1,"un","citrons","fruits et légumes"],[3,"un","gousses d'ail","fruits et légumes"],[15,"ml","origan séché","garde-manger"]],"s":"Hacher l'ail et le mélanger avec le jus du citron, l'origan, 45 ml d'huile d'olive, du sel et du poivre. Badigeonner les côtelettes et mariner 1 h au réfrigérateur. Les sortir 15 min avant la cuisson. Chauffer le BBQ à feu très vif. Griller les côtelettes 3 min par côté pour une cuisson rosée (135 °F). Laisser reposer 3 min avant de servir.","v":[]},{"n":"Pizza sur le BBQ","e":"","k":"souper","pr":"","st":["bbq","four"],"t":"complet","tm":30,"sf":"","sv":"salade_cesar","m":["pizza","pepperoni"],"nw":true,"i":[[2,"un","pâtes à pizza","boulangerie"],[250,"ml","sauce à pizza","épicerie"],[320,"g","mozzarella râpée","produits laitiers"],[150,"g","pepperoni","viandes"],[1,"un","poivrons","fruits et légumes"]],"s":"Préchauffer le BBQ à 500 °F avec une pierre à pizza à l'intérieur pendant 15 min. Laisser les pâtes reposer 15 min à la température ambiante. Étirer chaque pâte sur un papier parchemin fariné. Garnir de sauce, de mozzarella, de pepperoni et de poivron émincé. Glisser la pizza sur la pierre et cuire couvert 6 à 8 min, jusqu'à ce que la croûte soit dorée. Sans pierre : griller la pâte nature 2 min directement sur la grille huilée, la retourner, garnir le côté grillé et cuire couvert 5 min à feu moyen.","v":[["Toute garnie","+227 g champignons|fruits et légumes ; +1 un oignon|fruits et légumes",""]]},{"n":"Jalapeños poppers au bacon","e":"","k":"entree","pr":"","st":["fumoir","bouchee"],"t":"viande","tm":90,"sf":"","sv":"","m":["jalapeno","bacon"],"nw":true,"i":[[12,"un","piments jalapeños","fruits et légumes"],[250,"g","fromage à la crème","produits laitiers"],[100,"g","cheddar râpé","produits laitiers"],[375,"g","bacon","viandes"]],"s":"Couper les jalapeños en deux, épépiner. Farcir du mélange fromage à la crème et cheddar, enrober d'une demi-tranche de bacon. Fumer à 250 °F, 1 h 30 (ou BBQ indirect à 375 °F, 25 min) jusqu'à ce que le bacon soit croustillant.","v":[]},{"n":"Crevettes enrobées de bacon","e":"","k":"entree","pr":"","st":["bbq","bouchee"],"t":"viande","tm":25,"sf":"","sv":"","m":["crevette","bacon"],"nw":true,"i":[[450,"g","crevettes crues décortiquées","poissonnerie"],[375,"g","bacon","viandes"],[125,"ml","sauce BBQ","épicerie"]],"s":"Si les brochettes sont en bois, les tremper 30 min dans l'eau. Couper les tranches de bacon en trois. Enrouler chaque crevette dans un morceau de bacon et la piquer d'un cure-dent ou l'enfiler sur une brochette. Chauffer le BBQ à feu moyen. Griller 8 à 10 min en tournant, jusqu'à ce que le bacon soit croustillant et les crevettes roses. Badigeonner de sauce BBQ la dernière minute.","v":[]},{"n":"Ananas grillé à la cassonade","e":"","k":"dessert","pr":"","st":["fruit","bbq"],"t":"viande","tm":15,"sf":"","sv":"","m":["ananas"],"nw":true,"i":[[1,"un","ananas","fruits et légumes"],[60,"g","cassonade","garde-manger"],[30,"g","beurre","produits laitiers"],[1,"un","crème glacée à la vanille","surgelés"]],"s":"Peler l'ananas et le couper en tranches épaisses. Badigeonner de beurre fondu et de cassonade. Grill vif, 3 min par côté. Servir chaud avec la crème glacée.","v":[],"sp":1},{"n":"S'mores au BBQ","e":"","k":"dessert","pr":"","st":["biscuit","bbq"],"t":"viande","tm":10,"sf":"","sv":"","m":["guimauve","chocolat"],"nw":true,"i":[[1,"un","biscuits Graham","épicerie"],[200,"g","chocolat au lait","garde-manger"],[250,"g","guimauves","épicerie"]],"s":"Dans un plat d'alu, étendre des carrés de chocolat sur des demi-biscuits, couvrir de guimauves. BBQ couvert à feu moyen 5 min. Fermer avec l'autre moitié du biscuit.","v":[]},{"n":"Pêches grillées, miel et yogourt","e":"","k":"dessert","pr":"","st":["fruit","bbq"],"t":"viande","tm":15,"sf":"","sv":"","m":["peche"],"nw":true,"i":[[6,"un","pêches","fruits et légumes"],[60,"ml","miel","épicerie"],[500,"ml","yogourt grec","produits laitiers"]],"s":"Chauffer le BBQ à feu moyen et bien nettoyer la grille. Couper les pêches en deux et retirer le noyau. Badigeonner le côté coupé d'un peu d'huile. Griller 3 min côté coupé, jusqu'à ce qu'elles soient marquées, puis retourner 2 min. Servir avec le yogourt et un filet de miel.","v":[],"sp":1},{"n":"Chimichurri","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["persil"],"nw":true,"i":[[1,"un","bouquet de persil","fruits et légumes"],[4,"un","gousses d'ail","fruits et légumes"],[60,"ml","vinaigre de vin rouge","épicerie"],[5,"ml","origan séché","garde-manger"],[5,"ml","flocons de piment","garde-manger"]],"s":"Hacher finement le persil et l'ail. Mélanger avec le vinaigre, 125 ml d'huile d'olive, l'origan, les flocons de piment et du sel. Laisser reposer 20 min. Pour les steaks, la picanha, le poulet grillé.","v":[]},{"n":"Beurre à l'ail et fines herbes","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["beurre"],"nw":true,"i":[[225,"g","beurre","produits laitiers"],[4,"un","gousses d'ail","fruits et légumes"],[1,"un","bouquet de persil","fruits et légumes"]],"s":"Ramollir le beurre, ajouter l'ail râpé, le persil haché, sel et poivre. Rouler en boudin dans une pellicule et refroidir. Une rondelle sur un steak chaud, du maïs ou du pain.","v":[]},{"n":"Sauce à burger maison","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["mayonnaise"],"nw":true,"i":[[250,"ml","mayonnaise","épicerie"],[60,"ml","relish","épicerie"],[15,"ml","moutarde jaune","épicerie"],[5,"ml","paprika fumé","garde-manger"]],"s":"Mélanger la mayonnaise, la relish, la moutarde, un trait de vinaigre, le paprika et une pincée de poudre d'ail. Se garde une semaine au frigo. Pour les smash burgers et les frites.","v":[]},{"n":"Épices à frotter BBQ maison","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["paprika"],"nw":true,"i":[[100,"g","cassonade","garde-manger"],[60,"ml","paprika fumé","garde-manger"],[15,"ml","poudre d'ail","garde-manger"],[15,"ml","poudre d'oignon","garde-manger"]],"s":"Mélanger la cassonade, le paprika fumé, la poudre d'ail et d'oignon, 30 ml de gros sel et 15 ml de poivre. Se garde 6 mois dans un pot. Pour les côtes levées, le porc effiloché, le poulet et les ailes.","v":[]},{"n":"Déjeuner à la plancha","e":"","k":"dejeuner","pr":"","st":["plancha"],"t":"","tm":30,"sf":"","sv":"","m":["oeufs","bacon"],"nw":true,"i":[[12,"un","oeufs","produits laitiers"],[375,"g","bacon","viandes"],[1000,"g","pommes de terre rissolées surgelées","surgelés"],[12,"un","tranches de pain","boulangerie"]],"s":"Chauffer la plancha à feu moyen. Étaler les patates rissolées d'un côté avec un filet d'huile et les cuire 15 à 20 min en les retournant, jusqu'à ce qu'elles soient dorées. De l'autre côté, cuire le bacon 8 à 10 min en le retournant. Pousser le bacon sur le bord et casser les oeufs dans le gras du bacon. Cuire 3 min au miroir, ou les retourner 1 min de plus. Griller le pain directement sur la plancha 1 min par côté.","v":[["Avec crêpes","+250 g farine|garde-manger ; +500 ml lait|produits laitiers ; +125 ml sirop d'érable|épicerie","Faire de petites crêpes épaisses sur la plancha pendant que le bacon cuit."]]},{"n":"Gâteau au fromage New York","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":480,"sf":"","sv":"","m":["fromage a la creme","creme sure"],"nw":true,"i":[[250,"g","biscuits Graham émiettés","épicerie"],[90,"g","beurre","produits laitiers"],[1000,"g","fromage à la crème","produits laitiers"],[250,"g","sucre","garde-manger"],[4,"un","oeufs","produits laitiers"],[250,"ml","crème sure","produits laitiers"],[10,"ml","vanille","garde-manger"],[1,"un","citrons","fruits et légumes"]],"s":"Croûte : biscuits émiettés et beurre fondu pressés dans un moule à charnière, 10 min à 350 °F. Battre le fromage à la crème et le sucre sans trop incorporer d'air, ajouter les oeufs un à un, la crème sure, la vanille et le zeste de citron. Cuire au bain-marie 1 h 15 à 325 °F, éteindre et laisser 1 h dans le four entrouvert. Réfrigérer au moins 6 h.","v":[["Coulis de petits fruits","+500 g petits fruits|surgelés","Mijoter les fruits avec 60 ml de sucre 10 min et napper."],["Caramel salé","+250 ml sauce au caramel|épicerie","Napper de caramel et d'une pincée de fleur de sel."]]},{"n":"Gâteau au fromage Oreo sans cuisson","e":"","k":"dessert","pr":"","st":["gateau","froid"],"t":"","tm":30,"sf":"","sv":"","m":["oreo","fromage a la creme"],"nw":true,"i":[[2,"un","biscuits Oreo","épicerie"],[60,"g","beurre","produits laitiers"],[500,"g","fromage à la crème","produits laitiers"],[125,"g","sucre à glacer","garde-manger"],[500,"ml","crème 35 %","produits laitiers"],[5,"ml","vanille","garde-manger"]],"s":"Broyer 24 biscuits avec le beurre fondu et presser dans un moule. Battre le fromage à la crème, le sucre à glacer et la vanille. Fouetter la crème en pics fermes et l'incorporer. Ajouter 12 biscuits concassés. Verser sur la croûte, réfrigérer 6 h ou toute la nuit.","v":[]},{"n":"Fondants au chocolat (coeur coulant)","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":30,"sf":"","sv":"","m":["chocolat"],"nw":true,"i":[[200,"g","chocolat mi-sucré","garde-manger"],[125,"g","beurre","produits laitiers"],[4,"un","oeufs","produits laitiers"],[100,"g","sucre","garde-manger"],[40,"g","farine","garde-manger"],[1,"un","crème glacée à la vanille","surgelés"]],"s":"Fondre le chocolat et le beurre. Fouetter les oeufs et le sucre, ajouter le chocolat puis la farine. Verser dans 6 ramequins beurrés et cacaotés (se prépare le matin, au frigo). Cuire 10 à 12 min à 425 °F : le centre doit trembler. Démouler et servir aussitôt avec la crème glacée.","v":[["Coeur au caramel","+125 ml sauce au caramel|épicerie","Déposer une cuillerée de caramel au centre de chaque ramequin avant la cuisson."]]},{"n":"Brownies au caramel salé","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":45,"sf":"","sv":"","m":["chocolat","caramel"],"nw":true,"i":[[225,"g","beurre","produits laitiers"],[300,"g","sucre","garde-manger"],[100,"g","cassonade","garde-manger"],[4,"un","oeufs","produits laitiers"],[80,"g","cacao","garde-manger"],[125,"g","farine","garde-manger"],[150,"g","chocolat mi-sucré","garde-manger"],[250,"ml","sauce au caramel","épicerie"]],"s":"Fondre le beurre, ajouter les sucres, les oeufs, le cacao, la farine et le chocolat haché. Verser dans un moule de 9 x 13 po, marbrer de caramel et parsemer de fleur de sel. Cuire 25 min à 350 °F : le centre doit rester fondant. Refroidir avant de couper.","v":[]},{"n":"Gâteau Reine-Élisabeth","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":60,"sf":"","sv":"","m":["dattes","noix de coco"],"nw":true,"i":[[250,"g","dattes","épicerie"],[175,"g","beurre","produits laitiers"],[200,"g","sucre","garde-manger"],[1,"un","oeufs","produits laitiers"],[200,"g","farine","garde-manger"],[150,"g","cassonade","garde-manger"],[125,"ml","crème 35 %","produits laitiers"],[100,"g","noix de coco râpée","garde-manger"]],"s":"Tremper les dattes hachées 15 min dans 250 ml d'eau bouillante avec 5 ml de bicarbonate. Crémer 60 g de beurre et le sucre, ajouter l'oeuf, la farine, 5 ml de poudre à pâte et les dattes. Cuire 35 min à 350 °F. Garniture : bouillir 3 min le reste du beurre, la cassonade, la crème et la noix de coco, étendre sur le gâteau et griller 2 min sous le gril.","v":[]},{"n":"Tiramisu","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":30,"sf":"","sv":"","m":["mascarpone"],"nw":true,"i":[[475,"g","mascarpone","produits laitiers"],[4,"un","oeufs","produits laitiers"],[100,"g","sucre","garde-manger"],[1,"un","doigts de dame (biscuits)","épicerie"],[375,"ml","café fort","épicerie"],[30,"g","cacao","garde-manger"]],"s":"Fouetter les jaunes et le sucre jusqu'à blanchiment, ajouter le mascarpone. Monter les blancs en neige et les incorporer. Tremper rapidement les doigts de dame dans le café refroidi, alterner biscuits et crème dans un plat. Réfrigérer 6 h, saupoudrer de cacao au service.","v":[["Sans oeufs crus","-4 un oeufs ; +250 ml crème 35 %|produits laitiers","Remplacer les oeufs par la crème fouettée."],["Aux fraises (fraisamisu)","-375 ml café fort ; +500 g fraises|fruits et légumes","Tremper les biscuits dans un sirop de fraises et garnir de fraises tranchées."]]},{"n":"Crème brûlée à la vanille","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":60,"sf":"","sv":"","m":["creme"],"nw":true,"i":[[750,"ml","crème 35 %","produits laitiers"],[6,"un","oeufs","produits laitiers"],[125,"g","sucre","garde-manger"],[10,"ml","vanille","garde-manger"]],"s":"Chauffer la crème avec la vanille. Fouetter les 6 jaunes et 100 g de sucre, verser la crème chaude en fouettant. Répartir dans 6 ramequins, cuire au bain-marie 40 min à 300 °F. Réfrigérer 4 h. Saupoudrer du reste de sucre et caraméliser au chalumeau (ou sous le gril, 2 min).","v":[["À l'érable","-125 g sucre ; +125 ml sirop d'érable|épicerie","Sucrer au sirop d'érable, caraméliser avec de la cassonade."]]},{"n":"Pouding au pain, sauce caramel et bourbon","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":70,"sf":"","sv":"","m":["pain","creme"],"nw":true,"i":[[1,"un","pain brioché","boulangerie"],[750,"ml","lait","produits laitiers"],[250,"ml","crème 35 %","produits laitiers"],[4,"un","oeufs","produits laitiers"],[150,"g","cassonade","garde-manger"],[100,"g","beurre","produits laitiers"],[60,"ml","bourbon ou rhum (facultatif)","épicerie"]],"s":"Couper le pain en cubes dans un plat beurré. Fouetter lait, crème, oeufs, 100 g de cassonade, cannelle et vanille, verser sur le pain, reposer 20 min. Cuire 45 min à 350 °F. Sauce : fondre le beurre et le reste de cassonade, ajouter un peu de crème et le bourbon, bouillir 2 min.","v":[["Aux pépites de chocolat","+150 g pépites de chocolat|garde-manger",""]]},{"n":"Tarte au citron meringuée","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":90,"sf":"","sv":"","m":["citron"],"nw":true,"i":[[1,"un","abaisses de pâte à tarte","surgelés"],[4,"un","citrons","fruits et légumes"],[250,"g","sucre","garde-manger"],[4,"un","oeufs","produits laitiers"],[45,"g","fécule de maïs","garde-manger"],[45,"g","beurre","produits laitiers"]],"s":"Cuire l'abaisse à blanc. Crème : cuire 375 ml d'eau, le jus et le zeste des citrons, 150 g de sucre et la fécule jusqu'à épaississement, ajouter les jaunes et le beurre. Verser dans la croûte. Meringue : monter les blancs avec le reste du sucre, étaler et dorer 10 min à 375 °F. Refroidir 3 h.","v":[]},{"n":"Tarte aux pacanes et à l'érable","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":75,"sf":"","sv":"","m":["pacanes","erable"],"nw":true,"i":[[1,"un","abaisses de pâte à tarte","surgelés"],[200,"g","pacanes","épicerie"],[250,"ml","sirop d'érable","épicerie"],[100,"g","cassonade","garde-manger"],[3,"un","oeufs","produits laitiers"],[60,"g","beurre","produits laitiers"]],"s":"Fouetter le sirop, la cassonade, les oeufs et le beurre fondu. Étaler les pacanes dans l'abaisse, verser la garniture. Cuire 45 min à 350 °F jusqu'à ce que le centre soit presque pris. Servir tiède avec de la crème fouettée.","v":[]},{"n":"Gâteau forêt-noire","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":90,"sf":"","sv":"","m":["cerises","chocolat"],"nw":true,"i":[[1,"un","mélange à gâteau au chocolat","épicerie"],[500,"ml","crème 35 %","produits laitiers"],[1,"un","pots de cerises griottes","épicerie"],[100,"g","chocolat mi-sucré","garde-manger"],[60,"g","sucre à glacer","garde-manger"]],"s":"Cuire le gâteau en deux ronds, refroidir et couper chacun en deux. Imbiber du jus des cerises. Fouetter la crème avec le sucre à glacer. Monter : gâteau, crème, cerises, et ainsi de suite. Couvrir de crème et de copeaux de chocolat. Réfrigérer 2 h.","v":[]},{"n":"Pots de crème au chocolat","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":20,"sf":"","sv":"","m":["chocolat","creme"],"nw":true,"i":[[250,"g","chocolat mi-sucré","garde-manger"],[500,"ml","crème 35 %","produits laitiers"],[125,"ml","lait","produits laitiers"],[4,"un","oeufs","produits laitiers"],[50,"g","sucre","garde-manger"]],"s":"Chauffer la crème et le lait. Fouetter les jaunes et le sucre, verser le liquide chaud, cuire à feu doux jusqu'à ce que ça nappe la cuillère. Verser sur le chocolat haché, lisser. Répartir dans 6 pots, réfrigérer 4 h.","v":[]},{"n":"Churros, sauce au chocolat","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":40,"sf":"","sv":"","m":["chocolat"],"nw":true,"i":[[150,"g","farine","garde-manger"],[60,"g","beurre","produits laitiers"],[2,"un","oeufs","produits laitiers"],[100,"g","sucre","garde-manger"],[10,"ml","cannelle","garde-manger"],[150,"g","chocolat mi-sucré","garde-manger"],[125,"ml","crème 35 %","produits laitiers"],[1000,"ml","huile végétale","garde-manger"]],"s":"Bouillir 250 ml d'eau et le beurre, ajouter la farine d'un coup et remuer jusqu'à former une boule. Hors du feu, ajouter les oeufs. Pocher des bâtonnets dans l'huile à 375 °F, 2 min, rouler dans le sucre à la cannelle. Sauce : verser la crème chaude sur le chocolat.","v":[]},{"n":"Biscuits géants farcis au Nutella","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":35,"sf":"","sv":"","m":["chocolat","nutella"],"nw":true,"i":[[225,"g","beurre","produits laitiers"],[200,"g","cassonade","garde-manger"],[100,"g","sucre","garde-manger"],[2,"un","oeufs","produits laitiers"],[375,"g","farine","garde-manger"],[300,"g","pépites de chocolat","garde-manger"],[250,"ml","tartinade chocolat-noisette","épicerie"]],"s":"Congeler 12 cuillerées de tartinade 1 h. Crémer beurre et sucres, ajouter les oeufs, la farine, 5 ml de bicarbonate et les pépites. Envelopper chaque boule de tartinade de pâte (gros biscuits de 100 g). Cuire 12 min à 350 °F : les bords dorés, le centre mou.","v":[]},{"n":"Blondies chocolat blanc et framboises","e":"","k":"dessert","pr":"","st":["biscuit"],"t":"","tm":45,"sf":"","sv":"","m":["chocolat blanc","framboises"],"nw":true,"i":[[175,"g","beurre","produits laitiers"],[250,"g","cassonade","garde-manger"],[2,"un","oeufs","produits laitiers"],[250,"g","farine","garde-manger"],[175,"g","chocolat blanc","garde-manger"],[250,"g","framboises","surgelés"]],"s":"Fondre le beurre, ajouter la cassonade, les oeufs, la vanille, la farine, le chocolat haché. Étaler dans un moule de 9 x 9 po, enfoncer les framboises. Cuire 30 min à 350 °F.","v":[]},{"n":"Pavlova aux petits fruits","e":"","k":"dessert","pr":"","st":["froid","fruit"],"t":"","tm":120,"sf":"","sv":"","m":["petits fruits"],"nw":true,"i":[[4,"un","oeufs","produits laitiers"],[250,"g","sucre","garde-manger"],[10,"ml","fécule de maïs","garde-manger"],[375,"ml","crème 35 %","produits laitiers"],[500,"g","petits fruits","surgelés"]],"s":"Monter les 4 blancs en neige ferme en ajoutant le sucre peu à peu, puis la fécule et un trait de vinaigre. Former un nid sur une plaque, cuire 1 h 15 à 250 °F et laisser refroidir dans le four. Garnir de crème fouettée et de petits fruits au moment de servir.","v":[]},{"n":"Pouding au caramel collant (sticky toffee)","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":60,"sf":"","sv":"","m":["dattes","caramel"],"nw":true,"i":[[250,"g","dattes","épicerie"],[175,"g","farine","garde-manger"],[175,"g","cassonade","garde-manger"],[175,"g","beurre","produits laitiers"],[2,"un","oeufs","produits laitiers"],[250,"ml","crème 35 %","produits laitiers"]],"s":"Tremper les dattes hachées dans 250 ml d'eau bouillante avec 5 ml de bicarbonate. Crémer 60 g de beurre et 75 g de cassonade, ajouter les oeufs, la farine, la poudre à pâte et les dattes. Cuire 35 min à 350 °F. Sauce : bouillir le reste du beurre, de la cassonade et la crème 3 min. Napper le gâteau chaud.","v":[]},{"n":"Tarte banoffee","e":"","k":"dessert","pr":"","st":["froid"],"t":"","tm":40,"sf":"","sv":"","m":["banane","caramel"],"nw":true,"i":[[250,"g","biscuits Graham émiettés","épicerie"],[100,"g","beurre","produits laitiers"],[1,"un","boîtes de lait concentré sucré","épicerie"],[4,"un","bananes","fruits et légumes"],[375,"ml","crème 35 %","produits laitiers"],[30,"g","chocolat mi-sucré","garde-manger"]],"s":"Croûte : biscuits et beurre fondu, réfrigérer. Dulce de leche : cuire le lait concentré dans un plat couvert au bain-marie, 1 h à 425 °F (ou acheter un caramel épais). Étaler le caramel, couvrir de bananes tranchées et de crème fouettée, râper le chocolat.","v":[]},{"n":"Carrés Nanaimo","e":"","k":"dessert","pr":"","st":["biscuit","froid"],"t":"","tm":45,"sf":"","sv":"","m":["chocolat","graham"],"nw":true,"i":[[200,"g","biscuits Graham émiettés","épicerie"],[100,"g","noix de coco râpée","garde-manger"],[30,"g","cacao","garde-manger"],[225,"g","beurre","produits laitiers"],[300,"g","sucre à glacer","garde-manger"],[30,"ml","poudre pour crème anglaise (Bird’s)","garde-manger"],[150,"g","chocolat mi-sucré","garde-manger"]],"s":"Base : biscuits, coco, cacao, 125 g de beurre fondu et 50 g de sucre, presser dans un moule de 8 x 8 po. Garniture : battre 60 g de beurre, le sucre à glacer, la poudre à crème anglaise et 45 ml de lait, étendre. Dessus : fondre le chocolat avec le reste du beurre, étendre. Réfrigérer avant de couper.","v":[]},{"n":"Gâteau Jos Louis géant","e":"","k":"dessert","pr":"","st":["gateau"],"t":"","tm":75,"sf":"","sv":"","m":["chocolat"],"nw":true,"i":[[1,"un","mélange à gâteau au chocolat","épicerie"],[250,"g","beurre","produits laitiers"],[300,"g","sucre à glacer","garde-manger"],[200,"g","guimauves","épicerie"],[250,"g","chocolat mi-sucré","garde-manger"],[125,"ml","crème 35 %","produits laitiers"]],"s":"Cuire le gâteau en deux ronds. Crème : battre le beurre, le sucre à glacer et les guimauves fondues au micro-ondes. Garnir entre les gâteaux. Couvrir de ganache (chocolat et crème chaude) et réfrigérer 1 h pour qu'elle fige.","v":[]},{"n":"Tacos de poisson croustillant","e":"","k":"souper","pr":"","st":["mex"],"t":"mex","tm":35,"sf":"","sv":"guacamole","m":["poisson","tortilla"],"nw":true,"i":[[900,"g","filets de poisson blanc","poissonnerie"],[150,"g","farine","garde-manger"],[250,"ml","bière blonde","épicerie"],[12,"un","petites tortillas","boulangerie"],[397,"g","salade de chou (mélange)","fruits et légumes"],[125,"ml","mayonnaise","épicerie"],[15,"ml","sriracha","épicerie"],[2,"un","limes","fruits et légumes"],[1,"un","bouquet de coriandre","fruits et légumes"]],"s":"Mayo épicée : mélanger la mayonnaise, la sriracha et le jus d'une lime. Couper le poisson en lanières de 2 cm, l'éponger et le saler. Fouetter la farine, 5 ml de sel et la bière froide jusqu'à ce que la pâte soit lisse. Chauffer 5 cm d'huile à 375 °F dans une casserole profonde. Tremper les lanières dans la pâte, laisser égoutter et frire 3 min, en petites quantités, jusqu'à ce qu'elles soient dorées. Égoutter sur du papier absorbant. (Au four : paner farine, oeuf, panko et cuire 15 min à 425 °F.) Réchauffer les tortillas et garnir de salade de chou, de poisson, de mayo épicée, de coriandre et de lime.","v":[["Crevettes","-900 g filets de poisson blanc ; +900 g crevettes crues décortiquées|poissonnerie",""]]},{"n":"Moules et frites à la bière","e":"","k":"souper","pr":"","st":["pub"],"t":"viande","tm":35,"sf":"","sv":"salade_verte","m":["moules"],"nw":true,"i":[[2000,"g","moules","poissonnerie"],[1,"un","oignon","fruits et légumes"],[3,"un","gousses d'ail","fruits et légumes"],[341,"ml","bière blanche","épicerie"],[250,"ml","crème 35 %","produits laitiers"],[45,"g","beurre","produits laitiers"],[1,"un","bouquet de persil","fruits et légumes"],[1600,"g","frites surgelées","surgelés"],[1,"un","baguettes","boulangerie"]],"s":"Rincer les moules, jeter celles qui restent ouvertes. Faire suer l'oignon et l'ail dans le beurre, ajouter la bière et les moules, couvrir 5 à 6 min jusqu'à ce qu'elles s'ouvrent. Ajouter la crème et le persil. Servir avec les frites et la baguette pour saucer.","v":[["Marinières (vin blanc)","-341 ml bière blanche ; +250 ml vin blanc|épicerie",""],["Chorizo et tomates","+150 g chorizo|viandes ; +796 ml tomates en dés|épicerie",""]],"tp":25},{"n":"Bouts de côtes braisés à la bière noire","e":"","k":"souper","pr":"","st":["mijote","pub"],"t":"viande","tm":210,"sf":"patates_pilees","sv":"carottes","m":["bouts de cotes","boeuf"],"nw":true,"i":[[2000,"g","bouts de côtes de boeuf","viandes"],[2,"un","oignon","fruits et légumes"],[3,"un","carottes","fruits et légumes"],[473,"ml","bière noire (stout)","épicerie"],[500,"ml","bouillon de boeuf","épicerie"],[30,"ml","pâte de tomates","épicerie"],[30,"g","cassonade","garde-manger"]],"s":"Saler, poivrer et saisir les bouts de côtes en cocotte. Retirer, faire revenir oignons et carottes, ajouter la pâte de tomates, la bière, le bouillon et la cassonade. Remettre la viande, couvrir et braiser 3 h à 300 °F, jusqu'à ce qu'elle se détache de l'os. Réduire la sauce.","v":[["À la mijoteuse","","8 h à basse température après avoir saisi la viande."]],"tp":30,"mj":2},{"n":"Burger gastro au brie et oignons caramélisés","e":"","k":"souper","pr":"","st":["pub","sandwich","bbq"],"t":"sandwich","tm":45,"sf":"frites_maison","sv":"salade_verte","m":["boeuf hache","brie"],"nw":true,"i":[[1000,"g","boeuf haché","viandes"],[6,"un","pains briochés à hamburger","boulangerie"],[200,"g","brie","produits laitiers"],[3,"un","oignon","fruits et légumes"],[300,"g","bacon","viandes"],[6,"un","feuilles de laitue","fruits et légumes"],[125,"ml","mayonnaise","épicerie"],[30,"ml","moutarde de Dijon","épicerie"]],"s":"Caraméliser les oignons émincés 30 min à feu doux avec beurre et une pincée de cassonade. Cuire le bacon. Former 6 galettes, griller 4 min par côté, déposer le brie la dernière minute. Mayo-Dijon dans les pains grillés, laitue, galette, bacon, oignons.","v":[["Champignons et suisse","-200 g brie ; +227 g champignons|fruits et légumes ; +6 un tranches de fromage suisse|produits laitiers",""]],"tp":30},{"n":"Poutine au canard confit, sauce au poivre","e":"","k":"souper","pr":"","st":["pub"],"t":"complet","tm":40,"sf":"","sv":"","m":["canard","fromage en grains"],"nw":true,"i":[[4,"un","cuisses de canard confites","viandes"],[1600,"g","frites surgelées","surgelés"],[450,"g","fromage en grains","produits laitiers"],[500,"ml","sauce brune","épicerie"],[15,"ml","poivre concassé","garde-manger"],[125,"ml","crème 35 %","produits laitiers"]],"s":"Préchauffer le four à 400 °F. Déposer les cuisses de canard sur une plaque et les réchauffer 20 min, jusqu'à ce que la peau soit croustillante. Effilocher la chair et hacher la peau croustillante. Cuire les frites au four selon l'emballage. Dans une casserole, chauffer la sauce brune avec le poivre concassé et la crème, et mijoter 5 min. Monter les poutines : frites, fromage en grains, canard, puis napper de sauce bouillante.","v":[],"tp":20},{"n":"Bratwursts à la bière et oignons","e":"","k":"souper","pr":"","st":["bbq","pub","sandwich"],"t":"sandwich","tm":45,"sf":"chips","sv":"salade_chou","m":["saucisse","biere"],"nw":true,"i":[[12,"un","saucisses bratwurst","viandes"],[2,"un","oignon","fruits et légumes"],[2,"un","canettes de bière blonde","épicerie"],[12,"un","pains à hot-dog","boulangerie"],[125,"ml","moutarde à l'ancienne","épicerie"],[500,"g","choucroute","épicerie"]],"s":"Mijoter les saucisses 15 min dans la bière avec les oignons tranchés (sur le BBQ dans un plat d'alu). Griller les saucisses jusqu'à ce qu'elles soient dorées, remettre dans la bière pour les garder chaudes. Servir dans les pains avec les oignons, la choucroute et la moutarde.","v":[],"tp":15},{"n":"Sliders au porc effiloché","e":"","k":"souper","pr":"","st":["pub","sandwich"],"t":"sandwich","tm":20,"sf":"frites_four","sv":"","m":["porc effiloche"],"nw":true,"i":[[700,"g","porc effiloché","viandes"],[12,"un","petits pains sliders","boulangerie"],[250,"ml","sauce BBQ","épicerie"],[397,"g","salade de chou (mélange)","fruits et légumes"],[6,"un","cornichons à l'aneth","épicerie"]],"s":"Réchauffer le porc effiloché avec la sauce BBQ dans une casserole à feu moyen, en remuant. Trancher les cornichons. Ouvrir les petits pains et les griller légèrement. Garnir de porc, de salade de chou et de tranches de cornichon, puis refermer.","v":[],"ur":["porc effiloche"]},{"n":"Mac and cheese gratiné au fromage fumé et bacon","e":"","k":"souper","pr":"","st":["pub","pates","four"],"t":"pates","tm":45,"sf":"","sv":"salade_verte","m":["macaroni","bacon"],"nw":true,"i":[[450,"g","macaroni","épicerie"],[300,"g","bacon","viandes"],[250,"g","gouda fumé","produits laitiers"],[200,"g","cheddar fort","produits laitiers"],[750,"ml","lait","produits laitiers"],[45,"g","beurre","produits laitiers"],[45,"g","farine","garde-manger"],[60,"g","chapelure panko","épicerie"]],"s":"Préchauffer le four à 400 °F. Cuire le bacon jusqu'à ce qu'il soit croustillant, puis l'émietter. Râper le gouda fumé et le cheddar. Cuire les macaroni 2 min de moins que l'emballage et les égoutter. Dans une grande casserole, fondre le beurre, ajouter la farine et cuire 1 min. Verser le lait peu à peu en fouettant et cuire 6 min, jusqu'à ce que la sauce épaississe. Hors du feu, ajouter les fromages en gardant une poignée pour le dessus. Mélanger avec les pâtes et le bacon, verser dans un plat, couvrir du reste du fromage et du panko arrosé de beurre fondu. Gratiner 15 min, jusqu'à ce que le dessus soit doré.","v":[["Au homard (version chic)","+300 g chair de homard|poissonnerie","Ajouter la chair de homard avant de gratiner."]],"tp":30},{"n":"Bavette frites et beurre aux échalotes","e":"","k":"souper","pr":"","st":["pub","poele"],"t":"viande","tm":30,"sf":"","sv":"salade_verte","m":["bavette","boeuf"],"nw":true,"i":[[1200,"g","bavette de boeuf","viandes"],[1600,"g","frites surgelées","surgelés"],[125,"g","beurre","produits laitiers"],[3,"un","échalotes françaises","fruits et légumes"],[125,"ml","vin rouge ou bouillon","épicerie"]],"s":"Faire suer les échalotes hachées dans un peu de beurre, déglacer au vin, réduire presque à sec, refroidir et mélanger au reste du beurre mou. Saisir la bavette 4 min par côté, reposer et trancher contre le grain. Servir avec les frites et une rondelle de beurre aux échalotes.","v":[]},{"n":"Tartare de boeuf classique","e":"","k":"souper","pr":"","st":["pub"],"t":"viande","tm":30,"sf":"","sv":"salade_verte","m":["boeuf","tartare"],"nw":true,"i":[[900,"g","intérieur de ronde ou filet de boeuf (très frais)","viandes"],[3,"un","échalotes françaises","fruits et légumes"],[60,"ml","câpres","épicerie"],[6,"un","cornichons à l'aneth","épicerie"],[30,"ml","moutarde de Dijon","épicerie"],[2,"un","oeufs","produits laitiers"],[15,"ml","sauce Worcestershire","épicerie"],[1600,"g","frites surgelées","surgelés"]],"s":"Demander au boucher une pièce très fraîche, la garder au froid. Couper le boeuf au couteau en petits dés. Mélanger avec échalotes, câpres et cornichons hachés, moutarde, jaunes d'oeufs, Worcestershire, quelques gouttes de tabasco, sel et poivre. Servir aussitôt avec frites et salade.","v":[["Tartare de saumon","-900 g intérieur de ronde ou filet de boeuf (très frais) ; +900 g filet de saumon frais (qualité sushi)|poissonnerie","Assaisonner de lime, oignon vert, mayo épicée et sésame."]]},{"n":"Cottage pie à la Guinness","e":"","k":"souper","pr":"","st":["pub","four"],"t":"complet","tm":90,"sf":"","sv":"pois","m":["boeuf hache","pomme de terre"],"nw":true,"i":[[1000,"g","boeuf haché","viandes"],[1,"un","oignon","fruits et légumes"],[2,"un","carottes","fruits et légumes"],[440,"ml","bière noire (stout)","épicerie"],[250,"ml","bouillon de boeuf","épicerie"],[30,"ml","pâte de tomates","épicerie"],[1800,"g","pommes de terre","fruits et légumes"],[60,"g","beurre","produits laitiers"],[150,"g","cheddar fort","produits laitiers"]],"s":"Dorer le boeuf, l'oignon et les carottes en dés, ajouter la pâte de tomates, la bière et le bouillon, mijoter 30 min jusqu'à ce que ce soit épais. Purée : pommes de terre, beurre, un peu de lait. Verser la viande dans un plat, couvrir de purée et de cheddar. Gratiner 25 min à 400 °F.","v":[["Shepherd's pie (agneau)","-1000 g boeuf haché ; +1000 g agneau haché|viandes",""]],"tp":40},{"n":"Grilled cheese gastronomique et soupe aux tomates","e":"","k":"souper","pr":"","st":["pub","sandwich"],"t":"sandwich","tm":30,"sf":"","sv":"","m":["brie","cheddar","tomates"],"nw":true,"i":[[12,"un","tranches de pain au levain","boulangerie"],[200,"g","brie","produits laitiers"],[200,"g","cheddar fort","produits laitiers"],[2,"un","pommes","fruits et légumes"],[100,"g","prosciutto","viandes"],[60,"g","beurre","produits laitiers"],[2,"un","boîtes de tomates broyées","épicerie"],[500,"ml","bouillon de poulet","épicerie"],[125,"ml","crème 35 %","produits laitiers"]],"s":"Soupe : mijoter tomates, bouillon, oignon et basilic 15 min, mixer, ajouter la crème. Sandwichs : pain beurré à l'extérieur, brie, cheddar, tranches de pomme et prosciutto. Dorer 3 min par côté à feu moyen, couvert, pour bien faire fondre.","v":[]},{"n":"Nachos chargés","e":"","k":"entree","pr":"","st":["bouchee","mex"],"t":"","tm":25,"sf":"","sv":"","m":["tortilla","fromage"],"nw":true,"i":[[1,"un","sac de croustilles de tortilla","épicerie"],[320,"g","fromage râpé","produits laitiers"],[500,"g","boeuf haché","viandes"],[1,"un","sachet d'épices à tacos","épicerie"],[250,"ml","salsa","épicerie"],[250,"ml","crème sure","produits laitiers"],[6,"un","piments jalapeños","fruits et légumes"],[2,"un","avocats","fruits et légumes"]],"s":"Préchauffer le four à 400 °F. Dorer le boeuf dans une poêle, égoutter le gras, ajouter les épices à tacos et 125 ml d'eau, et mijoter 3 min. Trancher les jalapeños et couper les avocats en dés. Sur une grande plaque tapissée de papier parchemin, étaler la moitié des croustilles, la moitié du boeuf, du fromage et des jalapeños, puis répéter. Gratiner 8 min, jusqu'à ce que le fromage soit fondu. Garnir de salsa, de crème sure et d'avocat.","v":[]},{"n":"Trempette chaude au poulet buffalo","e":"","k":"entree","pr":"","st":["bouchee"],"t":"","tm":35,"sf":"","sv":"","m":["poulet","fromage a la creme"],"nw":true,"i":[[500,"g","poulet cuit","viandes"],[250,"g","fromage à la crème","produits laitiers"],[125,"ml","sauce piquante","épicerie"],[125,"ml","vinaigrette ranch","épicerie"],[200,"g","cheddar fort","produits laitiers"],[1,"un","sac de croustilles de tortilla","épicerie"]],"s":"Mélanger le fromage à la crème ramolli, la sauce piquante et le ranch. Ajouter le poulet effiloché et la moitié du cheddar. Verser dans un plat, couvrir du reste du fromage, cuire 20 min à 350 °F. Servir avec croustilles et céleri.","v":[]},{"n":"Queso au chorizo","e":"","k":"entree","pr":"","st":["bouchee","mex"],"t":"","tm":20,"sf":"","sv":"","m":["fromage","chorizo"],"nw":true,"i":[[300,"g","fromage blanc fondu (Velveeta)","produits laitiers"],[200,"g","cheddar fort","produits laitiers"],[150,"g","chorizo","viandes"],[250,"ml","salsa","épicerie"],[125,"ml","lait","produits laitiers"],[1,"un","sac de croustilles de tortilla","épicerie"]],"s":"Couper le chorizo en petits dés et le dorer dans une casserole 4 min, puis retirer l'excédent de gras. Couper le fromage fondu en cubes et râper le cheddar. Ajouter le lait et le fromage en cubes dans la casserole et fondre à feu doux en remuant. Ajouter le cheddar une poignée à la fois, puis la salsa. Servir chaud avec les croustilles. Pour un party, garder chaud dans une mijoteuse à basse intensité.","v":[]},{"n":"Mini-saucisses en croûte","e":"","k":"entree","pr":"","st":["bouchee"],"t":"","tm":30,"sf":"","sv":"","m":["saucisse","pate feuilletee"],"nw":true,"i":[[400,"g","pâte feuilletée","surgelés"],[36,"un","mini-saucisses cocktail","viandes"],[1,"un","oeufs","produits laitiers"],[125,"ml","moutarde au miel","épicerie"]],"s":"Préchauffer le four à 400 °F et tapisser une plaque de papier parchemin. Abaisser la pâte feuilletée en un rectangle mince et la couper en lanières de 2 cm de large sur 8 cm de long. Éponger les saucisses et enrouler chacune dans une lanière, la soudure en dessous. Déposer sur la plaque et badigeonner d'oeuf battu. Cuire 15 à 18 min, jusqu'à ce que la pâte soit gonflée et dorée. Servir chaud avec la moutarde au miel.","v":[]},{"n":"Rondelles d'oignon à la bière","e":"","k":"entree","pr":"","st":["bouchee"],"t":"","tm":30,"sf":"","sv":"","m":["oignon"],"nw":true,"i":[[2,"un","oignons espagnols","fruits et légumes"],[200,"g","farine","garde-manger"],[341,"ml","bière blonde","épicerie"],[1000,"ml","huile végétale","garde-manger"]],"s":"Peler les oignons et les couper en rondelles de 1 cm, puis séparer les anneaux. Chauffer l'huile à 375 °F dans une casserole profonde. Fouetter les deux tiers de la farine avec la bière froide, 5 ml de sel et 5 ml de paprika jusqu'à ce que la pâte soit lisse. Enfariner les anneaux dans le reste de la farine, puis les tremper dans la pâte en laissant égoutter le surplus. Frire 2 à 3 min, en petites quantités, en les retournant, jusqu'à ce qu'ils soient dorés. Égoutter sur une grille et saler aussitôt.","v":[]},{"n":"Pelures de pommes de terre garnies","e":"","k":"entree","pr":"","st":["bouchee","four"],"t":"","tm":75,"sf":"","sv":"","m":["pomme de terre","bacon"],"nw":true,"i":[[6,"un","grosses pommes de terre","fruits et légumes"],[200,"g","cheddar fort","produits laitiers"],[250,"g","bacon","viandes"],[250,"ml","crème sure","produits laitiers"],[4,"un","oignons verts","fruits et légumes"]],"s":"Préchauffer le four à 400 °F. Brosser les pommes de terre, les piquer et les cuire 50 min directement sur la grille. Pendant ce temps, cuire le bacon jusqu'à ce qu'il soit croustillant et l'émietter, et râper le cheddar. Couper les pommes de terre en deux et retirer la chair en laissant 1 cm contre la peau. Badigeonner de beurre fondu ou d'huile, saler et dorer 10 min. Garnir de cheddar et de bacon, et gratiner 5 min. Servir avec la crème sure et les oignons verts émincés.","v":[]},{"n":"Bretzels mous et trempette bière-cheddar","e":"","k":"entree","pr":"","st":["bouchee"],"t":"","tm":90,"sf":"","sv":"","m":["cheddar","biere"],"nw":true,"i":[[500,"g","farine","garde-manger"],[8,"g","levure instantanée","garde-manger"],[55.0,"ml","bicarbonate de soude","garde-manger"],[250,"g","cheddar fort","produits laitiers"],[250,"ml","bière blonde","épicerie"],[30,"g","beurre","produits laitiers"]],"s":"Pâte : farine, levure, 375 ml d'eau tiède, sel, sucre; pétrir et laisser lever 1 h. Former 8 bretzels, les plonger 30 s dans de l'eau bouillante additionnée du bicarbonate, saupoudrer de gros sel, cuire 12 min à 425 °F. Trempette : roux de beurre et farine, bière, puis cheddar râpé.","v":[]},{"n":"Ailes coréennes au gochujang","e":"","k":"entree","pr":"","st":["bouchee","asia"],"t":"","tm":50,"sf":"","sv":"","m":["ailes de poulet"],"nw":true,"i":[[1500,"g","ailes de poulet","viandes"],[60,"ml","gochujang","épicerie"],[60,"ml","miel","épicerie"],[30,"ml","sauce soya","épicerie"],[15,"ml","graines de sésame","garde-manger"],[3,"un","oignons verts","fruits et légumes"]],"s":"Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin. Éponger les ailes et les mélanger avec 15 ml de poudre à pâte et 5 ml de sel. Les étaler sans qu'elles se touchent et cuire 45 min en les retournant à mi-cuisson, jusqu'à ce qu'elles soient croustillantes. Dans une casserole, chauffer le gochujang, le miel, la sauce soya, une gousse d'ail hachée et un trait de vinaigre de riz 2 min. Enrober les ailes chaudes de sauce et garnir de graines de sésame et d'oignons verts.","v":[]},{"n":"Crevettes popcorn, mayo sriracha","e":"","k":"entree","pr":"","st":["bouchee"],"t":"","tm":30,"sf":"","sv":"","m":["crevette"],"nw":true,"i":[[680,"g","crevettes crues décortiquées","poissonnerie"],[150,"g","chapelure panko","épicerie"],[2,"un","oeufs","produits laitiers"],[100,"g","farine","garde-manger"],[125,"ml","mayonnaise","épicerie"],[15,"ml","sriracha","épicerie"]],"s":"Mayo : mélanger la mayonnaise, la sriracha et un trait de jus de lime. Éponger les crevettes et les saler. Préparer trois bols : la farine, les oeufs battus, le panko. Passer chaque crevette dans la farine, l'oeuf, puis le panko. Frire 2 min dans l'huile à 375 °F, ou cuire 12 min au four à 425 °F sur une plaque huilée en les retournant, ou 8 min à la friteuse à air. Servir aussitôt avec la mayo sriracha.","v":[]},{"n":"Soupe à l'oignon gratinée à la bière","e":"","k":"soupe","pr":"","st":["soupe","pub"],"t":"","tm":75,"sf":"","sv":"","m":["oignon","gruyere"],"nw":true,"i":[[6,"un","oignon","fruits et légumes"],[60,"g","beurre","produits laitiers"],[341,"ml","bière rousse","épicerie"],[1500,"ml","bouillon de boeuf","épicerie"],[1,"un","baguettes","boulangerie"],[250,"g","gruyère râpé","produits laitiers"]],"s":"Caraméliser les oignons émincés dans le beurre 40 min à feu moyen-doux. Déglacer à la bière, ajouter le bouillon, mijoter 20 min. Verser dans des bols allant au four, couvrir de croûtons de baguette et de gruyère, gratiner sous le gril 3 à 5 min.","v":[]}];
const SIDES = [{"id":"frites_four","n":"Frites au four","sl":"f","ty":["viande","sandwich"],"i":[[1200,"g","frites surgelées","surgelés"]],"s":"Préchauffer le four à 425 °F. Étaler les frites en une seule couche sur deux plaques tapissées de papier parchemin. Cuire 20 à 25 min en les retournant à mi-cuisson, jusqu'à ce qu'elles soient dorées. Saler à la sortie du four."},{"id":"frites_maison","n":"Frites maison au four","sl":"f","ty":["viande","sandwich"],"i":[[1500,"g","pommes de terre","fruits et légumes"],[30,"ml","huile d'olive","garde-manger"]],"s":"Préchauffer le four à 450 °F. Couper les pommes de terre en bâtonnets de 1 cm et les rincer à l'eau froide, puis bien les éponger. Mélanger avec l'huile, du sel et du paprika. Étaler en une seule couche sur deux plaques tapissées de papier parchemin. Cuire 30 à 35 min en retournant à mi-cuisson, jusqu'à ce qu'elles soient croustillantes."},{"id":"patates_pilees","n":"Patates pilées","sl":"f","ty":["viande"],"i":[[1500,"g","pommes de terre","fruits et légumes"],[60,"g","beurre","produits laitiers"],[125,"ml","lait","produits laitiers"]],"s":"Peler les pommes de terre et les couper en gros cubes. Les mettre dans l'eau froide salée, porter à ébullition et cuire 15 à 18 min, jusqu'à ce qu'une fourchette les traverse sans résistance. Égoutter et remettre dans la casserole chaude 1 min pour les assécher. Piler avec le beurre et le lait chaud, saler et poivrer."},{"id":"patates_four","n":"Patates au four","sl":"f","ty":["viande"],"i":[[6,"un","grosses pommes de terre","fruits et légumes"]],"s":"Préchauffer le four à 425 °F. Brosser les pommes de terre, les piquer à la fourchette, les huiler et les saler. Cuire directement sur la grille 50 à 60 min, jusqu'à ce qu'elles soient tendres au centre. Ouvrir en croix et servir avec du beurre ou de la crème sure."},{"id":"grelots","n":"Patates grelots rôties","sl":"f","ty":["viande","complet"],"i":[[1200,"g","patates grelots","fruits et légumes"],[30,"ml","huile d'olive","garde-manger"]],"s":"Préchauffer le four à 425 °F. Couper les grelots en deux. Mélanger avec l'huile, du sel, du poivre et un peu d'ail ou d'herbes. Étaler sur une plaque, côté coupé vers le bas. Rôtir 25 à 30 min, jusqu'à ce qu'ils soient dorés et tendres."},{"id":"wedges","n":"Potato wedges","sl":"f","ty":["viande","sandwich"],"i":[[1500,"g","pommes de terre","fruits et légumes"],[30,"ml","huile d'olive","garde-manger"]],"s":"Préchauffer le four à 425 °F. Couper chaque pomme de terre en 8 quartiers sur la longueur. Mélanger avec l'huile, du sel, du paprika et de la poudre d'ail. Étaler sur une plaque tapissée de papier parchemin, peau vers le bas. Cuire 35 à 40 min, en retournant une fois, jusqu'à ce qu'ils soient dorés."},{"id":"patates_douces","n":"Frites de patates douces","sl":"f","ty":["viande","sandwich"],"i":[[1500,"g","patates douces","fruits et légumes"],[30,"ml","huile d'olive","garde-manger"]],"s":"Préchauffer le four à 425 °F. Peler les patates douces et les couper en bâtonnets de 1 cm. Mélanger avec l'huile, du sel et du paprika. Étaler en une seule couche sur deux plaques, sans les tasser. Cuire 25 à 30 min en retournant à mi-cuisson."},{"id":"pelures","n":"Pelures de pommes de terre gratinées","sl":"f","ty":["viande"],"i":[[6,"un","grosses pommes de terre","fruits et légumes"],[250,"g","cheddar râpé","produits laitiers"],[150,"g","bacon","viandes"],[250,"ml","crème sure","produits laitiers"]],"s":"Préchauffer le four à 400 °F. Piquer les pommes de terre et les cuire au micro-ondes 10 à 12 min, ou au four 50 min, jusqu'à ce qu'elles soient tendres. Pendant ce temps, cuire le bacon croustillant et l'émietter. Couper les pommes de terre en deux, retirer la chair en laissant 1 cm contre la peau. Badigeonner d'huile, cuire 10 min. Garnir de cheddar et de bacon, gratiner 8 min. Servir avec la crème sure."},{"id":"gratin","n":"Gratin dauphinois","sl":"f","ty":["viande"],"i":[[1500,"g","pommes de terre","fruits et légumes"],[500,"ml","crème 35%","produits laitiers"],[200,"g","gruyère ou cheddar râpé","produits laitiers"]],"s":"Préchauffer le four à 350 °F et beurrer un plat de 9 x 13 po. Peler les pommes de terre et les trancher très mince (3 mm). Chauffer la crème avec une gousse d'ail écrasée, du sel, du poivre et une pincée de muscade. Étager les pommes de terre dans le plat en versant la crème chaude entre les couches. Couvrir de papier d'aluminium et cuire 45 min. Retirer le papier, parsemer de fromage et cuire encore 25 à 30 min, jusqu'à ce que ce soit doré et tendre."},{"id":"chips_maison","n":"Chips maison au four","sl":"f","ty":["viande","sandwich"],"i":[[1000,"g","pommes de terre","fruits et légumes"],[30,"ml","huile d'olive","garde-manger"]],"s":"Préchauffer le four à 400 °F. Trancher les pommes de terre très mince à la mandoline (2 mm), rincer et bien éponger. Mélanger avec l'huile et le sel. Étaler en une seule couche sur des plaques tapissées de papier parchemin. Cuire 15 à 20 min en surveillant à la fin : les retirer dès qu'elles sont dorées."},{"id":"chips","n":"Chips","sl":"f","ty":["sandwich"],"i":[[1,"un","sac de chips","épicerie"]],"s":"Verser les chips dans un bol au moment de servir."},{"id":"riz_blanc","n":"Riz vapeur","sl":"f","ty":["viande","riz","mex"],"i":[[300,"g","riz","épicerie"]],"s":"Rincer le riz à l'eau froide jusqu'à ce que l'eau soit presque claire. Dans une casserole, porter le riz, 1,5 fois son volume d'eau et une pincée de sel à ébullition. Couvrir, baisser à feu doux et cuire 15 min sans soulever le couvercle. Retirer du feu, laisser reposer 5 min couvert, puis égrainer à la fourchette."},{"id":"riz_frit","n":"Riz frit","sl":"f","ty":["viande","riz"],"i":[[300,"g","riz","épicerie"],[3,"un","oeufs","produits laitiers"],[200,"g","pois et carottes surgelés","surgelés"],[60,"ml","sauce soya","épicerie"]],"s":"Idéalement, cuire le riz la veille et le réfrigérer : le riz froid frit mieux. Battre les oeufs. Dans un wok ou une grande poêle très chaude avec un filet d'huile, brouiller les oeufs, const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');
const keyOf = (name,u) => norm(name).replace(/\([^)]*\)/g,'').replace(/\b([a-z']{3,}?)s\b/g,'$1').replace(/\s+(rapee?|romaine)\b/g,'').replace(/\s+/g,' ').trim().replace(/^lait (2|1|3\.25|entier|ecreme|partiellement ecreme) ?%?$/,'lait')+'|'+u;
function fq(q,u){
  const dec = x => String(+x.toFixed(2)).replace('.', ',');
  if(u==='g') return q>=1000 ? dec(q/1000)+' kg' : Math.round(q)+' g';
  if(u==='ml') return q>=1000 ? dec(q/1000)+' L' : Math.round(q)+' ml';
  return '× '+String(Math.round(q*10)/10).replace('.', ',');
}

/* ---------- protection des données ----------
   Les données vivent sur le téléphone, sous la clé KEY. Une mise à jour de l'application ne remplace que le code.
   1. Si les données ne peuvent pas être lues, elles sont mises de côté (RESCUE) avant tout enregistrement.
   2. Une copie est gardée avant chaque nouvelle version et une fois par jour (COPIES, 5 au maximum).
   3. Une copie peut être enregistrée dans Fichiers et restaurée. */
const APPV = '2026-10-15b', KEY = 'menu_epicerie_v1', COPIES = 'menu_epicerie_copies', RESCUE = 'menu_epicerie_secours';
let loadFailed = false, rescued = false, bkBar = true;   /* bkBar : bandeau de sauvegarde, une fois par ouverture */
function readCopies(){ try{ return JSON.parse(localStorage.getItem(COPIES) || '[]'); }catch(e){ return []; } }
function snapshot(label, raw){
  try{ const o = JSON.parse(raw); delete o.auto; raw = JSON.stringify(o); }catch(e){}
  const L = readCopies(); L.unshift({d: new Date().toISOString(), label, data: raw});
  for(let n = Math.min(L.length, 5); n >= 1; n--){ try{ localStorage.setItem(COPIES, JSON.stringify(L.slice(0, n))); return true; }catch(e){} }
  return false;
}
function loadLocal(){
  let j = null;
  try{ j = localStorage.getItem(KEY); }catch(e){}
  if(j){
    try{ S = mergeState(JSON.parse(j)); }
    catch(e){ loadFailed = true; try{ localStorage.setItem(RESCUE, j); rescued = true; }catch(_){} }
    if(!loadFailed && S.appv !== APPV){ snapshot('Avant la mise à jour', j); S.appv = APPV; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    if(loadFailed) S.flash = "Tes données n'ont pas pu être lues par cette version. Elles sont gardées de côté, rien n'est effacé : Réglages → Sauvegarde → « Essayer de les restaurer ».";
  } else S.appv = APPV;
  const st = {}; Object.values(S.stock||{}).forEach(o => { const [q,u] = normQU(o.name,o.q,o.u); const k = keyOf(o.name,u); if(st[k]) st[k].q += q; else st[k] = Object.assign({}, o, {q,u}); }); S.stock = st;
}
function save(){
  _AR = _ND = _BL = _CAT = null; _DF = new Map(); _AS = null; _ASA = null; _ECO = new Map(); _CMP = new Map(); S.maj = Date.now(); S.bkDirty = true;
  if(loadFailed && !rescued){ setSync("Données illisibles : rien n'est enregistré pour ne rien écraser (voir Réglages)"); return; }
  const raw = JSON.stringify(S);
  const put = () => { localStorage.setItem(KEY, raw); setSync('Enregistré sur cet appareil'); };
  try{ put(); }
  catch(e){   /* stockage plein : garder seulement la copie la plus récente, puis réessayer */
    try{ localStorage.setItem(COPIES, JSON.stringify(readCopies().slice(0, 1))); put(); }
    catch(e2){ try{ localStorage.removeItem(COPIES); put(); }catch(e3){ setSync("Enregistrement impossible : mode privé ou stockage plein"); return; } }
  }
  try{ const L = readCopies(); if(!L.length || L[0].d.slice(0,10) !== isoToday()) snapshot('Copie du jour', raw); }catch(e){}
}

function splitSteps(s){
  const parts = String(s||'').replace(/\s+/g, ' ').trim().split(/([.!?])\s+/), out = []; let cur = '';
  for(let i = 0; i < parts.length; i += 2){ cur += parts[i] + (parts[i+1] || ''); const nx = parts[i+2];
    if(nx === undefined || /^[A-ZÀ-ÖØ-Þ0-9«(]/.test(nx)){ if(cur.trim()) out.push(cur.trim()); cur = ''; } else cur += ' '; }
  return out;
}
