<style>
/* Mise en page : une colonne mobile, barre d'onglets en bas, cartes de souper empilées. */
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#14221f; --mute:#5b6b66; --line:#dbe3df;
  --accent:#0b6b57; --accent-ink:#ffffff; --soft:#e2f0eb;
  --deal:#c8341f; --deal-soft:#fbe6e2; --ok:#1c7a3d; --warn:#9a6700;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --card:#18231f; --ink:#e8f0ed; --mute:#98aaa3; --line:#2a3a35;
  --accent:#4fc3a1; --accent-ink:#06231b; --soft:#1d3029;
  --deal:#ff8a75; --deal-soft:#3a1f1a; --ok:#6fd08c; --warn:#e3b341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --card:#18231f; --ink:#e8f0ed; --mute:#98aaa3; --line:#2a3a35;
  --accent:#4fc3a1; --accent-ink:#06231b; --soft:#1d3029;
  --deal:#ff8a75; --deal-soft:#3a1f1a; --ok:#6fd08c; --warn:#e3b341; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding-block:14px 96px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
header h1{font-size:1.6rem;line-height:1.05}
.sync{font-size:.75rem;color:var(--mute);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hbtn{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-weight:700;font-size:.85rem}
details.help>summary{font-family:var(--f-disp);font-size:1.02rem;color:var(--ink)}
.help p,.help li{font-size:.93rem}
.help ol,.help ul{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.help .tip{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0}
.help .warn{background:var(--deal-soft);border-radius:10px;padding:8px 10px;margin:6px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;min-height:48px;background:none;border:0;border-radius:12px;font-weight:600;font-size:.82rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--soft)}
.tabs .ic{font-size:1.2rem;line-height:1}
.badge{display:inline-block;min-width:1.3em;padding:0 .4em;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:1.5;margin-left:4px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:1.1rem;line-height:1.2}
.kids{font-size:1.15rem;margin-right:6px}
.acc,.small{color:var(--mute);font-size:.88rem;margin:0}
.var{margin:0;font-size:.9rem;background:var(--soft);padding:6px 10px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--deal-soft);color:var(--deal);font-weight:600;max-width:100%;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.88rem;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:disabled{opacity:.6}
.chip.st{background:var(--soft);color:var(--accent)}
.chip.n{background:var(--soft);color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.s{min-height:38px;padding:0 12px;font-size:.88rem}
.btn.d{color:var(--deal)}
.btn:disabled{opacity:.45}
details>summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center}
ul.ing{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
ul.ing li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.steps{font-size:.9rem;margin:6px 0}
.rayon{font-family:var(--f-disp);font-size:1rem;margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline}
.rayon span{font:500 .78rem var(--f-body);color:var(--mute)}
.item{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0;border-bottom:1px solid var(--line)}
.item input[type=checkbox]{width:26px;height:26px;accent-color:var(--accent);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;overflow-wrap:anywhere}
.item .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item.done .t b{text-decoration:line-through;color:var(--mute)}
.item small{display:block;color:var(--mute);font-size:.78rem}
.item .deal{color:var(--deal);font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;line-height:1}
.step output{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute);min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:22px 14px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum div{flex:1 1 90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum b{display:block;font:700 1.3rem var(--f-disp);font-variant-numeric:tabular-nums}
.sum span{font-size:.76rem;color:var(--mute)}
a{color:var(--accent)}
.note{font-size:.85rem;color:var(--warn);margin:0}
@media (max-width:380px){.grid4{grid-template-columns:1.6fr 1fr 1fr auto}}
</style>

      if(m){ const k = keyOf(m[3].trim(), m[2]); const o = map.get(k); if(o){ o.q -= parseFloat(m[1].replace(',','.')); if(o.q<=0) map.delete(k); } }
      else { const w = norm(tok.slice(1).trim()); for(const [k,o] of [...map]) if(norm(o.name).includes(w)) map.delete(k); }
    }
  });
  return [...map.entries()].map(([k,o]) => ({k,...o}));
}


/* ---------- accompagnements, portions, stock ---------- */
const TYPES = {viande:'Viande',pates:'Pâtes',riz:'Riz et nouilles',sandwich:'Sandwich et burger',mex:'Mexicain',complet:'Repas complet'};
const ALLS = () => SIDES.concat(S.sidesx||[], stockSides());
const sideById = id => id ? ALLS().find(s => s.id===id) : null;
const sidesOf = sl => ALLS().filter(s => s.sl===sl);
const compat = (s, r) => s.ty.includes('all') || s.ty.includes(r.t||'viande');
const totalPortions = () => (S.p.souper||4) + (S.p.restes||0);
const portionsOf = it => it.pt || totalPortions();
function variantSides(r, idx){
  const o = {}; const d = idx>0 && vars(r)[idx-1] ? vars(r)[idx-1][1] : '';
  d.split(';').forEach(tok => { const m = tok.trim().match(/^@([fv])=(\S+)$/); if(m) o[m[1]] = m[2]==='aucun' ? '' : m[2]; });
  return o;
}
const recentSides = () => new Set(S.hist.slice(-2).flatMap(w => w.items.flatMap(x => [x.sf,x.sv])).filter(Boolean));
const usedSides = items => new Set(items.flatMap(x => [x.sf,x.sv]).filter(Boolean));
const sigWords = name => norm(name).replace(/\([^)]*\)/g,'').split(/[^a-z]+/).filter(w => w.length>=4 && !['fromage','sauce','pate','pates','pain','tranche','portion','individuel','boite','paquet','emballage','hache','moulu','rape','frais','fume','cuit','gros','grand','mini'].includes(w)).map(w => w.replace(/s$/,''));
function stockKey(n){
  if(S.stock[n.k]) return n.k;
  const nw = sigWords(n.name); if(!nw.length) return null;
  for(const [k,o] of Object.entries(S.stock)){ if(o.u!==n.u) continue; if(sigWords(o.name).some(w => nw.includes(w))) return k; }
  return null;
}
function stockSideBonus(s){ return s.i.some(([q,u,n]) => !isMaison(n) && stockKey({k:keyOf(n,u),name:n,u})) ? .5 : 0; }
function chooseSide(r, slot, used){
  const def = (slot==='f' ? r.sf : r.sv) ?? '';
  if(def==='') return '';
  const rec = recentSides();
  const c = sidesOf(slot).filter(s => compat(s,r) || s.id===def); if(!c.length) return '';
  let best='', bs=-9;
  c.forEach(s => { const sc = Math.random() + (s.id===def?.5:0) + (s.id.startsWith('st:')?.9:(s.id[0]==='x'?.3:0)) - (used.has(s.id)?1.5:0) - (rec.has(s.id)?.6:0) + stockSideBonus(s); if(sc>bs){ bs=sc; best=s.id; } });
  return best;
}
function mkItem(r, used, v){
  const ov = variantSides(r, v);
  const it = {r:r.n, v, ovr:{f:'f' in ov, v:'v' in ov}, fm:1, vm:1};
  it.sf = 'f' in ov ? ov.f : chooseSide(r,'f',used);
  it.sv = 'v' in ov ? ov.v : chooseSide(r,'v',used);
  return it;
}
function scaleQ(q,u,f){
  if(Math.abs(f-1)<1e-9) return q;
  const x = q*f;
  if(u==='un') return x>=3 ? Math.ceil(x-1e-9) : Math.ceil(x*2-1e-9)/2;
  return x>=100 ? Math.round(x/10)*10 : Math.round(x/5)*5 || 5;
}
function fullIngs(it, all){
  const r = byName(it.r); if(!r) return [];
  const f = portionsOf(it)/6, ex = it.ex||[];
  const map = new Map();
  const put = (g, fac) => { if(fac<=0) return; const q = scaleQ(g.q,g.u,fac); const o = map.get(g.k); if(o) o.q += q; else map.set(g.k,{k:g.k,q,u:g.u,name:g.name,rayon:g.rayon}); };
  effective(r,it.v).forEach(g => { const out = ex.includes(g.k); if(out && !all) return; if(out){ map.set('x'+g.k,{k:g.k,q:scaleQ(g.q,g.u,f),u:g.u,name:g.name,rayon:g.rayon,x:true}); return; } put(g,f); });
  [['sf','fm'],['sv','vm']].forEach(([key,mk]) => { const s = sideById(it[key]); if(!s) return;
    s.i.forEach(([q,u,n,ra]) => { const g = {k:keyOf(n,u),q,u,name:n,rayon:ra}; const out = ex.includes(g.k); if(out && !all) return; if(out){ map.set('x'+g.k,{...g,q:scaleQ(q,u,f),x:true}); return; } put(g, f*(it[mk]??1)); }); });
  return [...map.values()];
}
function stockOf(it){ const out = []; fullIngs(it).forEach(g => { if(isMaison(g.name)) return; const sk = stockKey(g); if(sk){ const nm = S.stock[sk].name; if(!out.includes(nm)) out.push(nm); } }); return out.slice(0,3); }
function aUtiliser(){
  if(!Object.keys(S.stock).length) return [];
  const used = new Set(); needs().forEach(n => { if(n.src.includes('Restes à manger')) return; const sk = stockKey(n); if(sk) used.add(sk); });
  return Object.entries(S.stock).filter(([k,o]) => !isMaison(o.name) && !used.has(k)).map(([k,o]) => ({k,o,eat:!!S.menu.useup[k]}));
}
function ideesPour(o){
  const w = sigWords(o.name); if(!w.length) return [];
  const rec = recentSet(), inM = new Set(S.menu.items.map(x => x.r));
  return allRecipes().filter(r => !rec.has(r.n) && !inM.has(r.n) && effective(r,0).some(g => g.u===o.u && sigWords(g.name).some(x => w.includes(x)))).slice(0,3);
}
function sidesLabel(r){ const nm = id => id==='auto' ? 'varié' : (sideById(id)||{}).n; return `${TYPES[r.t||'viande']||''} · Par défaut : ${[nm(r.sf||''),nm(r.sv||'')].filter(Boolean).join(' + ') || 'aucun accompagnement'} (change chaque semaine)`; }
const qt = (q,u) => fq(q,u).replace('× ','');
function sideBlock(it,i){

function renderUtiliser(){

const CATS = [['','Sans catégorie'],['f','Féculent (accompagnement)'],['v','Légume ou salade (accompagnement)'],['p','Viande ou protéine'],['c','Collation ou lunch'],['o','Autre']];
function stockSides(){
  return Object.entries(S.stock).filter(([k,o]) => o.cat==='f' || o.cat==='v').map(([k,o]) => ({id:'st:'+k, n:o.name+' (à la maison)', sl:o.cat, ty:['all'], i:[[Math.max(.5, Math.round(o.q/Math.max(.5,totalPortions()/6)*10)/10), o.u, o.name, o.rayon||'épicerie']]}));
}
const tmOf = r => (S.tmx||{})[r.n] ?? r.tm ?? 30;
const isLong = r => tmOf(r) > (S.p.maxTm||35);

/* ---------- besoins, stock, achats ---------- */
const maisonList = () => S.maison.split(',').map(x => norm(x).trim()).filter(Boolean);
const isMaison = name => { const n = norm(name); return maisonList().some(m => n.includes(m)); };

function needs(){
  const map = new Map();
  const add = (q,u,name,rayon,src) => { const k = keyOf(name,u); const o = map.get(k); if(o){ o.q += q; if(src && !o.src.includes(src)) o.src.push(src); } else map.set(k,{k,q,u,name,rayon:rayon||'épicerie',src:src?[src]:[]}); };
  S.menu.items.forEach(it => { fullIngs(it).forEach(g => add(g.q,g.u,g.name,g.rayon,it.r)); });
  Object.keys(S.menu.useup||{}).forEach(k => { const st = S.stock[k]; if(st) add(st.q, st.u, st.name, st.rayon, 'Restes à manger'); });
  if(S.menu.items.length){
    S.snacks.forEach(s => add(s.q*S.p.jours, s.u, s.name, s.r, 'Collations'));
    S.ess.forEach(s => add(s.q, s.u, s.name, s.r, s.c || 'Essentiels'));
  }
  return [...map.values()];
}
function buyList(){
  const rows = [], covered = [], verify = [];
  const avail = {}; Object.entries(S.stock).forEach(([k,o]) => avail[k] = o.q);
  for(const n of needs()){
    const ex = S.menu.extra[n.k];
    if(isMaison(n.name)){ verify.push({...n, manque: !!ex}); if(!ex) continue; }
    const sk = ex ? null : stockKey(n); const st = sk ? avail[sk] : 0;
    if(sk) avail[sk] = Math.max(0, avail[sk] - n.q);
    let def = ex ? n.q : n.q - st;
    if(def <= 0.001){ covered.push({...n, st}); continue; }
    const p = packOf(n.name,n.u);
    const buy = p ? Math.ceil(def/p - 1e-9)*p : def;
    rows.push({...n, st, buy});
  }
  return {rows, covered, verify};
}
const isoToday = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const shopISO = () => S.dates.shop || isoToday();
const fmtDate = iso => { try{ return new Date(iso+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return iso; } };
const nice = t => { t = String(t).trim(); return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase(); };
function autoItems(){ if(!S.auto) return []; const d = shopISO(); return S.auto.items.filter(i => (!i.vt || i.vt >= d) && (!i.vf || i.vf <= d)); }
const allSpec = () => S.spec.concat(autoItems().map(i => ({s:i.s, t:nice(i.t)+(i.p?' · '+i.p:'')})));
function dealFor(name){
  const words = norm(name).split(/[^a-z]+/).filter(w => w.length>=5 && !GENERIC.includes(w));
  for(const s of allSpec()){ const t = norm(s.t); if(words.some(w => t.includes(w))) return s; }
  return null;
}

/* ---------- génération du menu ---------- */
const protein = r => { const t = norm(r.n+' '+r.m.join(' ')); for(const p of ['poulet','boeuf','porc','saucisse','jambon','bacon','poisson','bologne']) if(t.includes(p)) return p; return 'autre'; };
const isPasta = r => /spaghetti|pates|lasagne|tortellini|mac n|gnocchi|carbonara|nouilles|ramen/.test(norm(r.n));
const uses = n => S.hist.reduce((c,w) => c + w.items.filter(x => x.r===n).length, 0);
function recentSet(){ return new Set(S.hist.slice(-S.p.cool).flatMap(w => w.items.map(x => x.r))); }
function pickVar(r){
  const nv = vars(r).length;
  if(S.p.varMode==='base' || !nv) return 0;
  const u = uses(r.n);
  return S.p.varMode==='var' ? 1 + (u % nv) : u % (nv+1);
}
function dealsOf(r){
  const out = [];
  for(const mot of r.m){ const nm = norm(mot); const hit = allSpec().find(s => norm(s.t).includes(nm)); if(hit) out.push({mot,hit}); }
  return out;
}
function score(r){
  let pts = 0;
  dealsOf(r).forEach(d => pts += GENERIC.includes(norm(d.mot)) ? .3 : 1.2);
  pts += .35 * [...r.e].filter(c => c!==' ' && c!=='️').length / 2;
  let hit = 0; effective(r,0).forEach(g => { if(isMaison(g.name)) return; const sk = stockKey(g); if(sk) hit += Math.min(1, S.stock[sk].q/Math.max(g.q,1)); });
  pts += Math.min(hit,5)*.4;
  if(S.fav[r.n]) pts += .8;
  if(tmOf(r)<=25) pts += .25;
  return pts + Math.random()*.9;
}

function fill(n, keep){
  const items = keep.slice();
  const banned = new Set([...recentSet(), ...items.map(x => x.r)]);
  const cands = allRecipes().filter(r => !banned.has(r.n)).map(r => ({r, s:score(r)})).sort((a,b) => b.s-a.s);
  const prot = {}; let pastas = 0, longs = 0; const maxLong = S.p.nLong ?? 1; const taken = new Set();
  const note = r => { const p = protein(r); prot[p] = (prot[p]||0)+1; pastas += isPasta(r)?1:0; longs += isLong(r)?1:0; };
  items.forEach(it => { const r = byName(it.r); if(r) note(r); });
  const pass = lvl => { for(const {r} of cands){
    if(items.length>=n) break; if(taken.has(r.n)) continue;
    const p = protein(r);
    if(lvl===0){ if(p!=='autre' && (prot[p]||0)>=2) continue; if(isPasta(r) && pastas>=2) continue; }
    if(lvl<2 && isLong(r) && longs>=maxLong) continue;
    items.push(mkItem(r, usedSides(items), pickVar(r))); taken.add(r.n); note(r);
  } };
  pass(0); if(items.length<n) pass(1); if(items.length<n) pass(2);
  return items;
}
function today(){ return fmtDate(shopISO()); }
function genMenu(){
  const keep = (S.menu.items||[]).filter(x => x.lock);
  S.menu = {date:today(), items:fill(S.p.n, keep), chk:{}, extra:{}, achete:false, snap:null, useup:S.menu.useup||{}};
  save(); render();
}

  return [...set];

const dayOf = v => v ? String(v).slice(0,10) : '';
async function chercherSpeciaux(ignorerDate){
  const st = $('#sp_status'), btn = $('#sp_go');
  const say = t => { if(st) st.textContent = t; };
  btn.disabled = true;
  const cp = (S.cp||'G0M1Y0').replace(/\s/g,'').toUpperCase();
  const shop = shopISO();
  try{
    say('Recherche des circulaires…');
    const fl = await jget(`${FLIPP}/flyers?locale=fr-ca&postal_code=${cp}`);
    const all = (Array.isArray(fl) ? fl : (fl.flyers||[])).filter(f => marchand(f.merchant));
    if(!all.length){ say("Aucune circulaire Maxi, IGA, Walmart ou Inter-Marché trouvée pour ce code postal."); btn.disabled = false; return; }
    const mid = new Date(shop+'T12:00:00').getTime();
    let flyers = all.filter(f => new Date(f.valid_from).getTime() <= mid && new Date(f.valid_to).getTime() >= mid);
    let note = '';
    if(!flyers.length){
      if(!ignorerDate){
        const fin = all.map(f => dayOf(f.valid_to)).sort().pop();
        say(`Aucune circulaire ne couvre le ${fmtDate(shop)} pour l'instant (les circulaires actuelles finissent le ${fin}). Les nouvelles sortent le jeudi : relance la recherche plus tard. `);
        const a = document.createElement('button'); a.className = 'btn s'; a.textContent = 'Utiliser les circulaires actuelles quand même'; a.onclick = () => chercherSpeciaux(true); st.appendChild(a);
        btn.disabled = false; return;
      }
      const now = Date.now(); flyers = all.filter(f => new Date(f.valid_from).getTime() <= now && new Date(f.valid_to).getTime() >= now);
      note = ' (circulaires actuelles, possiblement expirées à la date de l\'épicerie)';
    }
    flyers = flyers.slice(0,12);
    const mots = motsCles(); const items = []; let ok = 0;
    for(let k = 0; k < flyers.length; k++){
      const f = flyers[k]; say(`Lecture de la circulaire ${k+1} / ${flyers.length} : ${marchand(f.merchant)}…`);
      try{
        const d = await jget(`${FLIPP}/flyers/${f.id}?locale=fr-ca&postal_code=${cp}`);
        (Array.isArray(d) ? d : (d.items||[])).forEach(it => {
          const nn = norm(it.name||''); if(!nn || !mots.some(w => nn.includes(w))) return;
          const pr = parseFloat(it.price||it.current_price); 
          items.push({s:marchand(f.merchant), t:it.name, p:isFinite(pr)&&pr>0 ? pr.toFixed(2).replace('.',',')+' $' : '', vf:dayOf(it.valid_from||f.valid_from), vt:dayOf(it.valid_to||f.valid_to), d:it.discount||0});
        });
        ok++;
      }catch(e){}
    }
    if(!ok){ say('Les circulaires ont été trouvées, mais leur contenu est illisible. Utilise le collage manuel ci-dessous.'); btn.disabled = false; return; }
    const uniq = new Map(); items.forEach(i => uniq.set(i.s+'|'+norm(i.t), i));
    const list = [...uniq.values()].sort((a,b) => (b.d||0)-(a.d||0)).slice(0,250);
    S.auto = {items:list, maj:isoToday(), src:[...new Set(flyers.map(f => marchand(f.merchant)))].join(', ')};

    const s2 = $('#sp_status'); if(s2) s2.textContent = `${list.length} spéciaux retenus dans ${ok} circulaires (${S.auto.src}) pour le ${fmtDate(shop)}${note}.`;
  }catch(e){
    say(e instanceof TypeError
      ? "Le navigateur a bloqué la requête vers Flipp ou tu es hors ligne. Ouvre « Si la recherche ne fonctionne pas » : colle le texte d'une circulaire, ou ajoute un relais."
      : 'La recherche a échoué ('+(e.message||'erreur')+'). Réessaie plus tard ou colle le texte de la circulaire.');
    btn.disabled = false; return;
  }
}

let DL = false;
function semaineCsv(){
  const {rows} = buyList();
  const q = x => '"'+String(x).replace(/"/g,'""')+'"';
  const out = ['Rayon,Article,Quantité,Spécial,Pour'];
  RAYONS.forEach(ray => rows.filter(r => r.rayon===ray).sort((a,b)=>a.name.localeCompare(b.name,'fr')).forEach(r => {

  }));

function sauver(filename, data, msgId){
  const msg = $(msgId);
  try{
    const blob = new Blob([data], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    msg.textContent = 'Fichier créé : cherche-le dans les téléchargements.';
  }catch(e){ msg.textContent = "Impossible de créer le fichier ici. Utilise « Copier »."; }
}
async function copier(text, msgId){
  const msg = $(msgId);
  try{ await navigator.clipboard.writeText(text); msg.textContent = 'Copié. Colle-le dans un message.'; }
  catch(e){
    msg.innerHTML = 'Copie bloquée : sélectionne le texte ci-dessous.<textarea readonly id="exout" style="margin-top:6px;min-height:160px"></textarea>';
    const ta = $('#exout'); ta.value = text; ta.focus(); ta.select();
  }
}

const RAY_WORDS = {
  'viandes':['poulet','boeuf','porc','saucisse','jambon','bacon','dinde','bologne','agneau','steak','cote','pepperoni','salami','bavette','filet mignon'],
  'poissonnerie':['poisson','saumon','crevette','morue','aiglefin','thon'],
  'produits laitiers':['lait','creme','fromage','beurre','yogourt','oeuf','mozzarella','cheddar','parmesan','feta','ricotta','babeurre'],
  'fruits et légumes':['oignon','ail','tomate','laitue','carotte','poivron','brocoli','patate','pomme','concombre','champignon','chou','epinard','avocat','citron','lime','celeri','persil','coriandre','ananas','courgette','mais frais','haricot vert','salade'],
  'boulangerie':['pain','tortilla','pita','naan','bun','brioche','sous-marin','hamburger','hot-dog'],
  'surgelés':['surgele','frite','egg roll','pogo','pate a tarte','abaisse'],
  'garde-manger':['farine','sucre','sel','poivre','epice','cannelle','paprika','cayenne','cumin','origan','huile','fecule','poudre','bicarbonate','cassonade']
};
function guessRayon(name){
  const n = norm(name);
  for(const [ray,words] of Object.entries(RAY_WORDS)) if(words.some(w => n.includes(w))) return ray;
  return 'épicerie';
}
function parseQty(str){
  const m = str.trim().match(/^([\d]+(?:[.,]\d+)?)\s*(kg|g|ml|l|un|x|unité|unités)?\s+(.*)$/i);
  if(!m) return null;
  let q = parseFloat(m[1].replace(',','.')); let u = (m[2]||'un').toLowerCase(); let rest = m[3].trim();
  if(u==='kg'){ q*=1000; u='g'; } else if(u==='l'){ q*=1000; u='ml'; } else if(u==='x'||u.startsWith('unit')) u='un';
  let ray = ''; const bar = rest.indexOf('|'); if(bar>=0){ ray = rest.slice(bar+1).trim(); rest = rest.slice(0,bar).trim(); }
  if(!RAYONS.includes(ray)) ray = guessRayon(rest);
  return {q,u,name:rest,ray};
}
function parseIngredients(txt){
  const out = [];
  txt.split(/\n+/).forEach(l => { l = l.trim().replace(/^[-•*]\s*/,''); if(!l) return; const x = parseQty(l); if(x) out.push([x.q,x.u,x.name,x.ray]); });
  return out;
}
function parseDelta(txt){
  const parts = [];
  txt.split(/\n+/).forEach(l => {
    l = l.trim(); if(!l) return;
    const sign = l[0]; if(sign!=='+' && sign!=='-') return;
    const body = l.slice(1).trim();
    const x = parseQty(body);
    if(sign==='+' && x) parts.push(`+${x.q} ${x.u} ${x.name}|${x.ray}`);
    else if(sign==='-') parts.push(x ? `-${x.q} ${x.u} ${x.name}` : `-${body}`);
  });
  return parts.join(' ; ');
}

function saveRecette(){
  const name = $('#nr_n').value.trim(), msg = $('#nr_msg');
  const ing = parseIngredients($('#nr_i').value);
  if(!name){ msg.textContent = 'Donne un nom au plat.'; return; }
  if(allRecipes().some(r => norm(r.n)===norm(name))){ msg.textContent = 'Une recette porte déjà ce nom.'; return; }
  if(!ing.length){ msg.textContent = 'Ajoute au moins un ingrédient, par exemple « 900 g poitrines de poulet ».'; return; }
  let mots = $('#nr_m').value.split(',').map(x => x.trim()).filter(Boolean);
  if(!mots.length) mots = ing.filter(x => x[3]==='viandes' || x[3]==='poissonnerie').map(x => x[2].replace(/\(.*\)/,'').trim().split(/\s+/).slice(-2).join(' '));
  if(!mots.length) mots = [name.split(/[ ,]+/)[0]];
  const e = $('#nr_d').checked ? '👿☃️' : '';
  S.custom.push({n:name, e, m:mots, t:$('#nr_t').value, tm:+$('#nr_tm').value, sf:$('#nr_f').value, sv:$('#nr_v').value, nw:true, c:true, i:ing, s:$('#nr_s2').value.trim(), v:[]});
  openRec.delete('__new'); openRec.add(name);
  save(); render();
}
function saveSide(){
  const n = $('#ns_n').value.trim(), msg = $('#ns_msg'), ing = parseIngredients($('#ns_i').value);
  if(!n || !ing.length){ msg.textContent = 'Donne un nom et au moins un ingrédient.'; return; }
  S.sidesx = S.sidesx||[]; S.sidesx.push({id:'x'+Date.now().toString(36), n, sl:$('#ns_k').value, ty:['all'], i:ing});
  openRec.delete('__side'); save(); render();
}
function addVariante(btn){
  const box = btn.closest('details'); const rn = btn.dataset.r;
  const n = box.querySelector('.vn_n').value.trim(); if(!n) return;
  const d = box.querySelector('.vn_d').value.trim();
  const delta = parseDelta(box.querySelector('.vn_c').value);
  (S.varx[rn] = S.varx[rn] || []).push([d ? n+' : '+d : n, delta]);
  openRec.add(rn); save(); render();
}

/* ---------- navigation et rendu global ---------- */
let tab = 'menu';
function render(){
  renderMenu(); renderEpicerie(); renderMaison(); renderRecettes(); renderReglages(); renderAide();
  ['menu','epicerie','maison','recettes','reglages','aide'].forEach(t => $('#tab-'+t).hidden = t!==tab);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t===tab));
  const n = S.menu.items.length && !S.menu.achete ? buyList().rows.filter(r => !S.menu.chk[r.k]).length : 0;
  const bg = $('#bgl'); bg.hidden = !n; bg.textContent = n;
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; tab = b.dataset.t; render(); window.scrollTo(0,0); });

/* ---------- actions ---------- */
function arm(btn, label, fn){
  if(btn.dataset.armed==='1'){ fn(); return; }
  btn.dataset.armed='1'; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent = old; } }, 3500);
}
function terminerSemaine(){
  needs().forEach(n => {
    if(isMaison(n.name)) return;
    const sk = stockKey(n); const st = sk ? S.stock[sk] : null; if(!st) return;
    st.q = Math.max(0, st.q - n.q); if(st.q <= 0.001) delete S.stock[sk];
  });
  S.hist.push({date:S.menu.date, items:S.menu.items.map(x => ({r:x.r, v:x.v, sf:x.sf||'', sv:x.sv||''}))});
  S.hist = S.hist.slice(-26);
  S.menu = {date:'', items:[], chk:{}, extra:{}, achete:false, snap:null, useup:{}};
  S.spec = [];
  save(); tab = 'menu'; render(); window.scrollTo(0,0);
}
function epicerieFaite(){
  const {rows} = buyList();
  rows.forEach(r => {
    if(!S.menu.chk[r.k]) return;
    const o = S.stock[r.k]; if(o) o.q += r.buy; else S.stock[r.k] = {name:r.name, u:r.u, q:r.buy, rayon:r.rayon};
  });
  S.menu.snap = rows.map(r => ({name:r.name, u:r.u, buy:r.buy, ok:!!S.menu.chk[r.k]}));
  S.menu.achete = true; save(); render();
}
function ajouterSpeciaux(){
  const store = $('#spstore').value; const lines = $('#sptxt').value.split(/\n+/).map(x => x.trim()).filter(x => x.length>=4 && x.length<=140);
  const mots = new Set(allRecipes().flatMap(r => r.m.map(norm)));
  const keep = lines.filter(l => { const n = norm(l); return [...mots].some(m => m.length>=4 && n.includes(m)); });
  const known = new Set(S.spec.map(s => s.s+'|'+norm(s.t)));
  let added = 0;
  keep.forEach(l => { const k = store+'|'+norm(l); if(!known.has(k)){ S.spec.push({s:store, t:l}); added++; } });
  S.spec = S.spec.slice(-120);
  save(); render();
  const msg = $('#spmsg'); if(msg) msg.textContent = `${added} spéciaux retenus sur ${lines.length} lignes.`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[id],[data-a]'); if(!t) return;
  const a = t.dataset.a, id = t.id;
  if(id==='gen'){ if(S.menu.items.length && t.dataset.armed!=='1'){ arm(t,'Confirmer', ()=>{}); return; } genMenu(); return; }
  if(id==='addbtn'){ const n = $('#addsel').value; const r = byName(n); if(r){ S.menu.items.push(mkItem(r, usedSides(S.menu.items), pickVar(r))); save(); render(); } return; }
  if(id==='fin'){ arm(t,'Confirmer : terminer la semaine', terminerSemaine); return; }
  if(id==='achete'){ epicerieFaite(); return; }
  if(id==='spadd'){ ajouterSpeciaux(); return; }
  if(id==='spclr'){ S.spec = []; save(); render(); return; }
  if(id==='hclr'){ arm(t,'Confirmer', () => { S.hist = []; save(); render(); }); return; }
  if(id==='reset'){ arm(t,'Confirmer : tout effacer', () => { S = DEFAULT(); save(); render(); }); return; }
  if(id==='help_btn'||id==='help_open'){ tab='aide'; S.help=true; save(); render(); window.scrollTo(0,0); return; }
  if(id==='help_hide'){ S.help=true; save(); render(); return; }
  if(id==='help_back'){ tab='menu'; render(); window.scrollTo(0,0); return; }
  if(id==='sp_go'){ chercherSpeciaux(false); return; }
  if(id==='nr_save'){ saveRecette(); return; }
  const mx = id.match(/^(x[me]_)([lmd])_(share|copy|csv)$/);
  if(mx){ const txt = mx[3]==='csv' ? semaineCsv() : ({l:texteListe,m:texteMenu,d:texteDetail})[mx[2]](); const mid = '#'+mx[1]+'msg';
    if(mx[3]==='share') partager(txt,mid); else if(mx[3]==='copy') copier(txt,mid); else sauver('liste-dulac.csv',txt,mid); return; }
  if(id==='ns_save'){ saveSide(); return; }
  if(id==='go_liste'){ tab='epicerie'; render(); window.scrollTo(0,0); return; }
  if(id==='bk_copy'){ copier(JSON.stringify(S), '#bk_msg'); return; }
  if(id==='bk_file'){ sauver('menu-dulac-sauvegarde.json', JSON.stringify(S), '#bk_msg'); return; }
  if(id==='bk_imp'){ arm(t,'Confirmer : remplacer mes données', () => {
      try{ const o = JSON.parse($('#bk_txt').value); if(!o || typeof o!=='object' || !o.menu || !o.stock) throw 0; S = mergeState(o); save(); render(); }
      catch(e){ const m = $('#bk_msg'); if(m) m.textContent = "Cette sauvegarde n'est pas valide."; t.dataset.armed='0'; t.textContent='Restaurer cette sauvegarde'; } }); return; }
  if(id==='aadd'){
    const name = $('#an').value.trim(), q = parseFloat($('#aq').value), u = $('#au').value;
    if(!name || !(q>0)) return;
    const k = keyOf(name,u); const o = S.stock[k];
    const cat = $('#acat').value; if(o){ o.q += q; if(cat) o.cat = cat; } else S.stock[k] = {name, u, q, rayon:$('#ar').value, cat};
    save(); render(); const am = $('#amsg'); if(am) am.textContent = name+' ajouté. La prochaine planification en tient compte.'; return;
  }
  if(!a) return;
  const i = +t.dataset.i;
  if(a==='swap'){ const keep = S.menu.items.filter((_,j) => j!==i); S.menu.items = fill(S.p.n, keep); save(); render(); }
  else if(a==='gorec'){ e.preventDefault(); tab='recettes'; openRec.add('__new'); render(); window.scrollTo(0,0); }
  else if(a==='lock'){ S.menu.items[i].lock = !S.menu.items[i].lock; save(); render(); }
  else if(a==='setv'){
    const it = S.menu.items[i], r = byName(it.r), nv = +t.dataset.v, old = it.ovr||{}, ov = variantSides(r,nv), used = usedSides(S.menu.items.filter((_,j) => j!==i));
    it.v = nv;
    ['f','v'].forEach(sl => { const key = sl==='f'?'sf':'sv'; if(sl in ov) it[key] = ov[sl]; else if(old[sl]) it[key] = chooseSide(r,sl,used); });
    it.ovr = {f:'f' in ov, v:'v' in ov}; save(); render(); }
  else if(a==='reroll'){ const it = S.menu.items[i], r = byName(it.r), used = usedSides(S.menu.items.filter((_,j) => j!==i)); const ov = variantSides(r,it.v);
    it.sf = 'f' in ov ? ov.f : chooseSide(r,'f',used); used.add(it.sf); it.sv = 'v' in ov ? ov.v : chooseSide(r,'v',used); save(); render(); }
  else if(a==='exing'){ e.preventDefault(); const it = S.menu.items[i]; it.ex = it.ex||[]; const k = t.dataset.k; const p = it.ex.indexOf(k); if(p>=0) it.ex.splice(p,1); else it.ex.push(k); save(); render(); }
  else if(a==='rshare'){ partager(texteRecette(S.menu.items[i], i), '#rmsg_'+i); }
  else if(a==='rshare2'){ const r = byName(t.dataset.r); const fx = x => x==='auto' ? '' : (x||''); partager(texteRecette({r:r.n, v:0, sf:fx(r.sf), sv:fx(r.sv)}, 0), '#rm2_'+t.dataset.x); }
  else if(a==='eat'){ const k = t.dataset.k; if(S.menu.useup[k]) delete S.menu.useup[k]; else S.menu.useup[k] = true; save(); render(); }
  else if(a==='addrec'){ const r = byName(t.dataset.r); if(r){ S.menu.items.push(mkItem(r, usedSides(S.menu.items), pickVar(r))); save(); render(); } }
  else if(a==='keepside'){ const o = S.stock[t.dataset.k]; if(o && !(S.sidesx||[]).some(s => norm(s.n)===norm(o.name))){ (S.sidesx = S.sidesx||[]).push({id:'x'+Date.now().toString(36), n:o.name, sl:o.cat, ty:['all'], i:[[Math.max(1,o.q), o.u, o.name, o.rayon||'épicerie']]}); save(); render(); const am = $('#amsg'); if(am) am.textContent = o.name+' est maintenant un accompagnement permanent (voir Recettes).'; } }
  else if(a==='fav'){ if(S.fav[t.dataset.r]) delete S.fav[t.dataset.r]; else S.fav[t.dataset.r] = true; openRec.add(t.dataset.r); save(); render(); }
  else if(a==='sdel'){ e.preventDefault(); S.sidesx.splice(+t.dataset.i,1); save(); render(); }
  else if(a==='vadd'){ addVariante(t); }
  else if(a==='vdel'){ e.preventDefault(); S.varx[t.dataset.r].splice(+t.dataset.i,1); save(); render(); }
  else if(a==='rdel'){ arm(t,'Confirmer', () => { S.custom = S.custom.filter(r => r.n!==t.dataset.r); delete S.varx[t.dataset.r]; openRec.delete(t.dataset.r); save(); render(); }); }
  else if(a==='rm'){ S.menu.items.splice(i,1); save(); render(); }
  else if(a==='spdel'){ e.preventDefault(); S.spec.splice(i,1); save(); render(); }
  else if(a==='manque'){ const k = t.dataset.k; if(S.menu.extra[k]) delete S.menu.extra[k]; else S.menu.extra[k] = true; save(); render(); }
  else if(a==='stq'){ /* géré au change */ }
  else if(a==='stp' || a==='stm'){ const o = S.stock[t.dataset.k]; if(!o) return; o.q += (a==='stp'?1:-1)*stepOf(o.u); if(o.q<=0) delete S.stock[t.dataset.k]; save(); render(); }
  else if(a==='ladd'){ S[t.dataset.l].push({name:'', q:1, u:'un', r:'épicerie'}); save(); renderReglages(); }
  else if(a==='ldel'){ S[t.dataset.l].splice(i,1); save(); renderReglages(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.a==='chk'){
    if(t.checked) S.menu.chk[t.dataset.k]=true; else delete S.menu.chk[t.dataset.k];
    const it = t.closest('.item'); if(it) it.classList.toggle('done', t.checked);
    const rows = buyList().rows, done = rows.filter(r => S.menu.chk[r.k]).length;
    const pt = $('#pg-t'), pb = $('#pg-b'); if(pt) pt.textContent = `${done} / ${rows.length} dans le panier`; if(pb) pb.style.width = (rows.length?done/rows.length*100:0)+'%';
    const bg = $('#bgl'); const n = rows.length-done; bg.hidden = !n; bg.textContent = n;
    save(); return;
  }
  if(t.dataset.a==='sidesel'){ const it = S.menu.items[+t.dataset.i]; it[t.dataset.s==='f'?'sf':'sv'] = t.value; it.ovr = Object.assign({}, it.ovr, {[t.dataset.s]:false}); save(); render(); return; }
  if(t.dataset.a==='stcat'){ const o = S.stock[t.dataset.k]; if(o){ o.cat = t.value; save(); render(); } return; }
  if(t.dataset.a==='tmsel'){ S.tmx[t.dataset.r] = +t.value; openRec.add(t.dataset.r); save(); render(); return; }
  if(t.dataset.a==='sideq'){ S.menu.items[+t.dataset.i][t.dataset.s==='f'?'fm':'vm'] = parseFloat(t.value); save(); render(); return; }
  if(t.dataset.a==='portions'){ S.menu.items[+t.dataset.i].pt = +t.value; save(); render(); return; }
  if(t.dataset.a==='stq'){ const o = S.stock[t.dataset.k]; const v = parseFloat(String(t.value).replace(',','.')); if(o){ if(v>0) o.q = v; else delete S.stock[t.dataset.k]; save(); render(); } return; }
  if(t.dataset.l){ const row = S[t.dataset.l][+t.dataset.i]; if(!row) return; const f = t.dataset.f; row[f] = f==='q' ? (parseFloat(t.value)||0) : t.value; save(); return; }
  if(t.id==='d_plan'){ S.dates.plan = t.value; save(); return; }
  if(t.id==='d_shop'){ S.dates.shop = t.value; save(); render(); return; }
  if(t.id==='cp_in'){ S.cp = t.value.trim(); save(); return; }
  if(t.id==='relay_in'){ S.relay = t.value.trim(); save(); return; }
  if(t.id==='p_n'){ S.p.n = +t.value; save(); }
  else if(t.id==='p_cool'){ S.p.cool = +t.value; save(); }
  else if(t.id==='p_var'){ S.p.varMode = t.value; save(); }
  else if(t.id==='p_sou'){ S.p.souper = +t.value; save(); render(); }
  else if(t.id==='p_res'){ S.p.restes = +t.value; save(); render(); }
  else if(t.id==='p_tm'){ S.p.maxTm = +t.value; save(); }
  else if(t.id==='p_lg'){ S.p.nLong = +t.value; save(); }
  else if(t.id==='p_j'){ S.p.jours = +t.value; save(); }
  else if(t.id==='maison'){ S.maison = t.value; save(); }
});
document.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.rec){ if(d.open) openRec.add(d.dataset.rec); else openRec.delete(d.dataset.rec); } }, true);
document.addEventListener('input', e => { if(e.target.id==='rfilt'){ rfiltre = e.target.value; const pos = e.target.selectionStart; renderRecettes(); const f = $('#rfilt'); f.focus(); f.setSelectionRange(pos,pos); return; } });
document.addEventListener('input', e => { if(e.target.id==='filt'){ filtre = e.target.value; const pos = e.target.selectionStart; renderMaison(); const f = $('#filt'); f.focus(); f.setSelectionRange(pos,pos); } });


/* ---------- aide ---------- */
function renderAide(){
  const D = (t, body, open) => `<details class="card help" ${open?'open':''}><summary>${t}</summary>${body}</details>`;
  $('#tab-aide').innerHTML = `<button class="btn" id="help_back">← Retour au menu</button>
  <div class="card"><b>À quoi sert cette application</b><p>Elle planifie les soupers de la semaine, tient compte des spéciaux des circulaires, produit <b>une seule liste d'épicerie complète</b> (soupers, déjeuners, lunchs, collations, boissons) et se souvient de ce qu'il reste à la maison, pour ne pas racheter ce que vous avez déjà.</p></div>`
  + D("1. Ouvrir l'application sur l'iPhone (avec Koder)", `<p>L'application est un seul fichier, <b>menu-dulac.html</b>, qui reste sur le téléphone. Elle n'a pas besoin d'internet (sauf pour chercher les spéciaux). Sur iPhone, Fichiers et Safari ne savent pas la faire fonctionner : il faut une application gratuite qui fait tourner les pages web, <b>Koder</b>.</p>
    <ol><li>Installe <b>Koder</b> depuis l'App Store (gratuit).</li>
    <li>Enregistre le fichier <b>menu-dulac.html</b> reçu dans Fichiers.</li>
    <li>Dans Fichiers, touche-le longuement, puis <b>Partager</b> (ou « Copier vers »), puis choisis <b>Koder</b>.</li>
    <li>Ouvre Koder, touche le fichier, puis le bouton <b>Aperçu</b> (Preview). L'application s'affiche.</li>
    <li>Les fois suivantes : Koder, le fichier, <b>Aperçu</b>. Ouvre-la <b>toujours de cette façon</b>.</li></ol>
    <div class="warn"><b>Fais ce test d'abord :</b> dans l'onglet Maison, ajoute un article, ferme complètement Koder, rouvre le fichier avec Aperçu et vérifie que l'article est toujours là. Les données sont liées à cette façon d'ouvrir le fichier : si tu le déplaces, le renommes ou l'ouvres autrement, tu repars à zéro. Copie la sauvegarde (Réglages) de temps en temps.</div>
    <div class="tip">Chaque personne a son propre fichier et ses propres données. <b>Les téléphones ne se synchronisent pas</b> (voir la section 7).</div>`, true)
  + D('2. Première utilisation : préparer les réglages', `<ol>
    <li>Ouvre <b>Réglages</b>. Dans « Menu », choisis le nombre de soupers par semaine, combien de semaines avant de répéter un plat, et le nombre de jours de collations.</li>
    <li>Dans <b>Mes collations, par jour</b>, mets ce que quelqu'un mange chaque jour (sac de noix, fromages, yogourts, brownie). La quantité est multipliée par le nombre de jours.</li>
    <li>Dans <b>Déjeuners, lunchs, collations et boissons</b>, vérifie la liste de ce que la famille achète chaque semaine (lait, œufs, céréales, jus, croustilles…). Modifie les quantités, retire ce dont vous n'avez pas besoin, ajoute des lignes et choisis leur rayon. Les quantités de départ sont des estimations pour 4 personnes.</li>
    <li>Dans <b>Toujours à la maison</b>, garde les articles que vous avez toujours (sel, poivre, huile, ketchup…). Ils n'iront pas dans la liste : ils seront seulement rappelés dans « Vérifier avant de partir ».</li></ol>`)
  + D("3. L'inventaire : ce qu'il y a à la maison", `<p>L'onglet <b>Maison</b> est la mémoire de l'application. Tout ce qui s'y trouve est <b>déduit de la liste d'épicerie</b> et <b>favorise les plats qui l'utilisent</b> quand le menu est créé.</p>
    <ul><li><b>Ajouter un article :</b> en bas de Maison, tape le nom (des suggestions apparaissent), la quantité, l'unité et le rayon. Choisis aussi une <b>catégorie</b> : « Féculent » ou « Légume ou salade » en fait un accompagnement possible (un sac de rouleaux de printemps sera jumelé à un plat, et « Garder comme accompagnement » le conserve pour les semaines suivantes). Exemple : tu achètes 300 g de fromage cheddar pour un lunch → tu l'ajoutes. Au prochain menu, les plats avec du cheddar sont avantagés, et le cheddar est déduit de la liste.</li>
    <li><b>Changer une quantité :</b> tape le nombre exact dans la case, ou utilise − et +. À 0, l'article disparaît.</li>
    <li><b>« À utiliser cette semaine » (onglet Menu) :</b> liste ce qui est en stock mais que le menu n'utilise pas. « Je le mange » le compte comme collation ou lunch (il est retiré à la fin de la semaine); les boutons « + plat » ajoutent une recette qui l'utilise.</li>
    <li>Les noms n'ont pas besoin d'être identiques : « Fromage cheddar » en stock couvre « cheddar râpé » dans une recette (même unité).</li></ul>`)
  + D('4. Faire le menu de la semaine', `<ol>
    <li>Dans <b>Réglages</b>, vérifie les <b>portions au souper</b> (par défaut 5, avec deux ados) et les <b>portions de restes</b> pour le dîner du lendemain (2); tout est calculé avec ces chiffres. Choisis aussi 6 ou 7 soupers par semaine, le <b>temps maximum en semaine</b> (35 min par défaut) et le nombre de soupers <b>plus longs</b> permis (1 par défaut, pour un congé ou la fin de semaine) : tous les autres soupers sont des recettes rapides. Ensuite, dans l'onglet <b>Menu</b>, règle les deux dates : <b>Je planifie le</b> (le jour où tu fais le plan) et <b>J'achète le</b> (le jour de l'épicerie). Si tu planifies le mardi et fais l'épicerie le jeudi, mets la date du jeudi : les spéciaux retenus seront ceux du jeudi.</li>
    <li>Touche <b>Chercher les spéciaux</b>. L'application lit les circulaires Maxi, IGA, Walmart et Inter-Marché. Elle garde seulement les articles liés à vos recettes et à vos essentiels. Si les circulaires du jeudi ne sont pas encore sorties, elle te le dit : relance plus tard, ou utilise les circulaires actuelles.</li>
    <li>Touche <b>Créer le menu</b>. Elle choisit les soupers en favorisant les plats dont les ingrédients sont en spécial ou déjà à la maison, sans répéter les plats récents. Elle limite aussi les pâtes à 2 repas et la même viande à 2 repas.</li>
    <li>Ajuste chaque plat : <b>Garder</b> le verrouille, <b>Autre plat</b> le remplace, <b>Retirer</b> l'enlève. Sous le nom, choisis le <b>féculent</b> et le <b>légume / salade</b> (l'application en propose de différents d'une semaine à l'autre; <b>Autres accompagnements</b> en tire d'autres) et leur <b>quantité</b> : si personne ne mange le légume, mets « Aucun » ou « Moins » et monte le féculent à « Plus ». Le menu « Portions de ce repas » règle la quantité totale. Les pastilles (Normale, Épicée, Nashville…) changent la <b>version</b> du plat : la liste d'épicerie suit. Dans « Recette et ingrédients », « retirer » enlève un ingrédient précis de la liste. « Recette et ingrédients » montre les quantités et la préparation.</li>
    <li>Pour ajouter un plat de la banque, utilise « Ajouter un plat ». <b>Refaire le menu</b> remplace tout sauf les plats « Gardé ».</li></ol>
    <div class="tip">Les recettes d'origine sont écrites pour 6 portions; l'application les ajuste au nombre de portions choisi (souper + restes du lendemain midi). Les œufs, pains et autres unités sont arrondis vers le haut.</div>`)
  + D('5. Faire l\'épicerie une seule fois', `<ol>
    <li>Ouvre l'onglet <b>Épicerie</b>. La liste est classée par rayon. Chaque ligne montre la quantité à acheter et, s'il y a lieu, le spécial (magasin et prix) et combien tu as déjà.</li>
    <li>Regarde la section <b>Vérifier avant de partir</b> : ce sont les articles « toujours à la maison ». Si l'un manque, touche <b>Il manque</b> pour le mettre dans la liste.</li>
    <li>Coche chaque article en le mettant dans le panier. Le compteur de l'onglet baisse.</li>
    <li>De retour à la maison, touche <b>Épicerie terminée</b>. Les articles cochés entrent dans la Maison. Le menu est alors verrouillé.</li></ol>
    <div class="tip">Les prix des spéciaux sont ceux de la circulaire, sans l'unité (par livre, par kg, par paquet). Vérifie le format en magasin.</div>`)
  + D('6. Terminer la semaine : la mémoire des restes', `<p>Quand la semaine est finie, va dans <b>Menu</b> et touche <b>Terminer la semaine</b> (deux touches pour confirmer). L'application :</p>
    <ul><li>retire de la Maison ce qui a été utilisé cette semaine;</li><li>garde les restes;</li><li>range les plats dans l'<b>historique</b> pour ne pas les refaire trop vite, et fait alterner les versions d'un plat à chaque retour.</li></ul>
    <p><b>Exemple :</b> tu achètes 12 œufs et il t'en faut 8. Il en reste 4. La semaine suivante, si le menu en demande 4, il n'y a aucun œuf sur la liste. S'il en faut 6, elle te fait racheter une douzaine.</p>
    <p>Les articles vendus en emballage (œufs, beurre, bacon, lait, pâtes…) sont arrondis à la taille d'un emballage courant. Si la réalité ne correspond pas (tu as mangé moins que prévu), corrige la quantité dans <b>Maison</b>.</p>`)
  + D('7. Envoyer une copie à ta conjointe', `<div class="warn"><b>Rien n'est partagé automatiquement.</b> Chaque téléphone garde ses propres données.</div>
    <p>Dans Menu ou Épicerie, la carte <b>Copier pour envoyer</b> propose trois textes :</p>
    <ul><li><b>Liste d'épicerie seulement</b>, classée par rayon;</li><li><b>Menu de la semaine</b> : les plats, versions et accompagnements;</li><li><b>Menu détaillé</b> : chaque recette avec ingrédients et préparation.</li></ul>
    <p>Touche <b>Copier</b>, puis colle le texte dans un message ou dans Notes. Si la copie est bloquée, le texte s'affiche : touche-le longuement pour le sélectionner. Chaque repas (Menu) et chaque recette (Recettes) a aussi son bouton <b>Copier</b>.</p>`)
  + D('8. Ajouter des recettes et des variantes', `<ul><li>Ouvre l'onglet <b>Recettes</b> puis « Nouvelle recette » (aussi accessible par le lien dans « Ajouter un plat » du Menu).</li>
    <li>Écris le nom, coche « Les garçons aiment ce plat » au besoin, choisis le <b>type de plat</b> et les accompagnements par défaut (ou « Auto » pour qu'ils varient), et les <b>ingrédients pour 6 portions, un par ligne</b>, par exemple :<br><i>900 g poitrines de poulet<br>500 ml crème 35%<br>2 oignons<br>0,3 kg riz</i><br>Écris la quantité, l'unité (g, kg, ml, L, ou rien pour des unités), puis le nom. Le rayon est deviné; ajoute « | viandes » à la fin d'une ligne pour le choisir.</li>
    <li>Les « mots de la circulaire » servent à trouver les spéciaux (ex. : poulet, crème). S'ils sont vides, l'application les déduit des viandes.</li>
    <li><b>Variante :</b> ouvre une recette dans la liste, puis « Ajouter une variante ». Donne un nom (Épicée, Nashville…) et, au besoin, les changements d'ingrédients : une ligne <i>+ 250 ml babeurre</i> pour ajouter, <i>- sauce BBQ</i> pour retirer, <i>- 250 ml crème</i> pour en réduire la quantité.</li>
    <li><b>Accompagnement :</b> « Nouvel accompagnement » en haut de Recettes (nom, féculent ou légume, ingrédients).</li>
    <li><b>Temps et favoris :</b> chaque recette a un temps total modifiable (la durée influence le menu) et un bouton « Ajouter aux favoris » : les favoris reviennent plus souvent.</li>
    <li>Une recette que tu as créée peut être supprimée. Les recettes d'origine, non.</li></ul>`)
  + D('9. Si la recherche des spéciaux ne fonctionne pas', `<ul><li>Vérifie que le téléphone est en ligne et que le <b>code postal</b> est le bon (Menu → « Si la recherche ne fonctionne pas »).</li>
    <li>Certains navigateurs bloquent la requête vers Flipp. Dans ce cas, ouvre <a href="https://flipp.com/fr-ca" target="_blank" rel="noopener">Flipp</a>, copie le texte de la circulaire, colle-le dans la zone prévue, choisis le magasin et touche <b>Ajouter ces spéciaux</b>. Seules les lignes liées à tes recettes sont gardées.</li>
    <li>Sans spéciaux, tout fonctionne : le menu est simplement choisi sans tenir compte des rabais.</li></ul>`)
  + D('10. Sauvegarder et ne rien perdre', `<ul><li>Les données sont enregistrées dans le navigateur de ce téléphone, à chaque action.</li>
    <li>Elles peuvent disparaître si tu effaces les données de Safari, si tu désinstalles l'icône, ou si Safari les nettoie après environ 7 jours sans utilisation (c'est moins probable avec l'icône de l'écran d'accueil).</li>
    <li><b>Habitude conseillée :</b> une fois par mois, dans Réglages, touche « Copier la sauvegarde » et colle-la dans un message à toi-même ou dans Notes.</li></ul>`)
  + D('11. Questions fréquentes', `<p><b>Le menu ne change pas quand je touche « Refaire le menu ».</b> Les plats « Gardé » restent. Retire le verrouillage si tu veux les remplacer. Une fois l'épicerie terminée, le menu est verrouillé jusqu'à « Terminer la semaine ».</p>
    <p><b>Un article de la liste existe en double.</b> Si deux recettes nomment un même article différemment (par exemple « boeuf haché » et « boeuf haché ou poulet haché »), il apparaît deux fois. Additionne-les en magasin.</p>
    <p><b>La liste est trop longue ou trop courte.</b> Les quantités sont des estimations. Corrige les essentiels dans Réglages et le stock dans Maison.</p>
    <p><b>Je veux tout recommencer.</b> Réglages → « Tout remettre à zéro » (efface menu, stock et historique, pas les recettes que tu as ajoutées).</p>`);
}


/* ---------- démarrage ---------- */
(function init(){
  try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  loadLocal();
  if(!S.auto && BUNDLED) S.auto = {items:(BUNDLED.items||[]).map(i => Object.assign({}, i, {vt:BUNDLED.valide||''})), maj:BUNDLED.maj||'', src:'Flipp (copie intégrée)'};
  render();
  setSync('Enregistré sur cet appareil');
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>
