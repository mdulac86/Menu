 déglacer au vin blanc","+125 ml vin blanc ou bouillon|épicerie","Déglacer au vin avant le bouillon."],["Sur pâtes : servi sur des tagliatelles","+500 g tagliatelles|épicerie ; @f=aucun","Cuire les pâtes et les napper de sauce."]]},{"n":"Fajitas de poulet","e":"","k":"souper","pr":"poulet","st":["mex"],"t":"mex","tm":30,"sf":"riz_blanc","sv":"guacamole","m":["poulet","poivrons"],"nw":true,"i":[[900.0,"g","poitrines de poulet","viandes"],[3.0,"un","poivrons","fruits et légumes"],[2.0,"un","oignons","fruits et légumes"],[30.0,"ml","assaisonnement à fajitas","garde-manger"],[12.0,"un","tortillas","boulangerie"],[250.0,"ml","crème sure","produits laitiers"],[200.0,"g","fromage râpé","produits laitiers"]],"s":"Trancher le poulet, les poivrons et les oignons en lanières. Mélanger le poulet avec l'assaisonnement à fajitas et un filet d'huile. Dans une grande poêle très chaude, saisir le poulet 5 à 6 min, jusqu'à ce qu'il soit cuit, puis le réserver. Sauter les poivrons et les oignons 5 min, jusqu'à ce qu'ils soient tendres-croquants. Remettre le poulet et mélanger. Réchauffer les tortillas et servir avec la crème sure et le fromage.","v":[["Épicées : jalapeños et sauce piquante","+2 un piments jalapeños|fruits et légumes ; +30 ml sauce piquante|épicerie","Ajouter les jalapeños avec les légumes."],["Bol fajitas : sans tortilla, sur du riz","-tortillas ; @f=riz_blanc","Servir la garniture sur le riz avec les accompagnements."],["Quesadillas fajitas : tortillas pliées et grillées","+200 g fromage râpé|produits laitiers","Garnir les tortillas de fromage et de poulet, plier et griller 2 min par côté."]]},{"n":"Salade-repas au poulet croustillant","e":"","k":"souper","pr":"poulet","st":["salade"],"t":"complet","tm":25,"sf":"","sv":"","m":["poulet","laitue"],"nw":true,"i":[[700.0,"g","filets de poulet panés surgelés","surgelés"],[2.0,"un","coeurs de romaine","fruits et légumes"],[1.0,"un","concombre","fruits et légumes"],[250.0,"g","tomates cerises","fruits et légumes"],[125.0,"ml","vinaigrette ranch","épicerie"],[150.0,"g","fromage râpé","produits laitiers"]],"s":"Cuire les filets de poulet au four selon l'emballage, environ 20 min à 425 °F, en les retournant à mi-cuisson. Pendant ce temps, laver la romaine et la couper en morceaux, trancher le concombre et couper les tomates cerises en deux. Mettre les légumes dans un grand bol avec la vinaigrette et mélanger. Trancher les filets chauds et les déposer sur la salade avec le fromage.","v":[["César : vinaigrette césar, parmesan et croûtons","-vinaigrette ranch ; +125 ml vinaigrette césar|épicerie ; +100 g croûtons|boulangerie","Remplacer la vinaigrette et ajouter les croûtons au service."],["Buffalo : poulet enrobé de sauce piquante","+60 ml sauce Buffalo|épicerie","Enrober le poulet chaud de sauce Buffalo."],["Mexicaine : maïs, haricots noirs et salsa","+1 un boîtes de haricots noirs|épicerie ; +1 un boîtes de maïs en grains|épicerie ; +250 ml salsa|épicerie","Ajouter maïs, haricots égouttés et salsa à la salade."]]},{"n":"Poulet à l'érable et à la moutarde","e":"","k":"souper","pr":"poulet","st":["poele"],"t":"viande","tm":35,"sf":"patates_pilees","sv":"carottes","m":["poulet","érable"],"nw":true,"i":[[6.0,"un","hauts de cuisses de poulet désossés","viandes"],[60.0,"ml","sirop d'érable","épicerie"],[45.0,"ml","moutarde à l'ancienne","épicerie"],[30.0,"ml","vinaigre de cidre","épicerie"],[15.0,"ml","huile végétale","garde-manger"]],"s":"Éponger les hauts de cuisses, saler et poivrer. Dans une grande poêle, chauffer l'huile à feu moyen-vif et saisir le poulet 5 min par côté, jusqu'à ce qu'il soit bien doré. Mélanger le sirop d'érable, la moutarde et le vinaigre. Baisser à feu doux, verser la sauce sur le poulet et laisser glacer 10 min en retournant les morceaux, jusqu'à ce que la sauce soit sirupeuse et le poulet cuit (165 °F).","v":[["Épicé : ajouter du piment","+5 ml flocons de piment|garde-manger","Ajouter les flocons au glaçage."],["Au four : cuisses sur plaque, glaçage au pinceau","","Cuire sur plaque à 425°F 25 min en badigeonnant à mi-cuisson."],["Aux pommes : quartiers de pommes poêlés","+2 un pommes|fruits et légumes","Faire dorer les pommes dans la poêle avant de glacer."]],"tp":20},{"n":"Poulet à la grecque en plaque","e":"","k":"souper","pr":"poulet","st":["four"],"t":"viande","tm":40,"sf":"grelots","sv":"salade_grecque","m":["poulet","citron"],"nw":true,"i":[[1000.0,"g","pilons de poulet","viandes"],[2.0,"un","citrons","fruits et légumes"],[4.0,"un","gousses d'ail","fruits et légumes"],[30.0,"ml","origan séché","garde-manger"],[60.0,"ml","huile d'olive","garde-manger"],[100.0,"g","olives Kalamata","épicerie"]],"s":"Préchauffer le four à 425 °F. Hacher l'ail. Dans un grand bol, mélanger les pilons avec l'huile d'olive, le jus des citrons, l'ail, l'origan, 5 ml de sel et du poivre. Étaler sur une grande plaque, en ajoutant les citrons pressés coupés en quartiers. Rôtir 35 min en retournant à mi-cuisson, jusqu'à ce que la peau soit dorée et la viande à 175 °F près de l'os. Ajouter les olives les 5 dernières minutes.","v":[["Avec feta : feta émiettée en fin de cuisson","+150 g feta|produits laitiers","Parsemer de feta au service."],["Aux légumes : poivrons et courgettes sur la plaque","+2 un poivrons|fruits et légumes ; +2 un courgettes|fruits et légumes","Ajouter les légumes en gros morceaux dès le début."],["Pitas souvlaki : poulet effiloché dans des pitas","+6 un pitas|boulangerie ; @f=aucun","Désosser le poulet et servir dans des pitas avec tzatziki."]],"tp":10},{"n":"Pâtes au poulet et pesto","e":"","k":"souper","pr":"poulet","st":["pates"],"t":"pates","tm":25,"sf":"pain_ail","sv":"salade_cesar","m":["poulet","pâtes"],"nw":true,"i":[[700.0,"g","poitrines de poulet","viandes"],[500.0,"g","rotini","épicerie"],[150.0,"ml","pesto au basilic","épicerie"],[250.0,"g","tomates cerises","fruits et légumes"],[100.0,"g","parmesan râpé","produits laitiers"]],"s":"Porter une grande casserole d'eau salée à ébullition et cuire les rotini selon l'emballage, en gardant 125 ml d'eau de cuisson. Couper le poulet en dés, saler et poivrer. Dans une grande poêle, dorer le poulet dans un filet d'huile 6 min, jusqu'à ce qu'il soit cuit. Ajouter les tomates cerises coupées en deux et cuire 2 min. Ajouter les pâtes, le pesto et un peu d'eau de cuisson, et mélanger hors du feu. Servir avec le parmesan.","v":[["Crémeux : ajouter de la crème","+125 ml crème 15%|produits laitiers","Incorporer la crème avec le pesto."],["Aux épinards : épinards frais fondus","+200 g épinards|fruits et légumes","Ajouter les épinards à la fin et laisser fondre."],["Aux pignons : pignons grillés","+60 g pignons|épicerie","Griller les pignons à sec et parsemer."]]},{"n":"Chow mein au poulet","e":"","k":"souper","pr":"poulet","st":["asia"],"t":"riz","tm":25,"sf":"","sv":"","m":["poulet","nouilles"],"nw":true,"i":[[700.0,"g","poitrines de poulet","viandes"],[450.0,"g","nouilles chow mein","épicerie"],[600.0,"g","légumes mélangés surgelés","surgelés"],[90.0,"ml","sauce soya","épicerie"],[30.0,"ml","sauce hoisin","épicerie"],[15.0,"ml","huile de sésame","épicerie"]],"s":"Cuire les nouilles selon l'emballage, les rincer à l'eau froide et bien les égoutter. Couper le poulet en fines lanières. Mélanger la sauce soya, la sauce hoisin et l'huile de sésame. Dans un wok très chaud avec un filet d'huile, sauter le poulet 4 à 5 min, jusqu'à ce qu'il soit cuit. Ajouter les légumes surgelés et sauter 3 min. Ajouter les nouilles et les sauces, et sauter 3 min en remuant avec deux spatules pour bien enrober.","v":[["Aux crevettes : crevettes à la place du poulet","-poitrines de poulet ; +600 g crevettes crues décortiquées|poissonnerie","Saisir les crevettes 3 min seulement."],["Végé : tofu ferme et oeufs","-poitrines de poulet ; +450 g tofu ferme|produits laitiers ; +3 un oeufs|produits laitiers","Faire dorer le tofu en cubes et brouiller les oeufs dans le wok."],["Épicé : sauce sriracha","+30 ml sauce sriracha|épicerie","Ajouter avec les sauces."]]},{"n":"Poulet effiloché à la mijoteuse","e":"","k":"souper","pr":"poulet","st":["mijote"],"t":"sandwich","tm":375,"sf":"chips","sv":"salade_chou","m":["poulet","bbq"],"nw":true,"i":[[1200.0,"g","poitrines de poulet","viandes"],[375.0,"ml","sauce BBQ","épicerie"],[1.0,"un","oignon","fruits et légumes"],[60.0,"ml","cassonade","garde-manger"],[8.0,"un","pains à hamburger","boulangerie"]],"s":"Le matin, hacher l'oignon et le mettre dans la mijoteuse. Déposer les poitrines par-dessus. Mélanger la sauce BBQ et la cassonade et verser sur le poulet. Cuire 6 h à faible intensité, jusqu'à ce que le poulet se défasse facilement. Effilocher le poulet dans la mijoteuse à deux fourchettes et bien mélanger avec la sauce. Griller légèrement les pains et les garnir.","v":[["Salsa verde : poulet effiloché façon tacos","-sauce BBQ ; +500 ml salsa verde|épicerie ; -pains à hamburger ; +12 un tortillas|boulangerie","Cuire avec la salsa verde et servir en tacos."],["Buffalo : sauce piquante et ranch","-sauce BBQ ; +250 ml sauce Buffalo|épicerie","Remplacer la sauce BBQ par la sauce Buffalo."],["Sur patates : servi sur une patate au four","-pains à hamburger ; +6 un grosses pommes de terre|fruits et légumes ; @f=aucun","Cuire les patates au four 1 h à 400°F et garnir de poulet."]],"tp":15,"mj":1},{"n":"Boeuf et brocoli sauté","e":"","k":"souper","pr":"boeuf","st":["asia"],"t":"riz","tm":25,"sf":"riz_blanc","sv":"","m":["boeuf","brocoli"],"nw":true,"i":[[700.0,"g","bavette de boeuf","viandes"],[600.0,"g","brocoli","fruits et légumes"],[90.0,"ml","sauce soya","épicerie"],[30.0,"ml","cassonade","garde-manger"],[15.0,"ml","fécule de maïs","garde-manger"],[3.0,"un","gousses d'ail","fruits et légumes"]],"s":"Trancher la bavette très finement à contre-fil (10 min au congélateur aide). Mélanger la sauce soya, la cassonade, la fécule de maïs et 60 ml d'eau, et y mariner le boeuf 10 min. Couper le brocoli en bouquets et hacher l'ail. Dans un wok très chaud avec un filet d'huile, cuire le brocoli 2 min avec 60 ml d'eau, à couvert, puis le retirer. Retirer le boeuf de la marinade (garder la marinade) et le saisir en deux fois 1 à 2 min. Ajouter l'ail 30 s, remettre le brocoli et la marinade, et cuire 1 à 2 min jusqu'à ce que la sauce épaississe.","v":[["Gingembre : gingembre frais râpé","+15 ml gingembre frais|fruits et légumes","Ajouter avec l'ail."],["Aux poivrons : poivrons au lieu d'une partie du brocoli","+2 un poivrons|fruits et légumes","Ajouter les poivrons en lanières."],["Sur nouilles : nouilles aux oeufs","+450 g nouilles aux oeufs|épicerie ; @f=aucun","Cuire les nouilles et mélanger au wok."]]},{"n":"Boulettes suédoises","e":"","k":"souper","pr":"boeuf","st":["mijote"],"t":"viande","tm":35,"sf":"patates_pilees","sv":"pois","m":["boeuf","boulettes"],"nw":true,"i":[[900.0,"g","boeuf haché","viandes"],[1.0,"un","oeuf","produits laitiers"],[125.0,"ml","chapelure","épicerie"],[500.0,"ml","bouillon de boeuf","épicerie"],[250.0,"ml","crème 15%","produits laitiers"],[30.0,"g","beurre","produits laitiers"],[30.0,"ml","farine","garde-manger"]],"s":"Mélanger le boeuf, l'oeuf, la chapelure, 5 ml de sel, du poivre et une pincée de muscade, sans trop pétrir. Former des boulettes de 3 cm. Dans une grande poêle, fondre le beurre et dorer les boulettes à feu moyen 8 min en les tournant, puis les réserver. Saupoudrer la farine dans le gras de la poêle et cuire 1 min. Verser le bouillon peu à peu en fouettant, puis la crème. Remettre les boulettes et mijoter 10 min à feu doux, jusqu'à ce que la sauce nappe la cuillère et les boulettes soient cuites.","v":[["Confiture d'airelles : service classique avec confiture","+1 un pots de confiture d'airelles|épicerie","Servir avec la confiture."],["Aux champignons : champignons dans la sauce","+250 g champignons|fruits et légumes","Faire dorer les champignons avant la sauce."],["Sur nouilles : nouilles aux oeufs","+450 g nouilles aux oeufs|épicerie ; @f=aucun","Servir sur les nouilles."]],"tp":30},{"n":"Bols burrito au boeuf","e":"","k":"soupe r les côtelettes, saler et poivrer. Dans une grande poêle, chauffer l'huile à feu moyen-vif et saisir les côtelettes 4 min par côté. Baisser à feu moyen, badigeonner de sauce et cuire encore 2 min de chaque côté, jusqu'à 145 °F au centre. Laisser reposer 5 min.","v":[["Moutarde-miel : glaçage moutarde et miel","-sauce BBQ ; +60 ml moutarde de Dijon|épicerie","Remplacer la BBQ par la moutarde."],["Piquantes : sauce piquante","+30 ml sauce piquante|épicerie","Ajouter au glaçage."],["Aux pommes : pommes poêlées","+2 un pommes|fruits et légumes","Faire dorer des quartiers de pommes à côté."]]},{"n":"Porc effiloché à la mijoteuse","e":"","k":"souper","pr":"porc","st":["mijote"],"t":"sandwich","tm":495,"sf":"chips","sv":"salade_chou","m":["porc","effiloché"],"nw":true,"i":[[1500.0,"g","épaule de porc","viandes"],[375.0,"ml","sauce BBQ","épicerie"],[125.0,"ml","bouillon de poulet","épicerie"],[45.0,"ml","cassonade","garde-manger"],[8.0,"un","pains à hamburger","boulangerie"]],"s":"Le matin, retirer l'excédent de gras de l'épaule, la saler et la poivrer. La déposer dans la mijoteuse. Mélanger le bouillon, la cassonade et la moitié de la sauce BBQ, et verser sur la viande. Cuire 8 h à faible intensité, jusqu'à ce que la viande se défasse à la fourchette. Retirer l'os et le gras, effilocher la viande et la remettre avec un peu du jus de cuisson et le reste de la sauce BBQ. Griller les pains et les garnir de porc et de salade de chou.","v":[["Style carnitas : jus d'orange et cumin pour tacos","-sauce BBQ ; +125 ml jus d'orange|épicerie ; +15 ml cumin|garde-manger ; -pains à hamburger ; +12 un tortillas|boulangerie","Cuire avec jus d'orange et cumin, dorer les filaments à la poêle."],["À l'érable : sirop d'érable et moutarde","-cassonade ; +90 ml sirop d'érable|épicerie ; +30 ml moutarde|épicerie","Remplacer la cassonade."],["Sur patates : servi sur patates au four","-pains à hamburger ; +6 un grosses pommes de terre|fruits et légumes ; @f=aucun","Garnir des patates cuites au four."]],"rs":{"lbl":"porc effiloché","w":["porc effiloche"],"x":[[700.0,"g","épaule de porc","viandes"]]},"tp":15,"mj":1},{"n":"Saucisses et patates à la poêle","e":"","k":"souper","pr":"porc","st":["poele"],"t":"viande","tm":30,"sf":"","sv":"haricots_verts","m":["porc","saucisse"],"nw":true,"i":[[8.0,"un","saucisses italiennes","viandes"],[900.0,"g","pommes de terre grelots","fruits et légumes"],[2.0,"un","oignons","fruits et légumes"],[2.0,"un","poivrons","fruits et légumes"],[30.0,"ml","huile d'olive","garde-manger"]],"s":"Couper les grelots en deux et les cuire 8 min dans l'eau bouillante salée, puis les égoutter. Couper les saucisses en tronçons, les oignons en quartiers et les poivrons en lanières. Dans une grande poêle, chauffer l'huile à feu moyen-vif et dorer les saucisses 5 min. Ajouter les patates, les oignons et les poivrons. Cuire 15 min en remuant de temps en temps, jusqu'à ce que tout soit doré et les saucisses cuites. Assaisonner de sel, de poivre et de paprika.","v":[["Saucisses fumées : saucisses fumées et moutarde","-saucisses italiennes ; +600 g saucisses fumées|viandes ; +30 ml moutarde|épicerie","Remplacer les saucisses."],["Au chou : chou émincé","+400 g chou vert|fruits et légumes","Ajouter le chou avec les oignons."],["Au four : tout sur une plaque","","Rôtir sur plaque à 425°F 30 min."]]},{"n":"Pâtes crémeuses au jambon","e":"","k":"souper","pr":"porc","st":["pates"],"t":"pates","tm":25,"sf":"pain_ail","sv":"pois","m":["porc","jambon"],"nw":true,"i":[[400.0,"g","jambon en dés","viandes"],[500.0,"g","penne","épicerie"],[375.0,"ml","crème 15%","produits laitiers"],[200.0,"g","cheddar râpé","produits laitiers"],[250.0,"g","petits pois surgelés","surgelés"]],"s":"Porter une grande casserole d'eau salée à ébullition et cuire les penne selon l'emballage, en ajoutant les petits pois les 3 dernières minutes. Pendant ce temps, dans une grande poêle, chauffer la crème avec le jambon à feu moyen, sans faire bouillir. Ajouter le cheddar et remuer jusqu iers"],[250.0,"g","gruyère râpé","produits laitiers"]],"s":"Préchauffer le four à 375 °F. Foncer deux assiettes à tarte avec les abaisses, piquer le fond à la fourchette et précuire 10 min. Couper le bacon en morceaux et le cuire jusqu'à ce qu'il soit croustillant, puis l'égoutter. Répartir le bacon et le gruyère dans les croûtes. Fouetter les oeufs, la crème, du sel, du poivre et une pincée de muscade, et verser dans les croûtes. Cuire 30 min, jusqu'à ce que le centre soit pris et le dessus doré. Laisser reposer 10 min avant de couper.","v":[["Poireaux : poireaux fondus","+2 un poireaux|fruits et légumes","Faire fondre les poireaux et les ajouter."],["Épinards et feta : version végé","-bacon ; +200 g épinards|fruits et légumes ; +150 g feta|produits laitiers","Faire tomber les épinards et les égoutter."],["Jambon-brocoli : jambon et brocoli","-bacon ; +300 g jambon en dés|viandes ; +300 g brocoli|fruits et légumes","Précuire le brocoli 3 min."]],"tp":15},{"n":"Soupe aux pois à la mijoteuse","e":"","k":"souper","pr":"porc","st":["mijote"],"t":"complet","tm":495,"sf":"","sv":"","m":["porc","pois","jambon"],"nw":true,"i":[[500.0,"g","pois jaunes secs","épicerie"],[400.0,"g","jambon en dés","viandes"],[3.0,"un","carottes","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[2000.0,"ml","bouillon de poulet","épicerie"],[30.0,"ml","persil séché","garde-manger"]],"s":"La veille, rincer les pois et les faire tremper dans l'eau froide (facultatif, mais ils cuisent plus également). Le matin, égoutter les pois. Hacher l'oignon et couper les carottes en dés. Mettre les pois, le jambon, les légumes, le persil et le bouillon dans la mijoteuse, poivrer. Cuire 8 h à faible intensité, jusqu'à ce que les pois soient défaits. Brasser, saler au goût et allonger d'un peu d'eau si la soupe est trop épaisse.","v":[["Au lard salé : lard salé plutôt que jambon","-jambon en dés ; +300 g lard salé|viandes","Dessaler le lard avant de l'ajouter."],["Soupe verte : pois verts cassés","-pois jaunes secs ; +500 g pois verts cassés|épicerie","Remplacer les pois."],["Végé : sans viande","-jambon en dés ; +2 un patates douces|fruits et légumes","Ajouter des patates douces en dés."]],"ur":["jambon"],"tp":15,"mj":1},{"n":"Saumon à l'érable","e":"","k":"souper","pr":"poisson","st":["four"],"t":"viande","tm":25,"sf":"riz_blanc","sv":"brocoli","m":["poisson","saumon"],"nw":true,"i":[[900.0,"g","filets de saumon","poissonnerie"],[90.0,"ml","sirop d'érable","épicerie"],[45.0,"ml","moutarde de Dijon","épicerie"],[30.0,"ml","sauce soya","épicerie"],[2.0,"un","gousses d'ail","fruits et légumes"]],"s":"Préchauffer le four à 400 °F et tapisser une plaque de papier parchemin. Hacher l'ail et le mélanger avec le sirop d'érable, la moutarde et la sauce soya. Déposer les filets de saumon sur la plaque, côté peau vers le bas. Badigeonner généreusement de sauce. Cuire 12 à 15 min, jusqu'à ce que la chair se défasse à la fourchette (125 à 130 °F au centre). Arroser du reste de sauce au moment de servir.","v":[["Sriracha-miel : glaçage piquant","-sirop d'érable ; +60 ml miel|épicerie ; +15 ml sriracha|épicerie","Remplacer le sirop par miel et sriracha."],["Croûte de noix : noix hachées en croûte","+60 g noix hachées|épicerie","Parsemer de noix avant la cuisson."],["Citron-aneth : citron et aneth","-sirop d'érable ; +1 un citrons|fruits et légumes ; +30 ml aneth|garde-manger","Remplacer la sauce par citron et aneth."]]},{"n":"Saumon teriyaki en papillote","e":"","k":"souper","pr":"poisson","st":["asia"],"t":"riz","tm":25,"sf":"riz_blanc","sv":"legumes_sautes","m":["poisson","saumon","teriyaki"],"nw":true,"i":[[900.0,"g","filets de saumon","poissonnerie"],[90.0,"ml","sauce teriyaki","épicerie"],[400.0,"g","mélange de légumes pour sauté","fruits et légumes"],[15.0,"ml","graines de sésame","garde-manger"]],"s":"Préchauffer le four à 400 °F. Couper des feuilles de papier d'aluminium d'environ 30 cm. Répartir les légumes au centre de chaque feuille, déposer un morceau de saumon par-dessus et arroser de sauce teriyaki. Refermer en papillotes bien scellées et les déposer sur une plaque. Cuire 18 min. Ouvrir avec précaution (vapeur chaude) et parsemer de graines de sésame.","v":[["Gingembre-lime : gingembre et lime","+15 ml gingembre frais|fruits et légumes ; +1 un limes|fruits et légumes","Ajouter au saumon."],["Truite : truite au lieu du saumon","-filets de saumon ; +900 g filets de truite|poissonnerie","Même cuisson."],["Au BBQ : cuire sur le gril","","Cuire les papillotes sur le BBQ 15 min."]]},{"n":"Pâtes aux crevettes et à l'ail","e":"","k":"souper","pr":"poisson","st":["pates"],"t":"pates","tm":25,"sf":"pain_croute","sv":"salade_verte","m":["poisson","crevettes"],"nw":true,"i":[[600.0,"g","crevettes crues décortiquées","poissonnerie"],[500.0,"g","linguine","épicerie"],[60.0,"g","beurre","produits laitiers"],[5.0,"un","gousses d'ail","fruits et légumes"],[1.0,"un","citrons","fruits et légumes"],[60.0,"ml","persil frais","fruits et légumes"]],"s":"Porter une grande casserole d'eau salée à ébullition et cuire les linguine selon l'emballage, en gardant 125 ml d'eau de cuisson. Hacher l'ail et le persil, et râper le zeste du citron. Dans une grande poêle, fondre le beurre à feu moyen et faire revenir l'ail 1 min sans le colorer. Ajouter les crevettes et cuire 2 à 3 min, jusqu'à ce qu'elles soient roses. Ajouter le jus et le zeste du citron. Ajouter les pâtes, le persil et un peu d'eau de cuisson, mélanger, saler et poivrer.","v":[["Rosée : sauce tomate et crème","+250 ml sauce tomate|épicerie ; +125 ml crème 15%|produits laitiers","Ajouter sauce et crème."],["Piquante : flocons de piment","+5 ml flocons de piment|garde-manger","Ajouter avec l'ail."],["Aux tomates cerises : tomates cerises poêlées","+250 g tomates cerises|fruits et légumes","Ajouter avec les crevettes."]]},{"n":"Crevettes à l'ail et riz","e":"","k":"souper","pr":"poisson","st":["poele"],"t":"riz","tm":20,"sf":"riz_blanc","sv":"brocoli","m":["poisson","crevettes"],"nw":true,"i":[[700.0,"g","crevettes crues décortiquées","poissonnerie"],[45.0,"g","beurre","produits laitiers"],[4.0,"un","gousses d'ail","fruits et légumes"],[1.0,"un","citrons","fruits et légumes"],[5.0,"ml","paprika","garde-manger"]],"s":"Cuire le riz si ce n'est pas fait. Éponger les crevettes et les mélanger avec le paprika, du sel et du poivre. Hacher l'ail. Dans une grande poêle, fondre le beurre à feu moyen-vif, ajouter les crevettes en une seule couche et cuire 1 à 2 min par côté. Ajouter l'ail et cuire 1 min en remuant, jusqu'à ce que les crevettes soient roses. Arroser du jus du citron et servir aussitôt sur le riz.","v":[["Cajun : épices cajun","+15 ml assaisonnement cajun|garde-manger","Enrober les crevettes d'épices."],["Noix de coco et lime : lait de coco","+250 ml lait de coco|épicerie ; +1 un limes|fruits et légumes","Ajouter le lait de coco en fin de cuisson."],["Tacos de crevettes : tortillas et salsa","+12 un tortillas|boulangerie ; +250 ml salsa|épicerie ; @f=aucun","Servir dans les tortillas."]]},{"n":"Sandwichs au thon","e":"","k":"souper","pr":"poisson","st":["sandwich"],"t":"sandwich","tm":15,"sf":"chips","sv":"crudites","m":["poisson","thon"],"nw":true,"i":[[4.0,"un","boîtes de thon","épicerie"],[125.0,"ml","mayonnaise","épicerie"],[2.0,"un","branches de céleri","fruits et légumes"],[8.0,"un","pains kaiser","boulangerie"],[200.0,"g","cheddar","produits laitiers"]],"s":"Préchauffer le four à 400 °F. Égoutter le thon et hacher finement le céleri. Mélanger le thon, le céleri et la mayonnaise, saler et poivrer. Ouvrir les pains sur une plaque, les garnir de salade de thon et d'une tranche de cheddar. Passer au four 3 à 4 min, jusqu'à ce que le fromage soit fondu, puis refermer.","v":[["Thon fondu : gratiné au cheddar","","Griller jusqu'à ce que le fromage fonde."],["Aux cornichons : cornichons à l'aneth","+100 g cornichons|épicerie","Hacher et ajouter au thon."],["Salade de thon : en laitue","-pains kaiser ; +1 un laitues|fruits et légumes","Servir en laitue."]]},{"n":"Poisson blanc croustillant au four","e":"","k":"souper","pr":"poisson","st":["four"],"t":"viande","tm":25,"sf":"frites_four","sv":"salade_chou","m":["poisson","aiglefin"],"nw":true,"i":[[900.0,"g","filets de poisson blanc","poissonnerie"],[250.0,"ml","chapelure panko","épicerie"],[60.0,"ml","mayonnaise","épicerie"],[45.0,"ml","moutarde","épicerie"],[1.0,"un","citrons","fruits et légumes"]],"s":"Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin huilé. Éponger le poisson, saler et poivrer. Mélanger la mayonnaise et la moutarde, et en badigeonner le dessus des filets. Presser le panko sur le dessus et arroser d'un filet d'huile. Cuire 12 à 15 min, jusqu'à ce que le panko soit doré et que le poisson se défasse à la fourchette. Servir avec des quartiers de citron.","v":[["Parmesan : panko et parmesan","+60 g parmesan|produits laitiers","Mélanger au panko."],["Cajun : épices cajun","+15 ml assaisonnement cajun|garde-manger","Ajouter au panko."],["Tacos : sauce lime et chou","+12 un tortillas|boulangerie ; +1 un limes|fruits et légumes ; @f=aucun","Servir en tacos."]]},{"n":"Chaudrée de poisson","e":"","k":"souper","pr":"poisson","st":["soupe"],"t":"complet","tm":35,"sf":"pain_croute","sv":"","m":["poisson","chaudrée"],"nw":true,"i":[[700.0,"g","filets de poisson blanc","poissonnerie"],[4.0,"un","pommes de terre","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[750.0,"ml","lait","produits laitiers"],[500.0,"ml","bouillon de poisson ou de légumes","épicerie"],[200.0,"g","bacon","viandes"],[250.0,"g","maïs en grains","surgelés"]],"s":"Couper le bacon en morceaux, hacher l'oignon et couper les pommes de terre en dés de 1 cm. Dans une grande casserole, dorer le bacon à feu moyen, puis ajouter l'oignon et cuire 3 min. Ajouter les pommes de terre et le bouillon, porter à ébullition et cuire 12 min, jusqu'à ce que les patates soient presque tendres. Ajouter le poisson coupé en gros cubes, le maïs et le lait. Mijoter doucement 8 min, sans faire bouillir, jusqu'à ce que le poisson se défasse. Saler, poivrer et ajouter un peu de thym.","v":[["Fruits de mer : crevettes et pétoncles","+250 g crevettes|poissonnerie ; +250 g pétoncles|poissonnerie","Ajouter en fin de cuisson."],["Crémeuse : crème et fines herbes","+125 ml crème 35%|produits laitiers","Ajouter la crème au service."],["Sans bacon : version légère","-bacon","Faire revenir l'oignon à l'huile."]],"tp":20},{"n":"Pad thaï aux crevettes","e":"","k":"souper","pr":"poisson","st":["asia"],"t":"riz","tm":30,"sf":"","sv":"","m":["poisson","crevettes","nouilles"],"nw":true,"i":[[400.0,"g","nouilles de riz","épicerie"],[500.0,"g","crevettes crues décortiquées","poissonnerie"],[3.0,"un","oeufs","produits laitiers"],[90.0,"ml","sauce pad thaï","épicerie"],[250.0,"g","pousses de soya","fruits et légumes"],[60.0,"g","arachides concassées","épicerie"],[2.0,"un","limes","fruits et légumes"]],"s":"Faire tremper les nouilles de riz 10 min dans l'eau très chaude, jusqu'à ce qu'elles soient souples, puis les égoutter. Battre les oeufs. Dans un wok très chaud avec un filet d'huile, saisir les crevettes 2 min, jusqu'à ce qu'elles soient roses. Les pousser sur le côté et brouiller les oeufs. Ajouter les nouilles et la sauce pad thaï, et sauter 2 à 3 min en remuant avec deux spatules, jusqu'à ce que les nouilles soient tendres et enrobées. Ajouter la moitié des pousses de soya. Servir garni du reste des pousses, des arachides et de quartiers de lime.","v":[["Au poulet : poulet à la place","-crevettes crues décortiquées ; +500 g poitrines de poulet|viandes","Saisir le poulet en lanières."],["Tofu : version végé","-crevettes crues décortiquées ; +400 g tofu ferme|produits laitiers","Dorer le tofu en cubes."],["Sans arachides : graines de sésame","-arachides concassées ; +30 ml graines de sésame|garde-manger","Remplacer les arachides."]]},{"n":"Pâtes primavera","e":"","k":"souper","pr":"vege","st":["pates"],"t":"pates","tm":25,"sf":"pain_ail","sv":"","m":["légumes","pâtes"],"nw":true,"i":[[500.0,"g","penne","épicerie"],[2.0,"un","courgettes","fruits et légumes"],[2.0,"un","poivrons","fruits et légumes"],[250.0,"g","tomates cerises","fruits et légumes"],[250.0,"ml","crème 15%","produits laitiers"],[100.0,"g","parmesan râpé","produits laitiers"]],"s":"Porter une grande casserole d'eau salée à ébullition et cuire les penne selon l'emballage. Couper les courgettes en demi-rondelles, les poivrons en lanières et les tomates cerises en deux. Dans une grande poêle, sauter les courgettes et les poivrons dans un filet d'huile d'olive 5 min. Ajouter les tomates et cuire 2 min. Verser la crème et laisser réduire 3 min. Ajouter les pâtes égouttées et le parmesan, mélanger, saler et poivrer.","v":[["Au poulet : poulet ajouté","+500 g poitrines de poulet|viandes","Saisir le poulet en dés avant les légumes."],["À l'huile d'olive et à l'ail : sans crème","-crème 15% ; +60 ml huile d'olive|garde-manger ; +3 un gousses d'ail|fruits et légumes","Remplacer la crème."],["Au pesto : pesto au lieu de la crème","-crème 15% ; +125 ml pesto au basilic|épicerie","Mélanger le pesto aux pâtes."]]},{"n":"Chili végétarien","e":"","k":"souper","pr":"vege","st":["mijote"],"t":"complet","tm":35,"sf":"pain_croute","sv":"","m":["haricots","chili"],"nw":true,"i":[[2.0,"un","boîtes de haricots rouges","épicerie"],[1.0,"un","boîtes de haricots noirs","épicerie"],[900.0,"ml","tomates en dés","épicerie"],[2.0,"un","poivrons","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[30.0,"ml","poudre de chili","garde-manger"],[1.0,"un","boîtes de maïs en grains","épicerie"]],"s":"Hacher l'oignon et couper les poivrons en dés. Dans une grande casserole, faire revenir l'oignon et les poivrons dans un filet d'huile 5 min. Ajouter la poudre de chili et 5 ml de cumin, et cuire 1 min. Ajouter les haricots rincés et égouttés, les tomates et le maïs égoutté. Saler et mijoter 25 min à feu doux, à découvert, en remuant de temps en temps. Servir avec du fromage râpé et de la crème sure, si désiré.","v":[["Aux patates douces : patates douces en dés","+2 un patates douces|fruits et légumes","Ajouter en début de mijotage."],["Avec viande : boeuf haché","+500 g boeuf haché|viandes","Dorer le boeuf avant les légumes."],["À la mijoteuse : cuit toute la journée","","Tout mettre dans la mijoteuse, 6 h à faible intensité."]],"tp":15},{"n":"Quesadillas aux haricots noirs","e":"","k":"souper","pr":"vege","st":["mex"],"t":"mex","tm":20,"sf":"","sv":"guacamole","m":["haricots","fromage"],"nw":true,"i":[[12.0,"un","tortillas","boulangerie"],[1.0,"un","boîtes de haricots noirs","épicerie"],[300.0,"g","fromage râpé","produits laitiers"],[1.0,"un","boîtes de maïs en grains","épicerie"],[250.0,"ml","salsa","épicerie"]],"s":"Rincer et égoutter les haricots noirs et le maïs. Écraser légèrement les haricots à la fourchette avec 5 ml de cumin et une pincée de sel. Étaler les haricots sur la moitié de chaque tortilla, ajouter du maïs et du fromage, puis plier en deux. Dorer dans une grande poêle à feu moyen 2 à 3 min par côté, jusqu'à ce que le fromage soit fondu. Couper en pointes et servir avec la salsa.","v":[["Au poulet : poulet cuit","+400 g poulet cuit|viandes","Ajouter le poulet effiloché."],["Aux épinards : épinards frais","+150 g épinards|fruits et légumes","Ajouter les épinards."],["Déjeuner : oeufs brouillés","+6 un oeufs|produits laitiers","Ajouter des oeufs brouillés."]]},{"n":"Frittata aux légumes","e":"","k":"souper","pr":"vege","st":["poele"],"t":"complet","tm":25,"sf":"patates_four","sv":"salade_verte","m":["oeufs","légumes"],"nw":true,"i":[[10.0,"un","oeufs","produits laitiers"],[125.0,"ml","lait","produits laitiers"],[2.0,"un","poivrons","fruits et légumes"],[200.0,"g","épinards","fruits et légumes"],[150.0,"g","fromage râpé","produits laitiers"],[1.0,"un","oignon","fruits et légumes"]],"s":"Préchauffer le four à 375 °F. Hacher l'oignon et couper les poivrons en dés. Dans une grande poêle allant au four, faire revenir l'oignon et les poivrons dans un filet d'huile 5 min. Ajouter les épinards et remuer jusqu'à ce qu'ils soient tombés. Battre les oeufs avec le lait, 5 ml de sel et du poivre, et verser sur les légumes. Cuire 3 min à feu moyen sans remuer, jusqu'à ce que le bord prenne. Parsemer de fromage et finir au four 12 min, jusqu'à ce que le centre soit pris. Couper en pointes.","v":[["Jambon-fromage : jambon en dés","+250 g jambon cuit|viandes","Ajouter le jambon."],["Pommes de terre : patates en rondelles","+3 un pommes de terre|fruits et légumes","Précuire et ajouter."],["Feta-tomates : feta et tomates","+150 g feta|produits laitiers ; +250 g tomates cerises|fruits et légumes","Ajouter en garniture."]]},{"n":"Riz frit aux légumes et aux oeufs","e":"","k":"souper","pr":"vege","st":["asia"],"t":"riz","tm":20,"sf":"","sv":"","m":["oeufs","riz"],"nw":true,"i":[[500.0,"g","riz cuit refroidi","épicerie"],[5.0,"un","oeufs","produits laitiers"],[500.0,"g","légumes mélangés surgelés","surgelés"],[60.0,"ml","sauce soya","épicerie"],[4.0,"un","oignons verts","fruits et légumes"]],"s":"Utiliser du riz cuit froid : c'est ce qui l'empêche de coller. Battre les oeufs avec une pincée de sel et émincer les oignons verts. Dans un wok très chaud avec un filet d'huile, sauter les légumes surgelés 3 min. Les pousser sur le côté, ajouter un peu d'huile et brouiller les oeufs. Ajouter le riz et le défaire en l'écrasant, puis sauter 4 à 5 min. Arroser de sauce soya, mélanger et garnir d'oignons verts.","v":[["Au jambon : jambon en dés","+250 g jambon cuit|viandes","Ajouter avec le riz."],["Aux crevettes : crevettes","+400 g crevettes crues décortiquées|poissonnerie","Ajouter les crevettes cuites."],["Piquant : sriracha","+30 ml sauce sriracha|épicerie","Ajouter."]]},{"n":"Macaroni au fromage classique","e":"","k":"souper","pr":"vege","st":["pates"],"t":"pates","tm":30,"sf":"","sv":"brocoli","m":["fromage","macaroni"],"nw":true,"i":[[500.0,"g","macaroni","épicerie"],[60.0,"g","beurre","produits laitiers"],[45.0,"ml","farine","garde-manger"],[750.0,"ml","lait","produits laitiers"],[400.0,"g","cheddar fort râpé","produits laitiers"]],"s":"Cuire les macaroni dans l'eau bouillante salée selon l'emballage, puis les égoutter. Dans une grande casserole, fondre le beurre, ajouter la farine et cuire 1 min en fouettant. Verser le lait peu à peu en fouettant et cuire à feu moyen 5 à 6 min, jusqu'à ce que la sauce nappe la cuillère. Hors du feu, ajouter le cheddar et remuer jusqu'à ce qu'il soit fondu. Saler, poivrer et mélanger avec les pâtes.","v":[["Gratiné : chapelure dorée","+125 ml chapelure panko|épicerie","Parsemer et gratiner 10 min."],["Trois fromages : cheddar, gruyère et parmesan","+100 g gruyère|produits laitiers ; +60 g parmesan|produits laitiers","Mélanger les fromages."],["Aux hot-dogs : saucisses tranchées","+6 un saucisses à hot-dog|viandes","Faire dorer et mélanger."]]},{"n":"Gnocchi tomate-basilic","e":"","k":"souper","pr":"vege","st":["pates"],"t":"pates","tm":20,"sf":"pain_croute","sv":"salade_verte","m":["gnocchi","tomate"],"nw":true,"i":[[750.0,"g","gnocchi","épicerie"],[500.0,"ml","sauce tomate","épicerie"],[30.0,"ml","basilic frais","fruits et légumes"],[200.0,"g","mozzarella","produits laitiers"]],"s":"Préchauffer le gril (broil) du four. Porter une grande casserole d'eau salée à ébullition. Chauffer la sauce tomate dans un plat allant au four ou une poêle. Cuire les gnocchis 2 à 3 min, jusqu'à ce qu'ils remontent à la surface, puis les égoutter et les mélanger avec la sauce. Couvrir de mozzarella en tranches ou râpée. Gratiner 4 à 5 min, jusqu'à ce que le fromage soit doré. Parsemer de basilic.","v":[["Saucisse : saucisse italienne","+400 g saucisses italiennes|viandes","Dorer et ajouter."],["Pesto : sauce pesto crémeuse","-sauce tomate ; +125 ml pesto au basilic|épicerie ; +125 ml crème 15%|produits laitiers","Remplacer la sauce."],["Poêlés : gnocchi dorés au beurre","+45 g beurre|produits laitiers","Dorer à la poêle avant la sauce."]]},{"n":"Tofu sauté sauce te à tarte ; +1200 g pommes de terre|fruits et légumes","Couvrir de purée au lieu de la pâte."],["Individuels : en ramequins","","Répartir dans des ramequins couverts d'un rond de pâte; cuire 25 minutes."]],"ur":["poulet cuit"],"tp":25},{"n":"Quesadillas au porc effiloché","e":"","k":"souper","pr":"porc","st":["mex"],"t":"mex","tm":20,"sf":"","sv":"salade_mexicaine","m":["porc","tortillas"],"nw":true,"i":[[600.0,"g","porc effiloché","viandes"],[12.0,"un","tortillas","boulangerie"],[300.0,"g","fromage râpé","produits laitiers"],[250.0,"ml","salsa","épicerie"]],"s":"Réchauffer le porc effiloché 2 min au micro-ondes. Garnir la moitié de chaque tortilla de porc et de fromage, puis plier en deux. Dorer dans une grande poêle à feu moyen 2 min par côté, jusqu'à ce que le fromage soit fondu. Couper en pointes et servir avec la salsa.","v":[["Tacos : en tacos avec chou et lime","+250 g chou rouge|fruits et légumes ; +2 un limes|fruits et légumes","Réchauffer le porc et servir dans les tortillas avec le chou."],["Nachos : gratinés au four","-tortillas ; +1 un sac de croustilles de tortilla|épicerie","Étaler les croustilles, garnir de porc et de fromage, gratiner 8 minutes."]],"ur":["porc effiloche"]},{"n":"Hachis de boeuf aux patates","e":"","k":"souper","pr":"boeuf","st":["poele"],"t":"complet","tm":30,"sf":"","sv":"pois","m":["boeuf"],"nw":true,"i":[[600.0,"g","boeuf cuit","viandes"],[1000.0,"g","pommes de terre","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[250.0,"ml","sauce brune","épicerie"],[30.0,"ml","beurre","produits laitiers"]],"s":"Peler les pommes de terre et les couper en dés de 1 cm. Hacher l'oignon et couper le boeuf cuit en dés. Dans une grande poêle, fondre le beurre avec un filet d'huile à feu moyen-vif. Ajouter les pommes de terre et cuire 15 min en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et tendres, en ajoutant l'oignon à mi-cuisson. Ajouter le boeuf et la sauce brune, et chauffer 5 min. Saler et poivrer.","v":[["Avec o 1 min. Verser la sauce et cuire 3 min, jusqu'à ce qu'elle soit absorbée et caramélisée. Servir sur le riz, garni d'oignons verts.","v":[["Épicé : gochujang","+30 ml pâte de piment gochujang|épicerie",""],["En laitue : wraps de laitue","+1 un laitue Boston|fruits et légumes ; @f=aucun","Servir dans des feuilles de laitue."]]},{"n":"Galettes de saumon","e":"","k":"souper","pr":"poisson","st":["poele"],"t":"viande","tm":25,"sf":"","sv":"salade_verte","m":["saumon"],"nw":true,"i":[[2.0,"un","boîtes de saumon (213 g)","épicerie"],[500.0,"g","pommes de terre","fruits et légumes"],[1.0,"un","oeuf","produits laitiers"],[2.0,"un","oignons verts","fruits et légumes"],[125.0,"ml","chapelure","épicerie"],[125.0,"ml","mayonnaise","épicerie"]],"s":"Peler les pommes de terre, les cuire 15 min dans l'eau salée et les écraser. Laisser tiédir. Égoutter le saumon et retirer la peau et les gros os. Émincer les oignons verts. Mélanger les pommes de terre, le saumon, l'oeuf, les oignons verts, du sel et du poivre. Former des galettes de 2 cm d'épaisseur et les enrober de chapelure. Dorer dans une poêle bien huilée à feu moyen 4 min par côté. Mélanger la mayonnaise avec un trait de jus de citron et servir avec les galettes.","v":[["Au thon : thon en conserve","-boîtes de saumon ; +3 un boîtes de thon|épicerie",""]]},{"n":"Omelette western","e":"","k":"souper","pr":"porc","st":["poele"],"t":"complet","tm":15,"sf":"patates_four","sv":"salade_fruits","m":["oeufs","jambon"],"nw":true,"i":[[12.0,"un","oeufs","produits laitiers"],[200.0,"g","jambon en dés","viandes"],[1.0,"un","poivron","fruits et légumes"],[1.0,"un","oignon","fruits et légumes"],[150.0,"g","cheddar râpé","produits laitiers"],[8.0,"un","tranches de pain","boulangerie"]],"s":"Couper l'oignon et le poivron en petits dés. Dans une grande poêle, faire revenir le jambon, l'oignon et le poivron dans une noix de beurre 5 min, puis les retirer. Battre les oeufs avec du sel et du poivre. Pour chaque omelette, fondre un peu de beurre à feu moyen, verser des oeufs et ramener les bords vers le centre en inclinant la poêle. Quand le dessus est presque pris, garnir de légumes, de jambon et de fromage, puis plier. Griller le pain et servir.","v":[["Végé : champignons et épinards","-jambon en dés ; +200 g champignons|fruits et légumes ; +100 g épinards|fruits et légumes",""]],"ur":["jambon"]},{"n":"Saucisses, purée et sauce à l'oignon","e":"","k":"souper","pr":"porc","st":["poele"],"t":"viande","tm":30,"sf":"patates_pilees","sv":"pois","m":["saucisse"],"nw":true,"i":[[12.0,"un","saucisses de porc","viandes"],[3.0,"un","oignons","fruits et légumes"],[375.0,"ml","bouillon de boeuf","épicerie"],[30.0,"ml","farine","garde-manger"],[30.0,"g","beurre","produits laitiers"]],"s":"Dans une grande poêle, cuire les saucisses à feu moyen 15 min en les tournant souvent, jusqu'à ce qu'elles soient dorées et cuites, puis les réserver au chaud. Émincer les oignons. Dans la même poêle, fondre le beurre et cuire les oignons 10 min à feu moyen-doux, jusqu'à ce qu'ils soient fondants et dorés. Saupoudrer de farine et cuire 1 min. Verser le bouillon en remuant et laisser épaissir 3 à 4 min. Servir les saucisses sur la purée, nappées de sauce à l'oignon.","v":[["Saucisses à l'érable : glacées au sirop","+60 ml sirop d'érable|épicerie","Glacer les saucisses au sirop les 3 dernières minutes."]]},{"n":"Ragoût de boulettes","e":"","k":"souper","pr":"porc","st":["mijote"],"t":"viande","tm":150,"sf":"patates_pilees","sv":"","m":["porc hache","boulettes"],"nw":true,"i":[[900.0,"g","porc haché","viandes"],[1.0,"un","oignon","fruits et légumes"],[5.0,"ml","cannelle","garde-manger"],[2.0,"ml","clou de girofle moulu","garde-manger"],[1000.0,"ml","bouillon de boeuf","épicerie"],[125.0,"ml","farine grillée","garde-manger"]],"s":"Hacher très finement l'oignon. Mélanger le porc, l'oignon, la cannelle, le clou de girofle, 7 ml de sel et du poivre. Former des boulettes de 4 cm. Dans une grande cocotte, les dorer dans un filet d'huile à feu moyen, en plusieurs fois, puis les réserver. Délayer la farine grillée dans 250 ml d'eau froide. Verser le bouillon dans la cocotte en grattant le fond, ajouter la farine délayée et porter à ébullition en fouettant. Remettre les boulettes, couvrir et mijoter 1 h 30 à feu doux, en remuant de temps en temps. En semaine : former et dorer les boulettes la veille, puis tout mettre à la mijoteuse le matin, 8 h à faible intensité.","v":[["Avec pattes de cochon : version traditionnelle","+1000 g pattes de porc|viandes","Mijoter les pattes 2 h dans le bouillon avant d'ajouter les boulettes."],["À la mijoteuse : prêt au souper","","Après avoir doré les boulettes le matin, tout mettre dans la mijoteuse 8 h à faible intensité."]],"tp":35,"mj":2},{"n":"Poulet à l'orange","e":"","k":"souper","pr":"poulet","st":["asia"],"t":"riz","tm":30,"sf":"riz_blanc","sv":"brocoli","m":["poulet"],"nw":true,"i":[[900.0,"g","poitrines de poulet","viandes"],[250.0,"ml","jus d'orange","épicerie"],[60.0,"ml","sauce soya","épicerie"],[60.0,"ml","miel","épicerie"],[30.0,"ml","fécule de maïs","garde-manger"],[1.0,"un","orange","fruits et légumes"]],"s":"Couper le poulet en cubes de 2 cm et l'enrober de la moitié de la fécule de maïs. Mélanger le jus d'orange, la sauce soya, le miel et le reste de la fécule. Râper le zeste de l'orange. Dans une grande poêle, dorer le poulet dans un bon filet d'huile à feu moyen-vif 6 à 7 min, jusqu'à ce qu'il soit cuit. Verser la sauce et cuire 2 à 3 min en remuant, jusqu'à ce qu'elle épaississe et enrobe le poulet. Garnir de zeste.","v":[["Croustillant au four : sans friture","","Cuire le poulet enrobé sur une plaque 15 minutes à 425°F avant de napper."]]},{"n":"Cuisses de poulet BBQ au four","e":"","k":"souper","pr":"poulet","st":["four","bbq"],"t":"viande","tm":45,"sf":"patates_four","sv":"mais","m":["poulet","cuisses"],"nw":true,"i":[[10.0,"un","hauts de cuisses de poulet avec os","viandes"],[250.0,"ml","sauce BBQ","épicerie"],[15.0,"ml","paprika fumé","garde-manger"]],"s":"Préchauffer le four à 425 °F et tapisser une plaque de papier parchemin. Éponger les cuisses, puis les frotter de paprika fumé, de sel et de poivre. Les déposer sur la plaque, peau vers le haut. Cuire 30 min. Badigeonner généreusement de sauce BBQ et cuire encore 10 min, jusqu'à ce que la sauce soit collante et la viande à 175 °F près de l'os.","v":[["Miel-ail : glaçage miel et ail","-sauce BBQ ; +90 ml miel|épicerie ; +4 un gousses d'ail|fruits et légumes",""]],"tp":10},{"n":"Gratin de pâtes au thon","e":"","k":"souper","pr":"poisson","st":["four","pates"],"t":"pates","tm":35,"sf":"","sv":"salade_verte","m":["thon","pates"],"nw":true,"i":[[450.0,"g","penne","épicerie"],[3.0,"un","boîtes de thon","épicerie"],[1.0,"un","boîte de crème de champignons","épicerie"],[250.0,"ml","lait","produits laitiers"],[250.0,"g","petits pois surgelés","surgelés"],[200.0,"g","cheddar râpé","produits laitiers"]],"s":"Préchauffer le four à 375 °F. Cuire les penne 2 min de moins que l'emballage et les égoutter. Égoutter le thon. Dans un grand bol, mélanger la crème de champignons et le lait, puis ajouter les pâtes, le thon et les pois. Poivrer et verser dans un plat de 9 x 13 po. Couvrir de cheddar et gratiner 15 min, jusqu'à ce que ce soit bouillonnant et doré.","v":[["Au poulet : poulet cuit","-boîtes de thon ; +500 g poulet cuit|viandes",""]],"tp":20},{"n":"Soupe tonkinoise express","e":"","k":"souper","pr":"boeuf","st":["soupe","asia"],"t":"complet","tm":30,"sf":"","sv":"","m":["boeuf","nouilles de riz"],"nw":true,"i":[[400.0,"g","boeuf en tranches minces (fondue)","viandes"],[2000.0,"ml","bouillon de boeuf","épicerie"],[400.0,"g","nouilles de riz","épicerie"],[250.0,"g","fèves germées","fruits et légumes"],[1.0,"un","bouquet de coriandre","fruits et légumes"],[2.0,"un","limes","fruits et légumes"],[15.0,"ml","gingembre frais","fruits et légumes"]],"s":"Mettre le boeuf 15 min au congélateur pour le trancher plus facilement si ce n'est pas déjà fait. Dans une casserole, porter le bouillon à ébullition avec le gingembre tranché et mijoter 10 min. Cuire les nouilles selon l'emballage et les répartir dans de grands bols. Déposer les tranches de boeuf crues sur les nouilles. Verser le bouillon bouillant directement sur le boeuf : il cuit en 1 min. Garnir de fèves germées, de coriandre et de quartiers de lime.","v":[["Au poulet : poulet cuit","-boeuf en tranches ; -bouillon de boeuf ; +2000 ml bouillon de poulet|épicerie ; +500 g poulet cuit|viandes",""]]},{"n":"Poulet rôti du comptoir","k":"souper","pr":"poulet","st":["bbq","prepare"],"t":"viande","tm":15,"sf":"frites_four","sv":"salade_chou","m":["poulet rôti","poulet bbq","poulet barbecue","poulet cuit entier"],"i":[[2,"un","poulets rôtis du comptoir","viandes"],[250,"ml","sauce BBQ pour poulet","épicerie"]],"s":"Acheter les poulets le jour même. Réchauffer 10 minutes au four à 350°F, couvert. Chauffer la sauce et servir avec les frites et la salade de chou.","v":[["Façon rôtisserie : frites et petits pains","+6 un petits pains blancs|boulangerie",""],["Avec riz et légumes","@f=riz_blanc ; @v=legumes_sautes",""]],"e":"","nw":true,"pp":true,"rs":{"lbl":"poulet cuit","w":["poulet cuit"],"x":[[1,"un","poulets rôtis du comptoir","viandes"]]}},{"n":"Potage Parmentier","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":40,"sf":"","sv":"","m":["poireaux","pommes de terre"],"nw":true,"i":[[3,"un","poireaux","fruits et légumes"],[4,"un","pommes de terre","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[30,"g","beurre","produits laitiers"],[1500,"ml","bouillon de poulet","épicerie"],[125,"ml","crème 15%","produits laitiers"]],"s":"Couper le blanc et le vert pâle des poireaux en rondelles et les rincer à grande eau pour retirer le sable. Hacher l'oignon et peler les pommes de terre, puis les couper en cubes. Dans une casserole, fondre le beurre et faire fondre les poireaux et l'oignon 5 min sans les colorer. Ajouter les pommes de terre et le bouillon, porter à ébullition et mijoter 25 min. Réduire en purée lisse, ajouter la crème, saler et poivrer.","v":[["Vichyssoise : servie froide avec ciboulette","+1 un botte de ciboulette|fruits et légumes","Réfrigérer 4 h et servir froid, parsemé de ciboulette."],["Au bacon : bacon croustillant sur le dessus","+150 g bacon|viandes","Cuire le bacon et l'émietter sur chaque bol."]]},{"n":"Soupe à l'oignon gratinée","e":"","k":"soupe","pr":"","st":["soupe"],"t":"","tm":60,"sf":"","sv":"","m":["oignons","fromage suisse"],"nw":true,"i":[[6,"un","oignons","fruits et légumes"],[45,"g","beurre","produits laitiers"],[1500,"ml","bouillon de boeuf","épicerie"],[15,"ml","sauce Worcestershire","épicerie"],[1,"un","baguette","boulangerie"],[250,"g","fromage suisse râpé","produits laitiers"]],"s":"Caraméliser les oignons émincés dans le beurre 30 min à feu moyen-doux. Ajouter le bouillon et la sauce Worcestershire, mijoter 15 min. Verser dans des bols allant au four, couvrir de tranches de baguette grillées et de fromage, gratiner sous le gril.","v":[["À la bière : déglacée à la bière blonde","+341 ml bière blonde|épicerie","Déglacer les oignons avec la bière avant le bouillon."]]},{"n":"Crème de champignons","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":30,"sf":"","sv":"","m":["champignons"],"nw":true,"i":[[450,"g","champignons","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[30,"g","beurre","produits laitiers"],[30,"ml","farine","garde-manger"],[1000,"ml","bouillon de poulet","épicerie"],[250,"ml","crème 15%","produits laitiers"]],"s":"Trancher les champignons et hacher l'oignon. Dans une casserole, fondre le beurre à feu moyen-vif et dorer les champignons et l'oignon 8 min, jusqu'à ce que l'eau des champignons soit évaporée. Saupoudrer de farine et cuire 1 min en remuant. Verser le bouillon peu à peu, ajouter un brin de thym, saler et poivrer. Mijoter 15 min. Mixer environ la moitié de la soupe, pour garder des morceaux. Ajouter la crème et réchauffer sans faire bouillir.","v":[["Forestière : mélange de champignons","+150 g pleurotes|fruits et légumes","Garder quelques pleurotes dorés pour garnir."]]},{"n":"Crème de chou-fleur","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":35,"sf":"","sv":"","m":["chou-fleur"],"nw":true,"i":[[1,"un","chou-fleur","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[2,"un","pommes de terre","fruits et légumes"],[1250,"ml","bouillon de légumes","épicerie"],[250,"ml","lait","produits laitiers"]],"s":"Couper le chou-fleur en bouquets, hacher l'oignon et couper les pommes de terre en cubes. Dans une casserole, faire revenir l'oignon dans un peu de beurre 3 min. Ajouter le chou-fleur, les pommes de terre et le bouillon, porter à ébullition et mijoter 20 min, jusqu'à ce que tout soit très tendre. Réduire en purée lisse en ajoutant le lait. Saler, poivrer et ajouter une pincée de muscade.","v":[["Au cheddar fort : onctueuse et gratinée","+150 g cheddar fort râpé|produits laitiers","Ajouter le fromage hors du feu."],["Rôtie au cari","+10 ml poudre de cari|garde-manger","Rôtir le chou-fleur 25 min à 425 °F avant de le mettre dans le bouillon."]]},{"n":"Soupe poulet et riz","e":"","k":"soupe","pr":"poulet","st":["soupe"],"t":"","tm":40,"sf":"","sv":"","m":["poulet"],"nw":true,"i":[[2,"un","poitrines de poulet","viandes"],[3,"un","carottes","fruits et légumes"],[2,"un","branches de céleri","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[2000,"ml","bouillon de poulet","épicerie"],[150,"g","riz","épicerie"]],"s":"Dans une grande casserole, porter le bouillon à ébullition, ajouter les poitrines entières, baisser le feu et pocher 15 min. Retirer le poulet et l'effilocher à deux fourchettes. Pendant ce temps, couper les carottes, le céleri et l'oignon en petits dés. Ajouter les légumes et le riz au bouillon, et cuire 15 min, jusqu'à ce que le riz soit tendre. Remettre le poulet, saler, poivrer et ajouter un peu de persil.","v":[["Poulet et nouilles : nouilles aux oeufs au lieu du riz","-riz ; +200 g nouilles aux oeufs|épicerie","Cuire les nouilles 8 min dans la soupe."],["Citronnée : citron et aneth","+1 un citron|fruits et légumes ; +1 un botte d'aneth|fruits et légumes","Ajouter le jus de citron et l'aneth au service."]]},{"n":"Soupe aux lentilles et légumes","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":45,"sf":"","sv":"","m":["lentilles"],"nw":true,"i":[[250,"g","lentilles vertes sèches","épicerie"],[2,"un","carottes","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[2,"un","branches de céleri","fruits et légumes"],[796,"ml","tomates en dés","épicerie"],[1500,"ml","bouillon de légumes","épicerie"],[5,"ml","cumin","garde-manger"]],"s":"Hacher l'oignon, couper les carottes et le céleri en dés. Rincer les lentilles. Dans une grande casserole, faire revenir l'oignon, les carottes et le céleri dans un filet d'huile 5 min. Ajouter le cumin et cuire 30 s. Ajouter les lentilles, les tomates et le bouillon, porter à ébullition et mijoter 35 min à couvert, jusqu'à ce que les lentilles soient tendres. Saler, poivrer et ajouter un trait de jus de citron.","v":[["Lentilles corail au lait de coco","-lentilles vertes sèches ; +250 g lentilles corail|épicerie ; +400 ml lait de coco|épicerie ; +15 ml poudre de cari|garde-manger","Les lentilles corail cuisent en 20 min."]]},{"n":"Potage de patates douces et poivron rouge","e":"","k":"soupe","pr":"vege","st":["soupe"],"t":"","tm":40,"sf":"","sv":"","m":["patates douces","poivrons"],"nw":true,"i":[[3,"un","patates douces","fruits et légumes"],[2,"un","poivrons rouges","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[1250,"ml","bouillon de légumes","épicerie"],[125,"ml","crème 15%","produits laitiers"]],"s":"Peler les patates douces et les couper en cubes. Épépiner les poivrons et les couper en morceaux, hacher l'oignon. Dans une casserole, faire revenir l'oignon dans un filet d'huile 3 min. Ajouter les patates douces, les poivrons et le bouillon, porter à ébullition et mijoter 25 min. Réduire en purée lisse, ajouter la crème, saler et poivrer.","v":[["Épicé : chipotle","+5 ml chipotle moulu|garde-manger","Ajouter avant de mixer."]]},{"n":"Sauce à spaghetti maison (à congeler)","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":120,"sf":"","sv":"","m":["boeuf haché","tomates broyées"],"nw":true,"i":[[900,"g","boeuf haché","viandes"],[2,"un","oignons","fruits et légumes"],[3,"un","gousses d'ail","fruits et légumes"],[1,"un","poivron vert","fruits et légumes"],[227,"g","champignons","fruits et légumes"],[1592,"ml","tomates broyées","épicerie"],[156,"ml","pâte de tomates","épicerie"],[15,"ml","origan séché","garde-manger"]],"s":"Hacher les oignons, l'ail et le poivron, et trancher les champignons. Dans une grande casserole, dorer le boeuf à feu moyen-vif en le défaisant à la cuillère. Ajouter les oignons, l'ail, le poivron et les champignons, et cuire 8 min. Ajouter les tomates broyées, la pâte de tomates, l'origan, 10 ml de sel, du poivre et une pincée de sucre. Porter à ébullition, puis mijoter 1 h 30 à feu doux, à demi couvert, en remuant de temps en temps. Laisser refroidir et congeler en portions pour plusieurs soupers.","v":[["Végé : lentilles au lieu du boeuf","-boeuf haché ; +1080 ml lentilles en conserve|épicerie","Ajouter les lentilles rincées en même temps que les tomates."],["À la saucisse italienne","-boeuf haché ; +600 g saucisses italiennes|viandes","Retirer la chair des saucisses avant de la dorer."]]},{"n":"Sauce béchamel","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":15,"sf":"","sv":"","m":["lait"],"nw":true,"i":[[45,"g","beurre","produits laitiers"],[45,"ml","farine","garde-manger"],[750,"ml","lait","produits laitiers"],[1,"ml","muscade","garde-manger"]],"s":"Dans une casserole, fondre le beurre à feu moyen. Ajouter la farine et cuire 1 min en fouettant, sans colorer. Verser le lait froid peu à peu en fouettant pour éviter les grumeaux. Cuire 5 min en fouettant, jusqu'à ce que la sauce épaississe et nappe la cuillère. Assaisonner de muscade, de sel et de poivre.","v":[["Mornay : au fromage","+150 g fromage suisse râpé|produits laitiers","Ajouter le fromage hors du feu."]]},{"n":"Sauce brune maison","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":15,"sf":"","sv":"","m":["bouillon de boeuf"],"nw":true,"i":[[30,"g","beurre","produits laitiers"],[30,"ml","farine","garde-manger"],[500,"ml","bouillon de boeuf","épicerie"],[15,"ml","sauce Worcestershire","épicerie"],[15,"ml","ketchup","épicerie"]],"s":"Dans une casserole, fondre le beurre à feu moyen, ajouter la farine et cuire 3 à 4 min en fouettant, jusqu'à ce que le roux soit doré. Verser le bouillon peu à peu en fouettant. Ajouter la sauce Worcestershire et le ketchup. Mijoter 5 min, jusqu'à ce que la sauce nappe la cuillère. Saler et poivrer.","v":[["À poutine : moitié poulet, plus poivrée","+250 ml bouillon de poulet|épicerie ; +5 ml poivre noir|garde-manger","Remplacer la moitié du bouillon de boeuf par du bouillon de poulet."]]},{"n":"Sauce au poivre","e":"","k":"sauce","pr":"","st":["sauce"],"t":"","tm":15,"sf":"","sv":"","m":["crème 35%"],"nw":true,"i":[[15,"ml","poivre concassé","garde-manger"],[1,"un","échalote française","fruits et légumes"],[15,"g","beurre","produits laitiers"],[250,"ml","bouillon de boeuf","épicerie"],[125,"ml","crème 35%","produits laitiers"],[30,"ml","cognac","épicerie"]],"s":"Hacher finement l'échalote. Dans une petite casserole, fondre le beurre à feu moyen et faire revenir l'échalote 2 min. Ajouter le poivre concassé et cuire 30 s. Verser le cognac et laisser réduire presque à sec. Ajouter le bouillon et réduire de moitié, environ 5 min. Ajouter la crème et laisser épaissir 3 min. Saler au goût.","v":[["Sans alcool","-cognac","Déglacer avec le bouillon seulement."]]},{"n":"Sauce BBQ maison","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":20,"sf":"","sv":"","m":["ketchup"],"nw":true,"i":[[375,"ml","ketchup","épicerie"],[125,"ml","cassonade","garde-manger"],[60,"ml","vinaigre de cidre","épicerie"],[30,"ml","moutarde de Dijon","épicerie"],[15,"ml","sauce Worcestershire","épicerie"],[5,"ml","paprika fumé","garde-manger"]],"s":"Mettre le ketchup, la cassonade, le vinaigre, la moutarde, la sauce Worcestershire et le paprika fumé dans une casserole. Porter à frémissement à feu moyen en remuant. Mijoter 10 min à feu doux, jusqu'à ce que la sauce épaississe légèrement. Laisser refroidir. Se garde 2 semaines au réfrigérateur dans un pot fermé.","v":[["À l'érable : sirop d'érable au lieu de la cassonade","-cassonade ; +125 ml sirop d'érable|épicerie","Mijoter 5 min de plus."]]},{"n":"Sauce Alfredo","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":15,"sf":"","sv":"","m":["crème 35%","parmesan"],"nw":true,"i":[[60,"g","beurre","produits laitiers"],[2,"un","gousses d'ail","fruits et légumes"],[500,"ml","crème 35%","produits laitiers"],[150,"g","parmesan râpé","produits laitiers"]],"s":"Hacher finement l'ail. Dans une casserole, fondre le beurre à feu moyen et faire revenir l'ail 1 min sans le colorer. Ajouter la crème et laisser frémir 5 min, jusqu'à ce qu'elle épaississe un peu. Retirer du feu et ajouter le parmesan peu à peu en remuant jusqu'à ce que la sauce soit lisse. Poivrer et ajouter une pincée de muscade.","v":[["Rosée : avec sauce tomate","+250 ml sauce tomate|épicerie","Ajouter la sauce tomate avec la crème."]]},{"n":"Pesto au basilic","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["basilic"],"nw":true,"i":[[2,"un","bottes de basilic","fruits et légumes"],[60,"g","parmesan râpé","produits laitiers"],[50,"g","noix de pin","épicerie"],[2,"un","gousses d'ail","fruits et légumes"],[125,"ml","huile d'olive","garde-manger"]],"s":"Griller les noix de pin à sec dans une poêle 2 à 3 min, en remuant, jusqu'à ce qu'elles soient dorées. Effeuiller le basilic. Au robot, hacher le basilic, les noix de pin, l'ail et le parmesan. Ajouter l'huile d'olive en filet, moteur en marche, jusqu'à ce que ce soit homogène. Saler. Se garde une semaine au réfrigérateur, couvert d'une mince couche d'huile, ou se congèle en glaçons.","v":[["Pesto de tomates séchées","-bottes de basilic ; +170 ml tomates séchées dans l'huile|épicerie","Mixer les tomates égouttées avec le reste."]]},{"n":"Vinaigrette à l'érable","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":5,"sf":"","sv":"","m":["sirop d'érable"],"nw":true,"i":[[125,"ml","huile d'olive","garde-manger"],[45,"ml","vinaigre de cidre","épicerie"],[30,"ml","sirop d'érable","épicerie"],[15,"ml","moutarde de Dijon","épicerie"]],"s":"Dans un pot avec couvercle, mettre l'huile, le vinaigre, le sirop d'érable, la moutarde, une pincée de sel et du poivre. Fermer et agiter vigoureusement jusqu'à ce que la vinaigrette soit émulsionnée. Se garde 2 semaines au réfrigérateur : agiter avant de servir.","v":[["César maison","-sirop d'érable ; +60 ml mayonnaise|épicerie ; +30 g parmesan râpé|produits laitiers ; +1 un citron|fruits et légumes","Fouetter la mayonnaise, le jus de citron et le parmesan avec l'huile."]]},{"n":"Tzatziki","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["yogourt grec"],"nw":true,"i":[[500,"ml","yogourt grec","produits laitiers"],[1,"un","concombre","fruits et légumes"],[2,"un","gousses d'ail","fruits et légumes"],[1,"un","citron","fruits et légumes"]],"s":"Râper le concombre avec la pelure, le saler légèrement et le laisser égoutter 10 min dans une passoire. Le presser dans les mains pour retirer le plus d'eau possible. Hacher finement l'ail. Mélanger le yogourt, le concombre, l'ail et le jus du citron, saler et ajouter un filet d'huile d'olive et un peu d'aneth si désiré. Réfrigérer 30 min avant de servir.","v":[["À l'aneth","+1 un botte d'aneth|fruits et légumes","Ajouter l'aneth haché."]]},{"n":"Sauce à pizza maison","e":"","k":"sauce","pr":"vege","st":["sauce"],"t":"","tm":10,"sf":"","sv":"","m":["sauce tomate"],"nw":true,"i":[[398,"ml","sauce tomate","épicerie"],[156,"ml","pâte de tomates","épicerie"],[2,"un","gousses d'ail","fruits et légumes"],[5,"ml","origan séché","garde-manger"]],"s":"Hacher finement l'ail. Dans une petite casserole, mélanger la sauce tomate, la pâte de tomates, l'ail, l'origan, une pincée de sel et une pincée de sucre. Laisser mijoter 5 min à feu doux. Laisser refroidir avant d'étendre sur la pâte. Assez pour 3 ou 4 pizzas; le reste se congèle.","v":[]},{"n":"Crêpes maison","e":"","k":"dejeuner","pr":"","st":["crepe"],"t":"","tm":25,"sf":"","sv":"","m":["oeufs","lait"],"nw":true,"i":[[250,"g","farine","garde-manger"],[4,"un","oeufs","produits laitiers"],[750,"ml","lait","produits laitiers"],[30,"g","beurre","produits laitiers"],[125,"ml","sirop d'érable","épicerie"]],"s":"Fondre le beurre. Dans un bol, fouetter la farine avec une pincée de sel. Ajouter les oeufs, puis le lait peu à peu en fouettant jusqu'à ce que la pâte soit lisse. Ajouter le beurre fondu. Laisser reposer 15 min si possible. Chauffer une poêle à feu moyen et la beurrer légèrement. Verser une petite louche de pâte en inclinant la poêle pour couvrir le fond. Cuire 1 min, retourner et cuire 30 s à 1 min. Servir avec le sirop d'érable.","v":[["Aux bleuets","+250 g bleuets|surgelés","Parsemer les bleuets sur la crêpe avant de la retourner."],["Jambon-fromage (salées)","-sirop d'érable ; +200 g jambon tranché|viandes ; +150 g fromage suisse râpé|produits laitiers","Garnir la crêpe chaude et la plier."]]},{"n":"Pain doré","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":20,"sf":"","sv":"","m":["oeufs","pain"],"nw":true,"i":[[12,"un","tranches de pain","boulangerie"],[6,"un","oeufs","produits laitiers"],[375,"ml","lait","produits laitiers"],[5,"ml","cannelle","garde-manger"],[125,"ml","sirop d'érable","épicerie"],[30,"g","beurre","produits laitiers"]],"s":"Dans un plat large, fouetter les oeufs, le lait, la cannelle et une pincée de sel. Chauffer une grande poêle ou une plaque à feu moyen et la beurrer. Tremper chaque tranche de pain quelques secondes de chaque côté. Dorer 2 à 3 min par côté, en beurrant la poêle entre les fournées. Garder au chaud au four à 200 °F pendant la cuisson du reste. Servir avec le sirop d'érable.","v":[["Aux petits fruits","+300 g petits fruits|surgelés","Garnir de petits fruits chauds."]]},{"n":"Oeufs, bacon et rôties","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":20,"sf":"","sv":"","m":["oeufs","bacon"],"nw":true,"i":[[12,"un","oeufs","produits laitiers"],[400,"g","bacon","viandes"],[12,"un","tranches de pain","boulangerie"],[30,"g","beurre","produits laitiers"]],"s":"Préchauffer le four à 400 °F. Étaler le bacon sur une plaque tapissée de papier parchemin et cuire 15 à 18 min, jusqu'à ce qu'il soit croustillant, puis l'égoutter sur du papier absorbant. Pendant ce temps, chauffer une poêle à feu moyen avec un peu de beurre. Cuire les oeufs au goût : au miroir 3 min, retournés 1 min de plus, ou brouillés en remuant doucement. Griller le pain et le beurrer.","v":[["Saucisses au lieu du bacon","-bacon ; +500 g saucisses déjeuner|viandes","Dorer les saucisses 10 min à la poêle."],["Avec pommes de terre rissolées","+600 g pommes de terre rissolées surgelées|surgelés","Cuire les patates au four avec le bacon."]]},{"n":"Gruau aux pommes et cannelle","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":10,"sf":"","sv":"","m":["flocons d'avoine","pommes"],"nw":true,"i":[[375,"g","flocons d'avoine","épicerie"],[1500,"ml","lait","produits laitiers"],[3,"un","pommes","fruits et légumes"],[5,"ml","cannelle","garde-manger"],[60,"g","cassonade","garde-manger"]],"s":"Couper les pommes en petits dés, avec ou sans la pelure. Dans une casserole, porter le lait à frémissement. Ajouter l'avoine, les pommes, la cannelle et une pincée de sel. Cuire 5 min à feu moyen-doux en remuant souvent, jusqu'à ce que ce soit crémeux. Sucrer de cassonade au moment de servir.","v":[["Banane et beurre d'arachide","-pommes ; +3 un bananes|fruits et légumes ; +90 ml beurre d'arachide|épicerie","Ajouter au service."]],"sp":1},{"n":"Yogourt, granola et petits fruits","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["yogourt","granola"],"nw":true,"i":[[1000,"ml","yogourt nature","produits laitiers"],[300,"g","granola","épicerie"],[400,"g","petits fruits","surgelés"],[60,"ml","miel","épicerie"]],"s":"Si les petits fruits sont congelés, les sortir la veille au réfrigérateur ou les décongeler 1 min au micro-ondes. Dans des bols, étager le yogourt, les petits fruits et le granola. Arroser d'un filet de miel. Ajouter le granola au dernier moment pour qu'il reste croquant.","v":[["Yogourt grec et érable","-yogourt nature ; -miel ; +1000 ml yogourt grec|produits laitiers ; +60 ml sirop d'érable|épicerie",""]],"sp":1},{"n":"Smoothies aux fruits","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["petits fruits","yogourt"],"nw":true,"i":[[2,"un","bananes","fruits et légumes"],[500,"g","petits fruits","surgelés"],[750,"ml","yogourt à la vanille","produits laitiers"],[500,"ml","jus d'orange","épicerie"]],"s":"Peler les bananes et les couper en morceaux. Mettre le jus d'orange en premier dans le mélangeur, puis le yogourt, les bananes et les petits fruits. Mixer à haute vitesse 1 min, jusqu'à ce que ce soit lisse. Ajouter un peu de jus si c'est trop épais. Servir aussitôt.","v":[["Vert : épinards et mangue","-petits fruits ; +100 g épinards|fruits et légumes ; +400 g mangue surgelée|surgelés",""]],"sp":1},{"n":"Muffins anglais oeuf, jambon et fromage","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":15,"sf":"","sv":"","m":["muffins anglais","oeufs"],"nw":true,"i":[[6,"un","muffins anglais","boulangerie"],[6,"un","oeufs","produits laitiers"],[150,"g","jambon tranché","viandes"],[6,"un","tranches de fromage","produits laitiers"]],"s":"Ouvrir les muffins anglais et les griller. Dans une poêle beurrée à feu moyen, cuire les oeufs dans des emporte-pièces ronds beurrés, ou au miroir en crevant le jaune, 3 min, puis les retourner 1 min. Réchauffer le jambon 30 s dans la poêle. Monter : muffin, jambon, oeuf, fromage, puis le dessus du muffin. Pour congeler : emballer chacun dans une pellicule; réchauffer 1 min à 1 min 30 au micro-ondes.","v":[["Au bacon","-jambon tranché ; +250 g bacon|viandes","Cuire le bacon au four 15 min."]]},{"n":"Burritos déjeuner","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":20,"sf":"","sv":"","m":["oeufs","tortillas"],"nw":true,"i":[[6,"un","tortillas","boulangerie"],[8,"un","oeufs","produits laitiers"],[200,"g","jambon en dés","viandes"],[1,"un","poivron","fruits et légumes"],[150,"g","cheddar râpé","produits laitiers"],[125,"ml","salsa","épicerie"]],"s":"Couper le poivron en petits dés. Dans une grande poêle, faire revenir le poivron et le jambon dans une noix de beurre 4 min. Battre les oeufs avec du sel et du poivre, les verser dans la poêle et brouiller doucement à feu moyen-doux jusqu'à ce qu'ils soient pris mais encore moelleux. Réchauffer les tortillas 20 s au micro-ondes. Garnir de fromage, d'oeufs et d'une cuillerée de salsa, replier les côtés et rouler. Pour congeler : emballer chacun; réchauffer 2 min au micro-ondes.","v":[["Au bacon et pommes de terre","-jambon en dés ; +250 g bacon|viandes ; +400 g pommes de terre rissolées surgelées|surgelés",""]]},{"n":"Omelette jambon et fromage","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":15,"sf":"","sv":"","m":["oeufs"],"nw":true,"i":[[10,"un","oeufs","produits laitiers"],[150,"g","jambon en dés","viandes"],[150,"g","cheddar râpé","produits laitiers"],[1,"un","poivron","fruits et légumes"],[12,"un","tranches de pain","boulangerie"]],"s":"Couper le poivron en petits dés. Battre les oeufs avec du sel, du poivre et un trait de lait. Dans une poêle antiadhésive, faire revenir le poivron et le jambon dans une noix de beurre 3 min, puis les retirer. Fondre un peu de beurre, verser une partie des oeufs et ramener les bords vers le centre en inclinant la poêle. Quand le dessus est presque pris, garnir de jambon, de poivron et de fromage, puis plier. Répéter pour les autres omelettes. Servir avec les rôties.","v":[["Végé : champignons et épinards","-jambon en dés ; +227 g champignons|fruits et légumes ; +100 g épinards|fruits et légumes",""]]},{"n":"Gaufres maison","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":25,"sf":"","sv":"","m":["oeufs","lait"],"nw":true,"i":[[300,"g","farine","garde-manger"],[3,"un","oeufs","produits laitiers"],[500,"ml","lait","produits laitiers"],[80,"g","beurre","produits laitiers"],[15,"ml","poudre à pâte","garde-manger"],[125,"ml","sirop d'érable","épicerie"]],"s":"Préchauffer le gaufrier. Fondre le beurre. Dans un grand bol, mélanger la farine, la poudre à pâte, 15 ml de sucre et une pincée de sel. Dans un autre bol, fouetter les oeufs, le lait et le beurre fondu. Verser sur les ingrédients secs et mélanger juste assez : il peut rester quelques grumeaux. Huiler le gaufrier et cuire selon l'appareil, 3 à 5 min, jusqu'à ce que les gaufres soient dorées. Servir avec le sirop d'érable. Le surplus se congèle et se réchauffe au grille-pain.","v":[["Aux fraises et crème fouettée","+454 g fraises|fruits et légumes ; +250 ml crème 35%|produits laitiers",""]]},{"n":"Bagels au fromage à la crème","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["bagels","fromage à la crème"],"nw":true,"i":[[6,"un","bagels","boulangerie"],[250,"g","fromage à la crème","produits laitiers"],[1,"un","concombre","fruits et légumes"]],"s":"Trancher le concombre en fines rondelles. Ouvrir et griller les bagels. Tartiner généreusement de fromage à la crème et garnir de concombre, de sel et de poivre.","v":[["Au saumon fumé","+150 g saumon fumé|poissonnerie ; +1 un oignon rouge|fruits et légumes","Garnir de saumon fumé et d'oignon rouge."]],"sp":1},{"n":"Céréales et fruits","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["céréales","lait"],"nw":true,"i":[[1,"un","céréales","épicerie"],[1500,"ml","lait","produits laitiers"],[4,"un","bananes","fruits et légumes"]],"s":"Trancher les bananes au moment de servir. Servir les céréales dans des bols avec le lait froid et les tranches de banane.","v":[],"sp":1},{"n":"Muffins aux bananes","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":35,"sf":"","sv":"","m":["bananes"],"nw":true,"i":[[3,"un","bananes","fruits et légumes"],[300,"g","farine","garde-manger"],[150,"g","sucre","garde-manger"],[2,"un","oeufs","produits laitiers"],[125,"ml","huile végétale","garde-manger"],[5,"ml","bicarbonate de soude","garde-manger"]],"s":"Préchauffer le four à 350 °F et chemiser un moule à 12 muffins. Écraser les bananes à la fourchette. Ajouter les oeufs, le sucre et l'huile, et bien mélanger. Incorporer la farine mélangée avec le bicarbonate de soude et une pincée de sel, sans trop brasser. Remplir les moules aux trois quarts. Cuire 20 à 22 min, jusqu'à ce qu'un cure-dent ressorte propre. Se congèlent bien.","v":[["Aux pépites de chocolat","+150 g pépites de chocolat|garde-manger",""]],"sp":1},{"n":"Oeufs bénédictine","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":30,"sf":"","sv":"","m":["oeufs","jambon"],"nw":true,"i":[[6,"un","muffins anglais","boulangerie"],[15,"un","oeufs","produits laitiers"],[300,"g","jambon tranché","viandes"],[125,"g","beurre","produits laitiers"],[1,"un","citron","fruits et légumes"]],"s":"Hollandaise : fondre le beurre et le garder chaud. Dans un bol au-dessus d'une casserole d'eau frémissante, fouetter 3 oeufs (les jaunes seulement) avec le jus du citron et 15 ml d'eau, jusqu'à ce que ce soit mousseux et épais. Retirer du feu et ajouter le beurre fondu en mince filet en fouettant sans arrêt. Saler et garder au chaud. Pocher les 12 autres oeufs : dans l'eau frémissante avec un trait de vinaigre, 3 min, en quelques fois. Griller les muffins anglais et réchauffer le jambon à la poêle. Monter : muffin, jambon, oeuf poché, hollandaise.","v":[["Au saumon fumé","-jambon tranché ; +200 g saumon fumé|poissonnerie",""]]},{"n":"Patates déjeuner et oeufs brouillés","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":35,"sf":"","sv":"","m":["pommes de terre","oeufs"],"nw":true,"i":[[1000,"g","pommes de terre","fruits et légumes"],[1,"un","oignon","fruits et légumes"],[1,"un","poivron","fruits et légumes"],[12,"un","oeufs","produits laitiers"],[30,"g","beurre","produits laitiers"]],"s":"Couper les pommes de terre en dés de 1 cm, avec la pelure, et les cuire 5 min au micro-ondes dans un plat couvert avec un peu d'eau pour accélérer. Hacher l'oignon et couper le poivron en dés. Dans une grande poêle, chauffer un filet d'huile à feu moyen-vif et dorer les patates 15 min en remuant de temps en temps, en ajoutant l'oignon et le poivron à mi-cuisson. Saler, poivrer et ajouter du paprika. Battre les oeufs avec du sel et brouiller doucement dans le beurre à feu moyen-doux.","v":[["Avec saucisses","+500 g saucisses déjeuner|viandes",""]]},{"n":"Rôties au beurre d'arachide et bananes","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["beurre d'arachide"],"nw":true,"i":[[12,"un","tranches de pain","boulangerie"],[250,"ml","beurre d'arachide","épicerie"],[3,"un","bananes","fruits et légumes"]],"s":"Griller le pain. Tartiner de beurre d'arachide pendant qu'il est chaud. Garnir de tranches de banane et, si désiré, d'un filet de miel ou d'une pincée de cannelle.","v":[],"sp":1},{"n":"Galettes de sarrasin","e":"","k":"dejeuner","pr":"","st":["crepe"],"t":"","tm":25,"sf":"","sv":"","m":["sarrasin","oeufs"],"nw":true,"i":[[250,"g","farine de sarrasin","garde-manger"],[2,"un","oeufs","produits laitiers"],[500,"ml","lait","produits laitiers"],[30,"g","beurre","produits laitiers"],[125,"ml","mélasse","épicerie"]],"s":"Fouetter la farine de sarrasin, les oeufs, le lait et 250 ml d'eau avec une pincée de sel. Laisser reposer 10 min. Cuire de grandes galettes minces dans une poêle bien chaude et beurrée, 1 à 2 min par côté. Servir avec la mélasse.","v":[["Au sirop d'érable","-mélasse ; +125 ml sirop d'érable|épicerie",""],["Avec des cretons","+250 g cretons|viandes","Tartiner la galette chaude de cretons et la rouler."]]},{"n":"Déjeuner de cabane","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":35,"sf":"","sv":"","m":["oeufs","feves au lard","jambon"],"nw":true,"i":[[12,"un","oeufs","produits laitiers"],[2,"un","boîtes de fèves au lard","épicerie"],[500,"g","jambon tranché épais","viandes"],[600,"g","pommes de terre rissolées surgelées","surgelés"],[125,"ml","sirop d'érable","épicerie"],[12,"un","tranches de pain","boulangerie"]],"s":"Cuire les patates au four 25 min à 425 °F. Réchauffer les fèves au lard. Dorer le jambon à la poêle avec un filet de sirop d'érable. Cuire les oeufs au goût et griller le pain. Servir le reste du sirop à table.","v":[["Avec oreilles de crisse","+300 g lard salé|viandes","Couper le lard en lanières et le cuire au four 30 min à 400 °F jusqu'à ce qu'il soit croustillant."],["Avec saucisses","-jambon tranché épais ; +500 g saucisses déjeuner|viandes","Dorer les saucisses 10 min à la poêle."]]},{"n":"Cretons maison sur rôties","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":90,"sf":"","sv":"","m":["porc hache"],"nw":true,"i":[[700,"g","porc haché","viandes"],[1,"un","oignon","fruits et légumes"],[250,"ml","lait","produits laitiers"],[60,"g","chapelure","épicerie"],[2,"ml","cannelle","garde-manger"],[1,"ml","clou de girofle moulu","garde-manger"],[12,"un","tranches de pain","boulangerie"]],"s":"Mijoter le porc, l'oignon haché fin, le lait, la chapelure et les épices à feu doux 1 h 15, en brassant souvent. Écraser à la fourchette, verser dans des petits plats et réfrigérer. Se garde 5 jours : déjeuners de la semaine sur des rôties.","v":[["Plus légers (moitié veau)","-350 g porc haché ; +350 g veau haché|viandes",""]],"sp":1},{"n":"Pancakes moelleux","e":"","k":"dejeuner","pr":"","st":["crepe"],"t":"","tm":25,"sf":"","sv":"","m":["farine","oeufs","lait"],"nw":true,"i":[[300,"g","farine","garde-manger"],[15,"ml","poudre à pâte","garde-manger"],[2,"un","oeufs","produits laitiers"],[500,"ml","lait","produits laitiers"],[45,"g","beurre","produits laitiers"],[125,"ml","sirop d'érable","épicerie"]],"s":"Mélanger la farine, la poudre à pâte et une pincée de sel. Ajouter les oeufs, le lait et le beurre fondu sans trop brasser. Cuire 60 ml de pâte à la fois dans une poêle beurrée, en retournant quand des bulles apparaissent.","v":[["Bananes et pépites de chocolat","+2 un bananes|fruits et légumes ; +100 g pépites de chocolat|garde-manger","Ajouter les tranches de banane et les pépites sur la pâte dans la poêle."],["Aux bleuets","+250 g bleuets|surgelés",""]]},{"n":"Gruau de nuit aux petits fruits","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":5,"sf":"","sv":"","m":["flocons d'avoine","yogourt"],"nw":true,"i":[[300,"g","flocons d'avoine","épicerie"],[750,"ml","lait","produits laitiers"],[375,"ml","yogourt à la vanille","produits laitiers"],[300,"g","petits fruits","surgelés"],[60,"ml","sirop d'érable","épicerie"]],"s":"La veille, mélanger l'avoine, le lait, le yogourt et le sirop dans des pots. Ajouter les petits fruits. Réfrigérer toute la nuit : c'est prêt au réveil, froid ou réchauffé.","v":[["Pommes et cannelle","-petits fruits ; +2 un pommes|fruits et légumes ; +5 ml cannelle|garde-manger",""]],"sp":1},{"n":"Sandwichs déjeuner sur croissant","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":20,"sf":"","sv":"","m":["oeufs","bacon","croissant"],"nw":true,"i":[[6,"un","croissants","boulangerie"],[8,"un","oeufs","produits laitiers"],[300,"g","bacon","viandes"],[6,"un","tranches de fromage","produits laitiers"]],"s":"Cuire le bacon au four 15 min à 400 °F. Brouiller les oeufs. Garnir les croissants tranchés d'oeufs, de bacon et de fromage. Passer 3 min au four pour faire fondre.","v":[["Sur bagel, saucisse et oeuf","-croissants ; -bacon ; +6 un bagels|boulangerie ; +375 g saucisses déjeuner|viandes","Griller les bagels et dorer les saucisses."]]},{"n":"Casserole déjeuner au four","e":"","k":"dejeuner","pr":"","st":[],"t":"","tm":60,"sf":"","sv":"","m":["oeufs","jambon",
