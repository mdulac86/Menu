<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu de la semaine"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6eee0" id="mtc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Menu de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Le babillard du frigo : la semaine se lit comme le menu collé sur le frigo, un jour par ligne. */
/* Couleurs d'une carte de restaurant : papier crème, encre espresso, rouge sauce tomate.
   En mode sombre, l'ardoise du bistro : charbon chaud, craie et safran. Le jaune et le rouge des circulaires restent les seuls éléments criards. */
:root{
  --bg:#f6eee0; --card:#fffbf4; --ink:#2b1d14; --mute:#7a6656; --line:#eadfcd; --line2:#d6c4a9; --chip:#f2e7d5;
  --accent:#a8281a; --accent-ink:#fffaf2; --soft:#f7e1d6;
  --kraft:#9a5a12; --kraft-soft:#f3e3c6;
  --tag:#ffcf1f; --tag-ink:#2b1d00; --price:#c4161c;
  --warn:#8a5300; --warn-soft:#f9ebcf; --danger:#b3261e; --danger-soft:#fbe4df;
  --f-disp:"Fraunces","Iowan Old Style","Palatino",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1917; --card:#262220; --ink:#f3eadb; --mute:#b3a593; --line:#3a332e; --line2:#544a42; --chip:#312b27;
  --accent:#f0a04b; --accent-ink:#2a1606; --soft:#3b2b1d;
  --kraft:#e4b273; --kraft-soft:#352a1d;
  --tag:#f5c518; --tag-ink:#231a00; --price:#b3121b;
  --warn:#ebb84f; --warn-soft:#382c12; --danger:#ff917f; --danger-soft:#3d221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1917; --card:#262220; --ink:#f3eadb; --mute:#b3a593; --line:#3a332e; --line2:#544a42; --chip:#312b27;
  --accent:#f0a04b; --accent-ink:#2a1606; --soft:#3b2b1d;
  --kraft:#e4b273; --kraft-soft:#352a1d;
  --tag:#f5c518; --tag-ink:#231a00; --price:#b3121b;
  --warn:#ebb84f; --warn-soft:#382c12; --danger:#ff917f; --danger-soft:#3d221d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-disp);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em;font-optical-sizing:auto}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(108px + env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font-size:2rem;line-height:1;font-weight:700;letter-spacing:-.02em}
header h1 em{font-style:italic;font-weight:500;color:var(--accent)}
header .sub{font-size:.76rem;color:var(--mute);margin-top:6px}
.hbtn{flex:none;min-height:38px;padding:0 15px;border-radius:99px;border:0;background:var(--card);color:var(--accent);font-weight:700;font-size:.88rem}

section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:1.12rem;line-height:1.2}
.card.call{box-shadow:inset 0 0 0 2px var(--accent)}
.small,.acc{color:var(--mute);font-size:.86rem}
.note{font-size:.88rem;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:9px 12px}
.sec{font-family:var(--f-disp);font-size:1.45rem;font-style:italic;font-weight:600;letter-spacing:-.01em;margin:20px 4px -2px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{font:600 .8rem var(--f-body);font-style:normal;color:var(--mute);letter-spacing:0}
.empty{padding:26px 18px;text-align:center;color:var(--mute);border:1.5px dashed var(--line2);border-radius:var(--r);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--ink);font-family:var(--f-disp);font-size:1.15rem;font-weight:600}

/* semaine */
.week h2{font-size:1.45rem;line-height:1.1;font-weight:650}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.grid4c{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end}
.grid4c label.f{font-size:.78rem}
.grid4c select{padding-left:10px}
.pick>summary{font-family:var(--f-disp);font-size:1.1rem;font-style:italic}
label.inl{display:inline-flex;align-items:center}
.pk_sel{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:14px;padding:12px}
.sidepick{display:flex;flex-direction:column;gap:8px;background:var(--chip);border-radius:14px;padding:12px}
.sidepick .grid2{grid-template-columns:1fr}
.tally{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink)}
.tally p{flex:1;min-width:0;font-size:.95rem}
.tally b{font-family:var(--f-disp);font-size:1.4rem;font-weight:700}
.tally .btn,.tally .btn.p{flex:none;white-space:nowrap;background:var(--accent-ink);color:var(--accent);border:0}
.today{background:var(--soft)}
.today h3{color:var(--accent)}
.todo{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.with{font-size:.95rem}
.with .small{margin-right:4px}

/* le menu : une feuille, un plat par ligne */
.sheet{background:var(--card);border-radius:var(--r);padding:0 14px}
details.dish{border-bottom:1px solid var(--line)}
details.dish:last-child{border-bottom:0}
details.dish>summary{display:flex;align-items:flex-start;gap:12px;padding:14px 0;color:var(--ink);font-weight:400;min-height:0}
details.dish>summary::after{margin-top:10px;color:var(--mute)}
details.dish[open]>summary{padding-bottom:10px}
.dcol{flex:none;width:42px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;padding:4px 0 6px;border-radius:12px;color:var(--ink)}
.dcol small{font-size:.7rem;font-weight:700;color:var(--mute)}
.dcol b{font:650 1.6rem/1 var(--f-disp);font-variant-numeric:lining-nums;letter-spacing:-.02em}
.dcol.off b{color:var(--kraft)}
.dcol.now{background:var(--accent);color:var(--accent-ink)}
.dcol.now small{color:var(--accent-ink);opacity:.85}
.dcol.now b{color:var(--accent-ink)}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dname{font:600 1.14rem/1.22 var(--f-disp);letter-spacing:-.005em;text-wrap:balance;min-width:0}
.dline{display:flex;align-items:baseline;gap:8px}
.lead{flex:1 1 18px;min-width:18px;border-bottom:2px dotted var(--line2);transform:translateY(-5px)}
.dtime{flex:none;font-size:.8rem;font-weight:600;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
details.dish[open] .dname{color:var(--accent)}
.dsub{font-size:.88rem;color:var(--mute);line-height:1.35;font-style:italic;font-family:var(--f-disp);font-weight:500}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{font-size:.72rem;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--mute)}
.flag.a{background:var(--soft);color:var(--accent)}
.flag.k{background:var(--kraft-soft);color:var(--kraft)}
.flag.w{background:var(--warn-soft);color:var(--warn)}
.dbody{display:flex;flex-direction:column;gap:12px;padding:0 0 18px 54px}
.sheet .dish:not(:has(.dcol)) .dbody{padding-left:0}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rest{font-size:.88rem;color:var(--kraft);background:var(--kraft-soft);border-radius:12px;padding:8px 12px;font-weight:600}
.stock{font-size:.86rem;color:var(--accent);font-weight:600}
.var{font-size:.9rem;background:var(--chip);padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.var ul{margin:0;padding-left:18px;color:var(--mute);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.meta span{font-size:.72rem;font-weight:600;color:var(--mute);background:var(--chip);border-radius:6px;padding:2px 7px}
.meta .new,.meta .fav,.meta .liked{background:var(--soft);color:var(--accent)}
.meta .long{background:var(--warn-soft);color:var(--warn)}
.meta .spec{background:var(--tag);color:var(--tag-ink)}
.meta .pp{background:var(--kraft-soft);color:var(--kraft)}
.dish-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.time{flex:none;font-size:.8rem;font-weight:600;color:var(--mute);white-space:nowrap}

/* étiquette de spécial, découpée comme dans une circulaire */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{position:relative;display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0;background:var(--tag);color:var(--tag-ink);padding:5px 12px 5px 19px;font-size:.78rem;line-height:1.25;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--card)}
.tag .nm{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500}
.tag b{font:700 1.02rem var(--f-body);color:var(--price);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tag small{white-space:nowrap;font-weight:700;opacity:.7;font-size:.72rem}

/* contrôles */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:0 13px;border-radius:99px;border:0;background:var(--chip);font-size:.86rem;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:.86rem;min-height:36px;padding:0 14px;border-radius:99px;background:var(--chip);font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chip:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.chip:has(input:checked)::before{content:"✓";font-weight:800}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chip:has(input:disabled){opacity:.55}
.chip.rm:has(input:checked){background:var(--danger-soft);color:var(--danger);text-decoration:line-through}
.chip.rm:has(input:checked)::before{content:"−"}
.sgrp{font-size:.8rem;font-weight:700;color:var(--mute);margin:8px 0 -4px}

.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--chip);font-weight:600}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{min-height:38px;padding:0 13px;font-size:.88rem;border-radius:11px}
.btn.d{color:var(--danger);background:var(--danger-soft)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}

details>summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:40px;display:flex;align-items:center;gap:10px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";flex:none;width:7px;height:7px;margin-left:auto;margin-right:4px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details>summary .rm{margin-left:auto;font-weight:500;font-size:.8rem;color:var(--mute);white-space:nowrap}
details>summary:has(.rm)::after{margin-left:0}
details.more{display:contents}
details.more>summary{min-height:38px;padding:0 13px;border-radius:11px;background:var(--chip);color:var(--ink);font-size:.88rem}
details.more>summary::after{display:none}
details.more[open]>summary{background:var(--line2)}
.more-p{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
details.panel{border-top:1px solid var(--line);padding-top:2px}
details.panel[open]{padding-bottom:4px}
details.card:not([open]){gap:0}
details.row{border-bottom:1px solid var(--line)}
details.row:last-child{border-bottom:0}
details.row>summary{min-height:52px;color:var(--ink);font-weight:600}
details.row[open]>summary{color:var(--accent)}
.rbody{display:flex;flex-direction:column;gap:12px;padding:2px 0 18px}
@media (prefers-reduced-motion:reduce){details>summary::after{transition:none}}

ul.ing{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
ul.ing li:last-child{border-bottom:0}
ul.ing li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
ul.ing li.x{opacity:.5;text-decoration:line-through}
ul.ing a{margin-left:10px;text-decoration:none;font-weight:600}
.steps{font-size:.93rem;line-height:1.55}

/* liste d'épicerie */
.item{display:flex;align-items:center;gap:12px;min-height:54px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;border:2px solid var(--line2);border-radius:8px;background:var(--card);display:grid;place-content:center;cursor:pointer}
.item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.item input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .t b{font-weight:600;overflow-wrap:anywhere}
.item .q{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.item.done .t b{text-decoration:line-through;color:var(--mute);font-weight:500}
.item.done .tag{opacity:.45}
.item small{display:block;color:var(--mute);font-size:.78rem}
.list{padding-block:0}
.card.list{padding-block:4px}
.aisle{font-size:.8rem;font-weight:700;color:var(--accent);padding-top:14px;padding-bottom:2px}
.aisle:first-child{padding-top:8px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:40px;height:40px;border-radius:11px;border:0;background:var(--chip);font-size:1.2rem;line-height:1}
.step input.num{width:64px;text-align:center;padding:8px 4px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* champs */
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;padding:9px 13px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
select:not([multiple]){appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select[multiple]{padding:6px 8px}
select.mini{min-height:32px;padding:3px 30px 3px 10px;font-size:.82rem;width:auto;max-width:100%;border-width:1px;background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--mute);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
label.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
label.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

details.help>summary{font-family:var(--f-disp);font-size:1.04rem;color:var(--ink)}
.help p,.help li{font-size:.94rem}
.help ol,.help ul{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.help .tip{background:var(--soft);border-radius:12px;padding:9px 12px;margin:6px 0}
.help .warn{background:var(--warn-soft);border-radius:12px;padding:9px 12px;margin:6px 0}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs>div{display:flex;width:100%;max-width:640px}
.tabs button{position:relative;flex:1;min-height:52px;background:none;border:0;border-radius:14px;font-weight:600;font-size:.72rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{background:var(--soft);border-radius:99px;padding:2px 12px;width:50px;box-sizing:border-box}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:1.45em;padding:0 .4em;border-radius:99px;background:var(--price);color:#fff;font-size:.68rem;line-height:1.55;font-variant-numeric:tabular-nums}

.dayw{position:relative;display:inline-flex;align-items:center}
select.day{min-height:34px;width:auto;padding:4px 30px 4px 12px;border-radius:99px;border:0;background-color:var(--soft);color:var(--accent);font:700 .86rem var(--f-body);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%}
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.restq{font-style:normal;color:var(--kraft);font-weight:600;margin-left:10px;font-size:.85rem}

/* mode magasin */
body.store header,body.store .tabs{display:none}
body.store .app{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.store .item{min-height:64px}
body.store .item .t b{font-size:1.16rem}
body.store .item .q{font-size:1.15rem}
body.store .item input[type=checkbox]{width:34px;height:34px;border-radius:10px}
.storebar{position:sticky;top:0;z-index:4;display:flex;gap:12px;align-items:center;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;margin-top:calc(-18px - env(safe-area-inset-top,0px))}
.storebar>div{flex:1;display:flex;flex-direction:column;gap:6px}
.storebar b{font-family:var(--f-disp);font-size:1.3rem;font-weight:650}

/* formulaires guidés */
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg:empty{display:none}
.sugg button{min-height:38px;padding:0 13px;border-radius:99px;border:0;background:var(--soft);color:var(--ink);font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;gap:7px;line-height:1.15;text-align:left}
.sugg button small{color:var(--accent);font-weight:600;font-size:.72rem}
.ib{display:flex;flex-direction:column;gap:12px}
.ibw{display:flex;flex-direction:column;gap:6px}
.ibr{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;gap:6px;align-items:center}
.ibr .ib_n{grid-column:span 2}.ibr .sugg{grid-column:1/-1}.ibr .ib_u{grid-column:span 2}
.ibw + .ibw{padding-top:12px;border-top:1px dashed var(--line2)}
.ibr input.num{padding:8px 6px;text-align:center}
.ib_x{width:44px;height:44px;justify-self:end;border-radius:12px;border:0;background:var(--danger-soft);color:var(--danger);font-size:1.2rem;line-height:1}
.ib_rw:empty{display:none}
button.chip{border:0;min-height:36px}

function buyList(){
  if(_BL) return _BL;
  const rows = [], covered = [], verify = [];
  const avail = {}; Object.entries(S.stock).forEach(([k,o]) => avail[k] = o.q);
  for(const n of needs()){
    const ex = S.menu.extra[n.k];
    if(isMaison(n.name)){ verify.push({...n, manque: !!ex}); if(!ex) continue; }
    const sk = ex ? null : stockKey(n); const st = sk ? avail[sk] : 0;
    if(sk) avail[sk] = Math.max(0, avail[sk] - n.q);
    let def = ex ? n.q : n.q - st;
    if(def <= 0.001){ covered.push({...n, st}); continue; }
    const p = packOf(n.name,n.u);
    const buy = p ? Math.ceil(def/p - 1e-9)*p : n.u==='un' ? Math.max(1, Math.ceil(def - 0.05)) : def;
    rows.push({...n, st, buy});
  }
  return (_BL = {rows, covered, verify});
}

const protein = r => { const t = norm(r.n+' '+r.m.join(' ')); for(const p of ['poulet','boeuf','porc','saucisse','jambon','bacon','poisson','bologne']) if(t.includes(p)) return p; return 'autre'; };
const isPasta = r => /spaghetti|pates|lasagne|tortellini|mac n|gnocchi|carbonara|nouilles|ramen/.test(norm(r.n));
const uses = n => S.hist.reduce((c,w) => c + histItems(w).filter(x => x.r===n).length, 0);
function recentSet(){ return new Set(S.hist.slice(-S.p.cool).flatMap(w => histItems(w).map(x => x.r))); }
function pickVar(r){
  const nv = vars(r).length;
  if(S.p.varMode==='base' || !nv) return 0;
  const u = uses(r.n);
  return S.p.varMode==='var' ? 1 + (u % nv) : u % (nv+1);

const itemDeals = (it, r) => { const ds = dealsOf(r); return r.ur && primOf(it) ? ds.filter(d => !urMatch(r.ur, d.mot) && !urMatch(r.ur, d.hit.t)) : ds; };
/* Coupe ou forme précise dans un spécial : elle doit aussi se trouver dans la recette (pas de boeuf haché pour un rôti). */
const SHAPES = ['hache','roti','steak','cotelette','cote','poitrine','cuisse','pilon','aile','epaule','longe','filet','saucisse','bacon','tranche','cube','laniere','surlonge','bavette','palette','croquette','pane','pizza','lasagne','tourtiere','pogo','burrito','soupe','sauce','croustille','biscuit','yogourt','glacee','gateau','muffin','barre','jus','boisson','vinaigrette','trempette','repas','salade','sandwich','fromage a la creme','poulet','boeuf','porc','dinde','jambon','saumon','crevette','veau','agneau','tilapia','morue','aiglefin','thon','poisson'];
const SHAPE_RE = SHAPES.map(w => [w, new RegExp('\\b'+w)]);
function dealsOf(r){
  const out = [], ing = norm(r.n+' '+r.i.map(g => g[2]).join(' '));
  const fits = s => { const t = norm(s.t); return SHAPE_RE.every(([w,re]) => !re.test(t) || ing.includes(w)); };
  for(const mot of (r.m||[])){ const nm = norm(mot); const hit = allSpec().find(s => norm(s.t).includes(nm) && fits(s)); if(hit && !out.some(x => x.hit===hit)) out.push({mot,hit}); }
  return out;
}
function score(r){
  let pts = 0;
  dealsOf(r).forEach(d => pts += GENERIC.includes(norm(d.mot)) ? .3 : 1.2);
  pts += .35 * [...r.e].filter(c => c!==' ' && c!=='️').length / 2;
  let hit = 0; effective(r,0).forEach(g => { if(isMaison(g.name)) return; const sk = stockKey(g); if(sk) hit += Math.min(1, S.stock[sk].q/Math.max(g.q,1)); });
  pts += Math.min(hit,5)*.4;
  if(S.fav[r.n]) pts += .8;
  if(tmOf(r)<=25) pts += .25;
  if(r.pp && dealsOf(r).length) pts += 2.5;
  if(r.rs && S.p.reste!==false && dealsOf(r).length) pts += .6;
  const rt = S.rate[r.n]; if(rt) pts += Math.max(-2, Math.min(1.5, .5*rt.up - .7*rt.down));
  return pts + Math.random()*.9;
}

function fill(n, keep, l, ban){
  l = l || 'items'; const kind = ML[l];
  const items = keep.slice();
  const banned = new Set([...recentSet(), ...items.map(x => x.r), ...(ban||[])]);
  const pool = allRecipes().filter(r => kindOf(r)===kind && !S.dis[r.n] && !softBad(r) && ppOk(r) && !(ban && ban.has(r.n)));
  let cands = pool.filter(r => !banned.has(r.n));
  if(cands.length < n - items.length) cands = pool.filter(r => !items.some(x => x.r===r.n));
  cands = cands.map(r => ({r, s:score(r)})).sort((a,b) => b.s-a.s);
  const taken = new Set(items.map(x => x.r));
  let pps = items.filter(x => (byName(x.r)||{}).pp).length;
  if(kind!=='souper'){
    for(const {r} of cands){ if(items.length>=n) break; if(taken.has(r.n) || (r.pp && pps>=1)) continue; items.push({r:r.n, v:pickVar(r)}); taken.add(r.n); if(r.pp) pps++; }
    return items;
  }
  const prot = {}; let pastas = 0, longs = 0, duos = items.filter(x => x.after).length; const maxLong = S.p.nLong ?? 1, maxDuo = n>=6 ? 2 : 1;
  const note = r => { const p = protein(r); prot[p] = (prot[p]||0)+1; pastas += isPasta(r)?1:0; longs += isLong(r)?1:0; };
  items.forEach(it => { const r = byName(it.r); if(r) note(r); });
  const push = (r, after) => { const it = mkItem(r, usedSides(items), pickVar(r)); if(after) it.after = after; items.push(it); taken.add(r.n); note(r); if(r.pp) pps++; };
  const pass = lvl => { for(const {r} of cands){
    if(items.length>=n) break; if(taken.has(r.n)) continue;
    if(r.pp && pps>=1) continue;
    const p = protein(r);
    if(lvl===0){ if(p!=='autre' && (prot[p]||0)>=2) continue; if(isPasta(r) && pastas>=2) continue; }
    if(lvl<2 && isLong(r) && longs>=maxLong) continue;
    if(lvl===0 && r.rs && duos>=maxDuo) continue;
    push(r);
    if(r.rs && S.p.reste!==false && duos<maxDuo && items.length < n){ const fu = pickFollow(r, new Set([...taken, ...banned])) || pickFollow(r, taken); if(fu){ push(fu, r.n); duos++; } }
  } };
  pass(0); if(items.length<n) pass(1); if(items.length<n) pass(2);
  return items;
}

const dayOf = v => v ? String(v).slice(0,10) : '';
async function chercherSpeciaux(ignorerDate){
  const st = $('#sp_status'), btn = $('#sp_go');
  const say = t => { if(st) st.textContent = t; };
  if(!btn) return;
  btn.disabled = true;
  const cp = (S.cp||'').replace(/\s/g,'').toUpperCase();
  if(!S.stores.length){ say('Choisis d\'abord tes épiceries dans Réglages.'); btn.disabled = false; return; }
  if(!cp){ say('Entre d\'abord ton code postal dans Réglages.'); btn.disabled = false; return; }
  const shop = shopISO();
  try{
    say('Recherche des circulaires…');
    const fl = await jget(`${FLIPP}/flyers?locale=fr-ca&postal_code=${cp}`);
    const all = (Array.isArray(fl) ? fl : (fl.flyers||[])).filter(f => { const s = marchand(f.merchant); return s && S.stores.includes(s); });
    if(!all.length){ say("Aucune circulaire de tes épiceries trouvée pour ce code postal."); btn.disabled = false; return; }
    const mid = new Date(shop+'T12:00:00').getTime();
    let flyers = all.filter(f => new Date(f.valid_from).getTime() <= mid && new Date(f.valid_to).getTime() >= mid);
    let note = '';
    if(!flyers.length){
      if(!ignorerDate){
        const fin = all.map(f => dayOf(f.valid_to)).sort().pop();
        say(`Aucune circulaire ne couvre le ${fmtDate(shop)} pour l'instant (les circulaires actuelles finissent le ${fin}). Les nouvelles sortent le jeudi : relance la recherche plus tard. `);
        const a = document.createElement('button'); a.className = 'btn s'; a.textContent = 'Utiliser les circulaires actuelles quand même'; a.onclick = () => chercherSpeciaux(true); st.appendChild(a);
        btn.disabled = false; return;
      }
      const now = Date.now(); flyers = all.filter(f => new Date(f.valid_from).getTime() <= now && new Date(f.valid_to).getTime() >= now);
      note = ' (circulaires actuelles, possiblement expirées à la date de l\'épicerie)';
    }
    flyers = flyers.filter(GROCERY_CAT).sort((a,b) => (/grocer|epicer/.test(norm(String(b.categories_csv||b.categories||'')))?1:0) - (/grocer|epicer/.test(norm(String(a.categories_csv||a.categories||'')))?1:0)).slice(0,18);
    const mots = motsCles(); const items = []; let ok = 0;
    for(let k = 0; k < flyers.length; k++){
      const f = flyers[k]; say(`Lecture de la circulaire ${k+1} / ${flyers.length} : ${marchand(f.merchant)}…`);
      try{
        const d = await jget(`${FLIPP}/flyers/${f.id}?locale=fr-ca&postal_code=${cp}`);
        (Array.isArray(d) ? d : (d.items||[])).forEach(it => {
          const nn = norm(it.name||''); if(!nn || !mots.some(w => nn.includes(w))) return;
          const pr = parseFloat(it.price||it.current_price); 
          items.push({s:marchand(f.merchant), t:it.name, p:isFinite(pr)&&pr>0 ? pr.toFixed(2).replace('.',',')+' $' : '', vf:dayOf(it.valid_from||f.valid_from), vt:dayOf(it.valid_to||f.valid_to), d:it.discount||0});
        });
        ok++;
      }catch(e){}
    }
    if(!ok){ say('Les circulaires ont été trouvées, mais leur contenu est illisible. Utilise le collage manuel ci-dessous.'); btn.disabled = false; return; }
    const uniq = new Map(); items.forEach(i => uniq.set(i.s+'|'+norm(i.t), i));
    const list = [...uniq.values()].sort((a,b) => (b.d||0)-(a.d||0)).slice(0,400);
    S.auto = {items:list, maj:isoToday(), src:[...new Set(flyers.map(f => marchand(f.merchant)))].join(', ')};
    save(); render();
    const s2 = $('#sp_status'); if(s2) s2.textContent = `${list.length} spéciaux retenus dans ${ok} circulaires (${S.auto.src}) pour le ${fmtDate(shop)}${note}.` + ((S.skip||[]).some(s => S.stores.includes(s)) ? ` Cette semaine : ${autoItems().length} chez ${goStores().join(', ') || 'aucune épicerie'}.` : '');
  }catch(e){
    say(e instanceof TypeError
      ? "Le navigateur a bloqué la requête vers Flipp ou tu es hors ligne. Ouvre « Si la recherche ne fonctionne pas » : colle le texte d'une circulaire, ou ajoute un relais."
      : 'La recherche a échoué ('+(e.message||'erreur')+'). Réessaie plus tard ou colle le texte de la circulaire.');
    btn.disabled = false; return;
  }
}

async function copier(text, msgId){

const RAY_WORDS = {
  'viandes':['poulet','boeuf','porc','saucisse','jambon','bacon','dinde','bologne','agneau','steak','cote','pepperoni','salami','bavette','filet mignon'],
  'poissonnerie':['poisson','saumon','crevette','morue','aiglefin','thon'],
  'produits laitiers':['lait','creme','fromage','beurre','yogourt','oeuf','mozzarella','cheddar','parmesan','feta','ricotta','babeurre'],
  'fruits et légumes':['oignon','ail','tomate','laitue','carotte','poivron','brocoli','patate','pomme','concombre','champignon','chou','epinard','avocat','citron','lime','celeri','persil','coriandre','ananas','courgette','mais frais','haricot vert','salade','basilic','ciboulette','aneth','menthe','gingembre','echalote','poireau','radis','betterave','navet','fraise','framboise','banane','raisin','poire','melon','mangue','kiwi','clementine','herbes fraiches'],
  'boulangerie':['pain','tortilla','pita','naan','bun','brioche','sous-marin','hamburger','hot-dog'],
  'surgelés':['surgele','frite','egg roll','pogo','pate a tarte','abaisse'],
  'garde-manger':['farine','sucre','sel','poivre','epice','cannelle','paprika','cayenne','cumin','origan','huile','fecule','poudre','bicarbonate','cassonade']
};
function guessRayon(name){
  const n = norm(name);
  for(const [ray,words] of Object.entries(RAY_WORDS)) if(words.some(w => n.includes(w))) return ray;
  return 'épicerie';
}
/* ---------- formulaires guidés : catalogue d'aliments ---------- */
const UNITS = [['un','unités'],['g','g'],['kg','kg'],['ml','ml'],['L','L']];
const toBase = (q,u) => u==='kg' ? [q*1000,'g'] : u==='L' ? [q*1000,'ml'] : [q, u];
const niceUnit = (q,u) => u==='g' && q>=1000 && q%100===0 ? [q/1000,'kg'] : u==='ml' && q>=1000 && q%100===0 ? [q/1000,'L'] : [q, u];
const lowFirst = s => s ? s.charAt(0).toLowerCase()+s.slice(1) : s;
const plain = n => String(n||'').replace(/\s*\([^)]*\)/g,'').trim();
function catalog(){
  if(_CAT) return _CAT;
  const m = new Map();
  const add = (n,u,ray,w) => { const nm = plain(n); const b = baseOf(nm); if(!b || b.length<2) return; let o = m.get(b); if(!o){ o = {b, names:{}, units:{}, rays:{}}; m.set(b,o); } o.names[nm]=(o.names[nm]||0)+w; o.units[u]=(o.units[u]||0)+w; o.rays[ray]=(o.rays[ray]||0)+w; };
  allRecipes().forEach(r => { r.i.forEach(g => add(g[2],g[1],g[3],1)); (r.v||[]).forEach(v => deltaItems(v[1]).add.forEach(a => add(a.name,a.u,a.ray||guessRayon(a.name),1))); });
  SIDES.concat(S.sidesx||[]).forEach(s => s.i.forEach(g => add(g[2],g[1],g[3],1)));
  ESS_START().concat(S.ess||[], S.snacks||[]).forEach(s => add(s.name,s.u,s.r,2));
  Object.values(S.stock).forEach(o => add(o.name,o.u,o.rayon||'épicerie',2));
  const top = o => Object.entries(o).sort((a,b) => b[1]-a[1])[0][0];
  _CAT = [...m.values()].map(o => { const n = top(o.names), ray = top(o.rays); return {n:cap(n), u:top(o.units), ray:RAYONS.includes(ray) ? ray : guessRayon(n), b:o.b}; }).sort((a,b) => a.n.localeCompare(b.n,'fr'));
  return _CAT;
}
const catFind = name => { const b = baseOf(plain(name)); return b ? catalog().find(c => c.b===b) || null : null; };
function catSearch(q, max){
  const n = norm(q).trim(); if(n.length<2) return [];
  const words = n.split(/\s+/);
  return catalog().filter(c => { const t = norm(c.n); return words.every(w => t.includes(w)); })
    .sort((a,b) => (norm(b.n).startsWith(n)?1:0) - (norm(a.n).startsWith(n)?1:0) || a.n.length - b.n.length).slice(0, max||6);
}
function catGuess(c){
  const n = norm(c.n);
  if(c.ray==='viandes' || c.ray==='poissonnerie') return 'p';
  if(/abaisse|pate a tarte|pate feuillet|pate a pizza/.test(n)) return '';
  if(/frite|pomme de terre|patate|\briz\b|\bpates\b|spaghetti|macaroni|penne|fusilli|linguine|rotini|tortellini|ravioli|orzo|vermicelle|nouille|pain|tortilla|naan|gnocchi|egg roll|rouleau|couscous|quinoa/.test(n)) return 'f';
  if(/brocoli|haricot|mais|pois|carotte|salade|laitue|concombre|chou|epinard|courgette|poivron|legume/.test(n)) return 'v';
  if(/yogourt|ficelle|croustille|barre|biscuit|compote|noix|amande|fromage|craquelin|muffin|fruit/.test(n)) return 'c';
  return '';
}

const say = (el, txt) => { if(el){ el.textContent = txt; el.hidden = !txt; } };
function bindDraft(t){
  const dk = t.dataset && t.dataset.dk, df = t.dataset && t.dataset.df; if(!dk || !df || !drafts[dk]) return false;
  const d = drafts[dk];
  if(df==='rem' || t.dataset.arr){ const s = new Set(d[df]||[]); if(t.checked) s.add(t.value); else s.delete(t.value); d[df] = [...s]; }
  else if(t.type==='checkbox') d[df] = t.checked;
  else if(t.multiple) d[df] = [...t.selectedOptions].map(o => o.value);

const ingBuilder = (key, rows) => `<div class="ib">${rows.map((x,j) => ibRow(key,j,x)).join('')}<button type="button" class="btn s" data-a="ib_add" data-ib="${esc(key)}">+ Ajouter un ingrédient</button></div>`;
function readRows(rows){
  const ing = []; let err = '';
  rows.forEach((x,j) => {
    const n = String(x.n||'').trim(), qs = String(x.q||'').trim();
    if(!n && !qs) return;
    if(!n){ err = err || `Ligne ${j+1} : choisis un aliment.`; return; }
    const q = parseFloat(qs.replace(',','.'));
    if(!(q>0)){ err = err || `« ${n} » : indique une quantité.`; return; }
    const [qq,uu] = toBase(q, x.u||'un'), c = catFind(n);
    ing.push([qq, uu, lowFirst(n), c ? c.ray : (x.ray || guessRayon(n))]);
  });
  return {ing, err};
}

let rf = {q:'', k:'', pr:'', st:'', g:'pr', fast:false, fav:false, dis:false}, openRec = new Set();
function recFiltered(){
  const q = norm(rf.q);
  return allRecipes().filter(r => {
    if(rf.k==='acc') return false;
    if(q && !norm(r.n+' '+(r.m||[]).join(' ')+' '+r.i.map(g => g[2]).join(' ')+' '+vars(r).map(v => v[0]).join(' ')).includes(q)) return false;
    if(rf.k && kindOf(r)!==rf.k) return false;
    if(rf.pr && prOf(r)!==rf.pr) return false;
    if(rf.st && !styOf(r).includes(rf.st)) return false;
    if(rf.fast && tmOf(r) > 30) return false;
    if(rf.fav && !S.fav[r.n]) return false;
    if(!!S.dis[r.n] !== !!rf.dis) return false;
    return true;
  }).sort((a,b) => a.n.localeCompare(b.n,'fr'));
}

function varFromDraft(key){
  const d = drafts[key]; if(!d) return {err:'Rien à enregistrer.'};
  const nm = String(d.nm||'').trim(); if(!nm) return {err:'Donne un nom à la version.'};
  const {ing, err} = readRows(d.rows); if(err) return {err};
  const toks = ing.map(([q,u,n,ray]) => `+${q} ${u} ${n}|${ray}`).concat((d.rem||[]).map(n => `-${n}`), d.keep||[]);
  if(d.f!=='def') toks.push('@f='+(d.f||'aucun'));

  const title = String(d.ds||'').trim() ? nm+' : '+String(d.ds).trim() : nm, p = String(d.p||'').trim();
  return {val: p ? [title, toks.join(' ; '), p] : [title, toks.join(' ; ')]};
}

/* Accompagnements d'une recette : « varié » (l'application choisit), aucun, ou un accompagnement fixe. */
function recSides(r){
  const base = RECIPES.find(x => x.n===r.n) || r, nm = id => (sideById(id)||{}).n || '';
  const sel = slot => { const cur = (slot==='f' ? r.sf : r.sv) ?? '', fixed = r.fx && r.fx[slot] && sideById(cur), pref = !fixed && cur && cur!=='auto' && sideById(cur) ? nm(cur) : '';

    return `<option value="auto" ${val==='auto'?'selected':''}>Varié chaque semaine${pref ? ' (souvent '+esc(pref.toLowerCase())+')' : ''}</option><option value="" ${val===''?'selected':''}>Aucun</option>`
      + sidesOf(slot).filter(s => !s.id.startsWith('st:')).map(s => `<option value="${esc(s.id)}" ${val===s.id?'selected':''}>${esc(s.n)}${(S.sdis||{})[s.id]?' (mis de côté)':''}</option>`).join(''); };
  return `<div class="sidepick"><p class="small"><b>Accompagnements</b> (${esc((TYPES[r.t||'viande']||'').toLowerCase())}). Varié : l'application choisit chaque semaine parmi ceux qui vont avec ce plat. Choisis-en un pour l'avoir à tout coup.</p>
    <div class="grid2"><label class="f">Féculent<select data-a="rside" data-r="${esc(r.n)}" data-s="f">${sel('f')}</select></label><label class="f">Légume ou salade<select data-a="rside" data-r="${esc(r.n)}" data-s="v">${sel('v')}</select></label></div></div>`;
}
function setRecSide(name, slot, val){
  const r = byName(name); if(!r) return;
  const base = RECIPES.find(x => x.n===name), key = slot==='f' ? 'sf' : 'sv';
  const fx = Object.assign({}, r.fx||{}); let sv;
  if(val==='auto'){ const orig = base ? base[key] : r[key]; sv = orig && orig!=='' ? orig : 'auto'; fx[slot] = false; }
  else if(val===''){ sv = ''; fx[slot] = false; }
  else { sv = val; fx[slot] = true; }
  if(r.c){ const c = S.custom.find(x => x.n===name); if(c){ c[key] = sv; c.fx = fx; } }
  else S.redit[name] = Object.assign({}, S.redit[name]||{}, {[key]:sv, fx});
  openRec.add(name); save(); render();
}

function saveRecette(){
  const d = drafts.new, msg = $('#nr_msg'); if(!d) return;
  const name = String(d.n||'').trim();
  if(!name){ say(msg, 'Donne un nom au plat.'); return; }
  if(allRecipes().some(r => norm(r.n)===norm(name))){ say(msg, 'Une recette porte déjà ce nom.'); return; }
  const {ing, err} = readRows(d.rows); if(err){ say(msg, err); return; }
  if(!ing.length){ say(msg, 'Ajoute au moins un ingrédient.'); return; }
  let mots = String(d.m||'').split(',').map(x => x.trim()).filter(Boolean);
  if(!mots.length) mots = autoMots(ing, name);
  const k = d.k;
  S.custom.push({n:name, e:d.fam ? 'ff' : '', m:mots, k, pr:d.pr, st:d.st, t:d.t, tm:+d.tm, sf:k==='souper' ? d.sf : '', sv:k==='souper' ? d.sv : '', nw:true, c:true, i:ing, s:String(d.s||'').trim(), v:[]});
  delete drafts.new; openRec.delete('__new'); openRec.add(name); rf = Object.assign(rf, {q:'', k:'', pr:'', st:'', fast:false, fav:false, dis:false});
  save(); render();
}
function saveRecEdit(btn){
  const r = byName(btn.dataset.r), key = 'edit|'+btn.dataset.r, d = drafts[key], msg = btn.closest('.rbox').querySelector('.re_msg'); if(!r || !d) return;
  const {ing, err} = readRows(d.rows); if(err){ say(msg, err); return; }
  if(!ing.length){ say(msg, 'La recette doit garder au moins un ingrédient.'); return; }
  const k = d.k;
  const patch = {k, pr:d.pr, st:d.st, t:d.t, tm:+d.tm, sf:k==='souper' ? d.sf : '', sv:k==='souper' ? d.sv : '', i:ing, m:String(d.m||'').split(',').map(x => x.trim()).filter(Boolean), s:String(d.s||'').trim()};
  if(r.c) Object.assign(S.custom.find(x => x.n===r.n), patch); else S.redit[r.n] = patch;
  delete S.tmx[r.n]; delete drafts[key]; openPan.delete(key); openRec.add(r.n); save(); render();
}
function saveSide(){
  const d = drafts.side, msg = $('#ns_msg'); if(!d) return;
  const n = String(d.n||'').trim(); if(!n){ say(msg, "Donne un nom à l'accompagnement."); return; }

}

function arm(btn, label, fn){
  if(btn.dataset.armed==='1'){ fn(); return; }
  btn.dataset.armed='1'; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent = old; } }, 3500);

function terminerSemaine(){
  needs().forEach(n => {
    if(isMaison(n.name)) return;
    const sk = stockKey(n); const st = sk ? S.stock[sk] : null; if(!st) return;
    st.q = Math.max(0, st.q - n.q); if(st.q <= 0.001) delete S.stock[sk];
  });
  S.hist.push({date:S.menu.date, items:S.menu.items.map(x => ({r:x.r, v:x.v, sf:x.sf||'', sv:x.sv||''})), ent:mlist('ent').map(x => ({r:x.r, v:x.v})), sou:mlist('sou').map(x => ({r:x.r, v:x.v})), des:mlist('des').map(x => ({r:x.r, v:x.v})), paid:S.menu.paid||0});
  S.hist = S.hist.slice(-26);
  S.menu = {date:'', items:(S.report||[]).map(x => Object.assign({}, x, {lock:true, rep:true})), ent:[], sou:[], des:[], chk:{}, extra:{}, achete:false, snap:null, useup:{}};

}
function epicerieFaite(){
  const {rows} = buyList();
  rows.forEach(r => {
    if(!S.menu.chk[r.k]) return;
    const o = S.stock[r.k]; if(o) o.q += r.buy; else S.stock[r.k] = {name:r.name, u:r.u, q:r.buy, rayon:r.rayon};
  });
  S.menu.snap = rows.map(r => ({name:r.name, u:r.u, buy:r.buy, ok:!!S.menu.chk[r.k]}));
  S.menu.achete = true; save(); render();
}
function ajouterSpeciaux(){
  const store = $('#spstore').value; const lines = $('#sptxt').value.split(/\n+/).map(x => x.trim()).filter(x => x.length>=4 && x.length<=140);
  const mots = new Set(allRecipes().flatMap(r => (r.m||[]).map(norm)));
  const keep = lines.filter(l => { const n = norm(l); return [...mots].some(m => m.length>=4 && n.includes(m)); });
  const known = new Set(S.spec.map(s => s.s+'|'+norm(s.t)));
  let added = 0;
  keep.forEach(l => { const k = store+'|'+norm(l); if(!known.has(k)){ S.spec.push({s:store, t:l}); added++; } });
  S.spec = S.spec.slice(-120);
  save(); render();
  const msg = $('#spmsg'); if(msg) msg.textContent = `${added} spéciaux retenus sur ${lines.length} lignes.`;
}

/* ---------- aide ---------- */
function renderAide(){

  <div class="card"><h3>À quoi sert cette application</h3><p>Elle planifie les soupers, les entrées et les desserts de la semaine, tient compte des spéciaux de tes épiceries et de ce qu'il y a déjà à la maison, et produit <b>une seule liste d'épicerie complète</b>. Tes données restent sur ton téléphone.</p></div>`

    <li>Ouvre toujours l'application par <b>son icône</b>.</li></ol>

  + D('2. Première configuration', `<p>Au premier lancement, la carte <b>Bienvenue</b> du Menu te demande :</p>
    <ul><li><b>Ton code postal</b> : il sert à trouver les circulaires de ta région.</li>
    <li><b>Tes épiceries</b> : seules leurs circulaires sont lues pour les spéciaux. Elles sont classées par genre (supermarchés, escompte, grandes surfaces comme Walmart et Costco, santé et vrac, pharmacies). Le bouton <b>Trouver les épiceries de mon code postal</b> montre celles qui ont une circulaire près de chez toi, y compris les marchés de ta région. Une épicerie manque ? Écris son nom sous « Une épicerie manque ? ».</li>
    <li><b>Combien de soupers, d'entrées et de desserts</b> par semaine.</li>
    <li><b>Les portions</b> : au souper, et en restes pour le dîner du lendemain. Chaque souper est calculé pour la somme des deux.</li>
    <li>Si tu veux, une <b>liste de départ</b> pour les déjeuners, lunchs, collations et boissons. Sinon, l'application reste vide et tu ajoutes tes articles dans Réglages.</li></ul>
    <p>Tout se change ensuite dans <b>Réglages</b>.</p>`)
  + D('3. Faire le menu de la semaine', `<ol>
    <li>Règle les dates : <b>Je planifie le</b> et <b>J'achète le</b>. Les spéciaux retenus sont ceux valides le jour de l'épicerie.</li>
    <li>Tu ne vas qu'à une de tes épiceries cette semaine (seulement Maxi, par exemple) ? Sur la carte de la semaine, sous « Cette semaine, je vais chez », décoche les autres : leurs spéciaux sont ignorés et toute la liste va à celle qui reste. Recoche-les quand tu veux. La liste complète de tes épiceries se change dans Réglages.</li>
    <li>Une envie précise ? <b>Ajouter un plat de mon choix</b> (Menu) : cherche un plat, une version ou un ingrédient (burger Nashville, saumon, potage), puis choisis le jour. Le plat reste au menu quand tu le refais. Tu peux le faire avant de créer le menu : l'application complète le reste. Dans Recettes, le bouton <b>Ajouter au menu de la semaine</b> fait la même chose.</li>
    <li><b>Reporter un souper</b> : resto ou changement de plan ? Ouvre le plat, touche <b>Reporter</b> : « À demain » fait glisser les soupers suivants d'un jour jusqu'au prochain soir libre; « À la semaine prochaine » le met de côté, il sera déjà au menu de la semaine suivante et ses ingrédients restent dans Maison. La carte Aujourd'hui a aussi « On mange au resto : reporter à demain ».</li>
    <li><b>Portions</b> : ouvre un plat et choisis le nombre de portions (2 pour un souper à deux, 12 quand on reçoit). La liste d'épicerie s'ajuste.</li>
    <li><b>Je reçois ou repas à deux</b> (Menu) : choisis des plats et le nombre de personnes. L'application fait une liste d'épicerie juste pour ce repas, que tu peux copier pour une course de dernière minute, ou mettre au menu un soir de la semaine.</li>
    <li>Touche <b>Chercher les spéciaux</b>, puis <b>Créer le menu</b>. Les plats sont choisis selon les spéciaux, ce qui est déjà à la maison, tes favoris et le temps de préparation, sans répéter les plats récents ni ceux mis de côté.</li>
    <li>En haut du Menu, les menus <b>Soupers</b>, <b>Entrées</b> et <b>Desserts</b> changent le nombre de plats : le menu s'ajuste aussitôt.</li>
    <li>Sur chaque souper, ouvre <b>Accompagnements</b> pour choisir le féculent et le légume ou salade, leur quantité (Aucun, Moins, Normal, Plus, Double) et les portions du repas.</li>
    <li>Les pastilles <b>Normale, Épicée…</b> changent la version. Le détail de la version (ingrédients ajoutés ou retirés, préparation) s'affiche dessous.</li>
    <li><b>Garder</b> verrouille un plat, <b>Autre plat</b> le remplace. Le bouton <b>Plus</b> contient <b>Copier la recette</b>, <b>Je n'aime pas</b> (le plat est mis de côté pour de bon et remplacé) et <b>Retirer du menu</b>. Dans « Recette et ingrédients », « retirer » enlève un ingrédient de la liste.</li>

    <li>Les plats « à la mijoteuse » se préparent le matin en 15 minutes : ils vont bien un jour de travail.</li>
    <li>La carte <b>Aujourd'hui</b>, en haut du Menu, montre le souper de ce soir et celui de demain, avec les rappels : sortir la viande du congélateur la veille, partir la mijoteuse le matin, garder des restes.</li></ul>`)
  + D('5. Cuisiner une fois, manger deux fois', `<ul><li>Quand une grosse pièce est au menu (épaule de jambon, poulet entier, rôti de porc…), un deuxième plat qui utilise ses restes est ajouté plus tard dans la semaine : sandwichs au jambon haché, croque-monsieur, pâtes au jambon, pâté au poulet…</li>

    <li>La carte <b>Collations en spécial</b> (Menu) propose des fruits, yogourts, fromages, craquelins, barres et autres collations annoncés dans tes circulaires. « Ajouter » en met un paquet dans la liste pour cette semaine seulement. Pour ne plus la voir : Réglages, carte « Mes collations ».</li>
    <li>Les <b>plats préparés</b> (pizza, lasagne ou pâté surgelés, poulet rôti ou sushis du comptoir…) portent l'étiquette <b>Prêt à servir</b>, et <b>En spécial</b> quand une de tes circulaires les annonce.</li>

  + D('7. Après le repas : on a aimé ou pas', `<p>Le jour même ou après, touche <b>On a aimé</b> ou <b>Pas aimé</b> sur la carte du souper. Un plat aimé revient plus souvent; un plat peu aimé revient moins souvent, et après deux « Pas aimé » il n'est plus proposé automatiquement (tu peux toujours l'ajouter toi-même). Pour l'écarter pour de bon, utilise <b>Je n'aime pas</b>.</p>`)

    <li>Un aliment que l'application ne connaît pas est accepté : vérifie alors son rayon et sa catégorie. « Féculent » ou « Légume ou salade » en fait un accompagnement possible (un sac de rouleaux de printemps, par exemple).</li>

  + D("9. Faire l'épicerie une seule fois", `<ol><li>L'onglet <b>Épicerie</b> classe tout <b>par rayon</b> ou <b>par magasin</b>. Par magasin, chaque article va à l'épicerie où il est le moins cher en spécial; le reste va à ton épicerie principale (Réglages).</li>

    <li>« Vérifier avant de partir » rappelle les articles toujours à la maison : touche <b>Il manque</b> au besoin.</li>
    <li>Avec un <b>budget</b> (Réglages), l'onglet montre ton budget et le coût estimé des articles en spécial. Au retour, inscris le <b>total payé</b> à la caisse : la moyenne payée s'affiche dans Réglages, carte Historique.</li>
    <li>Coche les articles dans le panier, puis touche <b>Épicerie terminée</b> au retour : ils entrent dans Maison.</li></ol>`)
  + D('10. Terminer la semaine', `<p><b>Terminer la semaine</b> (Menu) retire de Maison ce qui a été utilisé, garde les restes et range les plats dans l'historique. Exemple : 12 oeufs achetés, 8 utilisés, il en reste 4 pour la semaine suivante.</p>`)
  + D('11. Copier, envoyer et importer', `<ul><li>Rien n'est partagé automatiquement. La carte <b>Copier pour envoyer</b> copie la liste d'épicerie, le menu de la semaine ou le menu détaillé. Colle le texte dans un message ou dans Notes.</li>

    <li><b>Recette d'un site Internet</b> (Ricardo, 5-15, Pratico-pratiques…) : dans Safari, sélectionne le titre, les ingrédients et la préparation, touche Copier, puis colle dans « Importer une recette copiée ». L'application comprend les mesures (c. à soupe, tasse, lb, boîte de 796 ml), les fractions et les mots de préparation (haché, en dés, au goût), relie chaque ingrédient à un aliment connu et ajuste la recette à 6 portions. Le formulaire « Nouvelle recette » se remplit : vérifie, puis enregistre. Astuce : le bouton Partager → Copier ne copie que le lien; la version « Imprimer » du site rend la sélection plus facile.</li></ul>`)

    <li>Si le navigateur bloque la requête, copie le texte d'une circulaire (<a href="https://flipp.com/fr-ca" target="_blank" rel="noopener">Flipp</a>) et colle-le dans « Si la recherche ne fonctionne pas ».</li>
    <li>Sans spéciaux, tout fonctionne : le menu est simplement choisi sans les rabais.</li></ul>`)
  + D('14. Sauvegarder', `<p>Les données sont enregistrées sur ce téléphone à chaque action. Elles peuvent disparaître si tu effaces les données de Safari ou supprimes l'icône. Une fois par mois, dans Réglages, touche <b>Copier la sauvegarde</b> et colle-la dans Notes.</p>`)
  + D('15. Questions fréquentes', `<p><b>Le menu ne change pas quand je le refais.</b> Les plats « Gardé » restent; une fois l'épicerie terminée, le menu est verrouillé jusqu'à « Terminer la semaine ».</p>
    <p><b>Un article est en double.</b> Deux recettes le nomment différemment; additionne-les en magasin.</p>
    <p><b>Les quantités ne conviennent pas.</b> Ajuste les portions (Réglages ou repas par repas), les quantités d'accompagnements, ou modifie la recette. Les quantités des recettes sont des estimations : corrige celles qui ne conviennent pas à ta famille.</p>
    <p><b>Un spécial ne correspond pas au plat.</b> Les circulaires sont lues par mots-clés : vérifie l'étiquette jaune avant d'acheter.</p>
    <p><b>Tout recommencer.</b> Réglages → « Tout remettre à zéro ».</p>`);
}

(function init(){
  try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  loadLocal();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
  render();
  setSync('Enregistré sur cet appareil');
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>
